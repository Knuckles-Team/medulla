# MEDULLA-CONTRACT-R066.2: the prebuilt embedded analytical database library that
# release and serving builds link, pinned by version and checksum.
#
# `version` is the engine release, not the crate version: the `duckdb` crate
# version `1.<MM><mm><pp>.x` embeds engine `1.<MM>.<pp>` (crate 1.10506.1 -> 1.5.6),
# and a test asserts the two stay equal. `scripts/fetch_duckdb_lib.py` downloads the
# archive named by `url`, refuses a SHA-256 mismatch and prints the directory that
# `DUCKDB_LIB_DIR` names.
version = "1.5.6"
url = "https://github.com/duckdb/duckdb/releases/download/v{version}/libduckdb-{platform}.zip"

[checksums]
linux-amd64 = "b845005f5132a7d8180057c35e14a7626632258782f871a90861b19c1c03841b"
linux-arm64 = "b72ed9f05003f5e9d2015f7ceada6416b377d9dd33169cdde3c9e33897856eee"
osx-universal = "e0bc007d9b0094c0970ac1847a8601d10aad07cbd2910ce586ec810f77b638d6"
windows-amd64 = "44cf59583f9951d2cb09b1bf115a63ecb2d8901e363903029d86c7d8683fe96a"
windows-arm64 = "c63285647e94c46d309b60d5dd1ff3cb2cdf9ca03e415a818ff7d8dbf838e0e8"

[targets]
x86_64-unknown-linux-gnu = "linux-amd64"
aarch64-unknown-linux-gnu = "linux-arm64"
x86_64-apple-darwin = "osx-universal"
aarch64-apple-darwin = "osx-universal"
x86_64-pc-windows-msvc = "windows-amd64"
aarch64-pc-windows-msvc = "windows-arm64"
