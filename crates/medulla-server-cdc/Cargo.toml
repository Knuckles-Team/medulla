[package]
name = "medulla-server-cdc"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Change data capture hub, CEP, materialised views, reasoning cascade and impact watch"
license = "MIT"
publish = false

[lib]
name = "medulla_server_cdc"
path = "src/lib.rs"

[dependencies]
medulla-server-api = { path = "../medulla-server-api" }
dashmap = "6.2"
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rand = "0.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-query-cache = { path = "../medulla-query-cache" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-reasoner = { path = "../medulla-reasoner" }

medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-exec = { path = "../medulla-exec" }

[features]
broker = ["medulla-server-api/broker"]
cdc-kafka = ["streaming", "dep:medulla-stream", "medulla-server-api/cdc-kafka"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic"]
matview = ["query", "result-cache", "streaming", "medulla-server-api/matview"]
mining = ["medulla-server-api/mining"]
modality-serving = ["security", "streaming", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-server-api/modality-serving"]
owl = ["dep:medulla-rdf", "medulla-server-api/owl"]
query = ["dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query"]
reasoning = ["medulla-server-api/reasoning"]
result-cache = ["medulla-server-api/result-cache"]
security = ["medulla-server-api/security"]
shacl = ["dep:medulla-shacl", "medulla-server-api/shacl"]
stream = ["query", "dep:medulla-stream", "dep:medulla-plan", "medulla-server-api/stream"]
streaming = ["medulla-server-api/streaming"]

[dev-dependencies]
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
