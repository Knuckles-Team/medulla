[package]
name = "medulla-sql"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: SQL dialect: parse, classify, plan and execute over tables"
license = "MIT"
publish = false

[lib]
name = "medulla_sql"
path = "src/lib.rs"

[dependencies]
medulla-query = { path = "../medulla-query" }
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
medulla-compute = { path = "../medulla-compute" }
medulla-ann = { path = "../medulla-ann", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
datafusion = { version = "54", default-features = false, optional = true, features = [
    "nested_expressions",
    "sql",
] }
arrow = { version = "58.4", optional = true }
arrow-schema = { version = "58.4", optional = true }
iceberg = { version = "0.10", optional = true }
iceberg-catalog-rest = { version = "0.10", optional = true }
iceberg-storage-opendal = { version = "0.10", optional = true, default-features = false, features = [
    "opendal-s3",
] }
petgraph = { version = "0.8.3", features = ["serde-1"], optional = true }
tokio = { version = "1.53", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "std",
] }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }

[features]
finance = ["sql", "medulla-query/finance"]
iceberg-federation = ["dep:iceberg", "dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal", "medulla-query/iceberg-federation"]
numeric = ["sql", "dep:medulla-numeric", "dep:ndarray", "dep:medulla-tsdb", "medulla-query/numeric"]
sql = ["iceberg-federation", "dep:datafusion", "dep:arrow", "dep:arrow-schema", "dep:tokio", "dep:petgraph", "dep:tracing", "dep:async-trait", "dep:redb", "dep:medulla-storage", "dep:medulla-transaction", "dep:medulla-text", "dep:medulla-ann", "dep:futures-util", "dep:md-5", "dep:sha1", "dep:sha2", "dep:hex", "dep:base64", "dep:ipnet", "medulla-query/sql"]
