

[package]
name = "medulla-h-admin"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (admin)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_admin"
path = "src/lib.rs"

[dependencies]
medulla-version = { path = "../medulla-version" }
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-decision-program-types = { path = "../medulla-decision-program-types" }
