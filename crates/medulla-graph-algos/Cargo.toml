[package]
name = "medulla-graph-algos"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Graph algorithms and graph learning"
license = "MIT"
publish = false

[lib]
name = "medulla_graph_algos"
path = "src/lib.rs"

[dependencies]
medulla-compute = { path = "../medulla-compute" }
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.8.3", features = ["serde-1"] }
rayon = "1.12"
tracing = "0.1"
medulla-modality = { path = "../medulla-modality", optional = true }

[features]
contract = ["dep:medulla-modality", "medulla-compute/contract"]
graphlearn = ["medulla-compute/graphlearn"]
