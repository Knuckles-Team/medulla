[package]
name = "medulla-virtual-graph"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Attached sources read as virtual graphs: OBDA mappings, source selection and source authority checks"
license = "MIT"
publish = false

[lib]
name = "medulla_virtual_graph"
path = "src/lib.rs"

[dependencies]
medulla-rdf = { path = "../medulla-rdf" }
medulla-core = { path = "../medulla-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
medulla-types = { path = "../medulla-types" }
oxrdf = { version = "0.3", optional = true }
spargebra = { version = "0.4", optional = true }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
medulla-identity-core-types = { path = "../medulla-identity-core-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
rdf = ["dep:oxrdf", "medulla-rdf/rdf", "medulla-types/rdf"]
sparql = ["rdf", "dep:spargebra", "medulla-rdf/sparql", "medulla-types/sparql"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types", features = ["test-support"] }
medulla-identity-core-types = { path = "../medulla-identity-core-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
