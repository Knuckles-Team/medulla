graphlearn = ["medulla-compute-assemble/graphlearn", "medulla-graph-algos/graphlearn", "medulla-kernel/graphlearn", "medulla-protocol-types/graphlearn", "medulla-result-types/graphlearn", "medulla-server-api/graphlearn", "medulla-server-mutation/graphlearn", "medulla-types/graphlearn", "medulla-query-types/graphlearn", "medulla-h-graph-gateway/graphlearn"]
graphql = ["security", "medulla-kernel/graphql", "medulla-protocol-types/graphql", "medulla-raft/graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-server-mutation/graphql", "medulla-server-ops/graphql", "medulla-types/graphql", "server", "medulla-h-graph-gateway/graphql"]
mining = ["query", "tsdb", "medulla-compute-assemble/mining", "medulla-kernel/mining", "medulla-protocol-types/mining", "medulla-result-types/mining", "medulla-server-api/mining", "medulla-server-auth/mining", "medulla-server-cdc/mining", "medulla-server-mutation/mining", "medulla-server-ops/mining", "medulla-types/mining", "medulla-query-types/mining", "medulla-h-graph-gateway/mining"]
ml-pipeline = ["mining", "graphlearn", "medulla-kernel/ml-pipeline", "medulla-protocol-types/ml-pipeline", "medulla-result-types/ml-pipeline", "medulla-server-api/ml-pipeline", "medulla-server-mutation/ml-pipeline", "medulla-types/ml-pipeline", "medulla-query-types/ml-pipeline", "medulla-h-graph-gateway/ml-pipeline"]
numeric = ["dep:medulla-numeric", "medulla-kernel/numeric", "medulla-persistence/numeric", "medulla-raft/numeric", "medulla-server-api/numeric", "medulla-h-graph-gateway/numeric"]
owl = ["sparql", "medulla-persistence/owl", "medulla-protocol-types/owl", "medulla-raft/owl", "medulla-server-api/owl", "medulla-server-cdc/owl", "medulla-server-ops/owl", "medulla-types/owl", "medulla-query-types/owl", "server", "medulla-h-graph-gateway/owl"]
query = ["redb", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-raft/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-cdc/query", "medulla-server-mutation/query", "medulla-server-ops/query", "medulla-types/query", "medulla-query-types/query", "medulla-h-graph-gateway/query"]
raft = ["redb", "medulla-kernel/raft", "medulla-persistence/raft", "medulla-raft/raft", "medulla-server-api/raft", "medulla-server-auth/raft", "medulla-server-mutation/raft", "server", "medulla-h-graph-gateway/raft"]
rdf = ["medulla-kernel/rdf", "medulla-persistence-records/rdf", "medulla-persistence/rdf", "medulla-protocol-types/rdf", "medulla-server-api/rdf", "medulla-server-mutation/rdf", "medulla-types/rdf", "server", "medulla-h-graph-gateway/rdf"]
reasoning = ["medulla-compute-assemble/reasoning", "medulla-kernel/reasoning", "medulla-raft/reasoning", "medulla-server-api/reasoning", "medulla-server-cdc/reasoning", "medulla-server-mutation/reasoning", "medulla-h-graph-gateway/reasoning"]
redb = ["medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-persistence/redb", "medulla-raft/redb", "medulla-server-api/redb", "medulla-server-mutation/redb", "medulla-server-ops/redb", "medulla-h-graph-gateway/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-persistence/security", "medulla-protocol-types/security", "medulla-raft/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-cdc/security", "medulla-server-ops/security", "medulla-types/security", "medulla-h-graph-gateway/security"]
shacl = ["rdf", "medulla-kernel/shacl", "medulla-persistence/shacl", "medulla-raft/shacl", "medulla-server-api/shacl", "medulla-server-cdc/shacl", "medulla-server-mutation/shacl", "medulla-server-ops/shacl", "owl", "owl-dl", "server", "sparql", "medulla-h-graph-gateway/shacl"]
sparql = ["rdf", "medulla-kernel/sparql", "medulla-persistence/sparql", "medulla-protocol-types/sparql", "medulla-raft/sparql", "medulla-server-api/sparql", "medulla-server-ops/sparql", "medulla-types/sparql", "server", "medulla-h-graph-gateway/sparql"]
