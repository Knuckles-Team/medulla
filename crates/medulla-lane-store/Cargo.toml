[package]
name = "medulla-lane-store"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Development lane records in the store"
license = "MIT"
publish = false

[lib]
name = "medulla_lane_store"
path = "src/lib.rs"

[dependencies]
medulla-store = { path = "../medulla-store", features = ["redb"] }
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
hex = "0.4"
medulla-kernel = { path = "../medulla-kernel" }
medulla-storage = { path = "../medulla-storage" }
medulla-types = { path = "../medulla-types" }
redb = { workspace = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-resource-store = { path = "../medulla-resource-store" }

medulla-transaction = { path = "../medulla-transaction" }

[features]
security = ["medulla-store/security", "medulla-graph-core/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-resource-store/security", "medulla-types/security"]
server = ["medulla-store/server", "medulla-kernel/server", "medulla-resource-store/server"]
[dev-dependencies]
tempfile = "3"
