[package]
name = "medulla-server-cluster-tests"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Cluster tests: raft clusters and commands, cross-shard harness, placement and resource acceptance."
license = "MIT"
publish = false

[lib]
name = "medulla_server_cluster_tests"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-compute = { path = "../medulla-compute" }
medulla-h-ingest = { path = "../medulla-h-ingest" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-raft-xshard = { path = "../medulla-raft-xshard" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-store = { path = "../medulla-store" }
medulla-types = { path = "../medulla-types" }
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-server-router = { path = "../medulla-server-router" }

medulla-server = { path = "../medulla-server", features = ["test-support"] }

async-trait = { version = "0.1" }

medulla-transaction = { path = "../medulla-transaction", optional = true }

medulla-storage = { path = "../medulla-storage", optional = true }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }

[features]
ast = ["medulla-server-router/ast", "medulla-server/ast"]
compute-dist = ["medulla-server/compute-dist", "raft"]
harness = ["medulla-server/harness", "raft", "medulla-raft/harness", "medulla-raft-xshard/harness", "medulla-raft-xshard/test-support"]
oidc = ["medulla-server-router/oidc", "medulla-server/oidc", "dep:jsonwebtoken"]
raft = ["medulla-server-router/raft", "medulla-server/raft", "redb", "dep:openraft", "server"]
redb = ["medulla-server-router/redb", "medulla-server/redb", "dep:redb", "dep:medulla-transaction", "dep:medulla-storage"]
security = ["medulla-server-router/security", "medulla-server/security", "redb", "dep:sha1", "dep:argon2", "oidc"]
server = ["medulla-server-router/server", "medulla-server/server"]
