[package]
name = "medulla-persistence"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine durable persistence backends"
license = "MIT"
publish = false

[lib]
name = "medulla_persistence"
path = "src/lib.rs"

[dependencies]

[features]
cold-tier = []
cold-tier-s3 = ["cold-tier"]
compute-dist = ["raft"]
cost = ["server"]
cypher = []
decide = ["redb", "shacl"]
kv = ["server", "redb"]
matview = ["query"]
metrics = []
query = ["redb"]
raft = ["server", "redb"]
rdf = ["server"]
redb = []
security = ["redb"]
server = []
shacl = ["rdf"]
sparql = ["rdf"]
tsdb = ["server", "redb"]
