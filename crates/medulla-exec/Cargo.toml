[package]
name = "medulla-exec"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Physical plan execution: optimizer, cost models, runtime, DAG, incremental and streamed results"
license = "MIT"
publish = false

[lib]
name = "medulla_exec"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types", features = ["query", "geo"] }
medulla-core = { path = "../medulla-core" }
tracing = { version = "0.1", optional = true }
medulla-wasm = { path = "../medulla-wasm", optional = true }
medulla-text = { path = "../medulla-text", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-geo = { path = "../medulla-geo", optional = true }
medulla-tensor = { path = "../medulla-tensor", optional = true }
medulla-compute = { path = "../medulla-compute", optional = true }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rmp-serde = "1.3"
petgraph = { version = "0.8.3", features = ["serde-1"] }
rayon = { version = "1.12", optional = true }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-result-types = { path = "../medulla-result-types", features = ["query"] }
medulla-finance = { path = "../medulla-finance" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-reasoner = { path = "../medulla-reasoner" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-sql = { path = "../medulla-sql" }

[features]
test-support = ["query", "medulla-types/test-support", "medulla-compute?/test-support", "medulla-catalog-types/test-support"]
epistemic = ["query", "medulla-types/epistemic", "dep:medulla-epistemic"]
federation = ["query", "medulla-types/federation"]
geo = ["query", "dep:medulla-geo", "medulla-types/geo"]
learned-cost = ["query", "dep:medulla-compute", "medulla-compute/graphlearn", "medulla-graph-algos/graphlearn"]
numeric = ["query", "dep:medulla-numeric", "medulla-sql/numeric"]
owl = ["query", "dep:medulla-rdf", "medulla-rdf/owl", "medulla-rdf/sparql", "dep:medulla-shacl", "medulla-types/owl-plan", "medulla-reasoner/owl", "medulla-types/owl"]
par-runtime = ["query", "dep:rayon"]
probabilistic = ["query", "medulla-types/probabilistic", "dep:medulla-compute", "medulla-compute/reasoning"]
query = ["medulla-sql/sql", "dep:medulla-compute", "dep:tracing", "medulla-result-types/query", "medulla-types/query"]
raft = []
stream = ["query", "dep:medulla-stream", "medulla-stream/stream", "medulla-types/stream"]
tensor = ["query", "dep:medulla-tensor", "medulla-types/tensor"]
text = ["query", "dep:medulla-text", "medulla-text/tantivy", "medulla-types/text"]
timeseries = ["query", "dep:medulla-tsdb", "medulla-tsdb/redb-store", "medulla-tsdb/derive", "medulla-types/timeseries", "dep:medulla-tensor", "dep:medulla-numeric", "medulla-numeric/motif"]
wasm-udf = ["query", "dep:medulla-wasm", "medulla-wasm/wasm-udf", "medulla-types/wasm-udf"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-compute = { path = "../medulla-compute", features = ["test-support"] }
medulla-catalog-types = { path = "../medulla-catalog-types", features = ["test-support"] }
