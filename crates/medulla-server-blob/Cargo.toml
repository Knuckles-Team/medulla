[package]
name = "medulla-server-blob"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served blob and key-value storage"
license = "MIT"
publish = false

[lib]
name = "medulla_server_blob"
path = "src/lib.rs"

[dependencies]
medulla-server-api = { path = "../medulla-server-api" }
dashmap = "6.2"
hex = "0.4"
medulla-alignment = { path = "../medulla-alignment", optional = true }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
ureq = { version = "3.4.2", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }

medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-federation = { path = "../medulla-federation" }

object_store = { version = "0.14.2", optional = true, features = ["aws"] }

[features]
alignment = ["blob", "dep:medulla-modality", "dep:medulla-alignment", "medulla-server-api/alignment"]
blob = ["redb", "medulla-server-api/blob", "medulla-protocol-types/blob", "medulla-types/blob"]
blob-s3 = ["blob", "medulla-server-api/blob-s3", "dep:object_store"]
kv = ["redb", "medulla-server-api/kv", "medulla-kernel/kv", "medulla-protocol-types/kv", "medulla-types/kv"]
nl-query = ["dep:medulla-plan", "medulla-server-api/nl-query", "medulla-plan?/nl-query", "redb"]
rdf-xml = ["dep:medulla-rdf", "medulla-server-api/rdf-xml", "medulla-rdf?/rdf-xml"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-server-api/redb", "medulla-kernel/redb", "medulla-store/redb"]
security = ["redb", "medulla-server-api/security", "medulla-server-auth/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-store/security", "medulla-types/security"]
shacl = ["dep:medulla-shacl", "dep:medulla-rdf", "medulla-rdf/owl-dl", "medulla-server-api/shacl", "medulla-kernel/shacl"]
sparql-http = ["shacl", "security", "dep:medulla-rdf", "medulla-rdf/sparql", "medulla-server-api/sparql", "medulla-server-api/sparql-http"]
sparql-service = ["sparql-http", "dep:ureq", "medulla-server-api/sparql-service", "medulla-federation/sparql-service"]
test-support = ["medulla-server-api/test-support", "medulla-server-auth/test-support", "medulla-kernel/test-support", "medulla-store/test-support", "medulla-types/test-support", "medulla-agent-types/test-support", "medulla-catalog-types/test-support", "medulla-protocol-types/test-support", "medulla-federation/test-support"]
[dev-dependencies]
medulla-server = { path = "../medulla-server", features = ["test-support", "full"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
tempfile = "3"
