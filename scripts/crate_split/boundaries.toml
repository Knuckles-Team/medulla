# G7: finance quant math (not the served, UQL, client or alias-removal rows, which keep their paths).
[[route]]
spec = "finance-primitives"
match = "^(?!.*(uql|served|client|wiring|alias removal|caller migration)).*(sharpe|backtest|overfit|cross-validation|diebold|information (coefficient|ratio)|effective sample|factor|signal|execution kernel|sizing|leverage|filter|regime)"
crate = "medulla-finance-quant"
module = "src/quant"

