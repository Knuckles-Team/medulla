[package]
name = "medulla-isolation"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Tenant isolation, RBAC persistence and dependency scopes"
license = "MIT"
publish = false

[lib]
name = "medulla_isolation"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
parking_lot = "0.12"
hex = "0.4"
redb = { workspace = true, optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-transaction = { path = "../medulla-transaction", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-graph-core = { path = "../medulla-graph-core" }

[features]
security = ["medulla-graph-core/security", "dep:redb", "dep:sha2", "dep:hmac", "dep:medulla-storage", "dep:medulla-transaction", "medulla-protocol-types/security", "medulla-types/security"]