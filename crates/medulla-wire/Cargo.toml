[package]
name = "medulla-wire"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine wire protocol listeners"
license = "MIT"
publish = false

[lib]
name = "medulla_wire"
path = "src/lib.rs"

[dependencies]
medulla-cypher = { path = "../medulla-cypher" }
medulla-sql = { path = "../medulla-sql" }
medulla-sql-udfs = { path = "../medulla-sql-udfs" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
hex = "0.4"
hmac = "0.12"
medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-kvcache = { path = "../medulla-kvcache", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
pgwire = { version = "0.40", optional = true, default-features = false, features = ["server-api", "_ring"] }
rand = "0.8"
rmp-serde = "1.3"
rustix = { version = "1.1.5", optional = true, features = ["fs"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-server-ops = { path = "../medulla-server-ops" }

[features]
test-support = []
amqp-wire = ["server"]
ann = []
ann-redb = ["ann", "redb"]
bolt-wire = ["server"]
cost = ["server"]
epistemic-tms = []
federation = ["dep:medulla-plan", "medulla-plan/federation", "query", "server"]
federation-search = ["server", "federation"]
full = ["server", "query", "graphql", "redb", "ann", "ann-redb", "tsdb", "kv", "text", "sparql", "sparql-http", "owl", "streaming", "security", "federation", "pgwire", "mysql-wire", "mssql-wire", "sqlite-wire", "bolt-wire", "redis-wire", "amqp-wire", "mqtt-wire", "stomp-wire", "cost", "obs", "traces", "s3-api", "federation-search", "kvcache-server", "epistemic-tms", "lake", "lake-rest", "viz-interactive"]
graphql = ["server", "security"]
kv = ["server", "redb"]
kvcache-server = ["dep:medulla-kvcache", "server"]
lake = ["server", "tsdb"]
lake-rest = ["lake"]
metrics = []
mining = []
mqtt-wire = ["server"]
mssql-wire = ["query", "server"]
mysql-wire = ["dep:sha1", "query", "server"]
obs = ["server", "tsdb", "text"]
owl = ["sparql"]
pgwire = ["dep:rustix", "dep:pgwire", "dep:futures", "query", "server"]
policy_export = ["security"]
query = ["dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "medulla-sql/sql", "medulla-tables/sql", "medulla-table-store/sql", "medulla-cypher/sql", "dep:medulla-plan", "medulla-plan/query", "redb"]
raft = ["dep:futures", "server", "redb"]
redb = []
redis-wire = ["kv", "server"]
ros2-bridge = ["dep:futures", "server", "streaming"]
ros2-dds = ["dep:futures", "server", "streaming"]
ros2-rmw = ["dep:futures", "server", "streaming"]
s3-api = ["kv", "server"]
security = ["dep:sha1", "redb"]
server = ["dep:tokio", "dep:medulla-capabilities", "dep:async-trait", ]
sparql = []
sparql-http = ["sparql", "server", "security"]
sqlite-wire = ["query", "server"]
stomp-wire = ["server"]
streaming = ["server"]
text = ["dep:medulla-plan", "medulla-plan/text", "query"]
traces = ["dep:medulla-tsdb", "medulla-tsdb/traces", "obs"]
tsdb = ["dep:medulla-tsdb", "medulla-tsdb/redb-store", "dep:medulla-plan", "medulla-plan/timeseries", "server", "redb"]
viz-interactive = []
decide = ["dep:medulla-capabilities", "medulla-capabilities?/decide"]
jobs = ["dep:medulla-capabilities", "medulla-capabilities/jobs"]
statechart = ["dep:medulla-capabilities", "medulla-capabilities/statechart"]
viz = ["dep:medulla-capabilities", "medulla-capabilities?/viz"]
modality-serving = ["dep:medulla-capabilities", "medulla-capabilities/modality-serving"]
asr-whisper = ["dep:medulla-capabilities", "medulla-capabilities/asr-native"]
knowledge-batch = ["dep:medulla-plan", "medulla-plan/knowledge-batch", "dep:medulla-capabilities", "medulla-capabilities/knowledge-batch"]
quantum-agent-api = ["dep:medulla-capabilities", "medulla-capabilities/quantum"]
kvcache-compression = ["dep:medulla-kvcache", "medulla-kvcache/compression"]
epistemic = ["dep:medulla-plan", "medulla-plan/epistemic"]
numeric = ["medulla-sql-udfs/numeric", "medulla-sql/numeric", "dep:medulla-plan", "medulla-plan?/numeric"]
cost-opt = ["dep:medulla-plan", "medulla-plan/cost-opt"]
par-runtime = ["dep:medulla-plan", "medulla-plan/par-runtime"]
federation-sql = ["dep:medulla-plan", "medulla-plan/federation-sql"]
geo = ["dep:medulla-plan", "medulla-plan/geo"]
tensor = ["dep:medulla-plan", "medulla-plan/tensor"]
stream = ["dep:medulla-plan", "medulla-plan/stream"]
nl-query = ["dep:medulla-plan", "medulla-plan/nl-query"]
wasm-udf = ["dep:medulla-plan", "medulla-plan?/wasm-udf"]
gpu = ["dep:medulla-plan", "medulla-plan/tensor-gpu"]
gpu-cuda = ["dep:medulla-plan", "medulla-plan/tensor-gpu-cuda"]
owl-plan = ["dep:medulla-plan", "medulla-plan/owl"]
cypher = ["medulla-cypher/cypher"]
cypher-plan = ["medulla-cypher/cypher-plan"]
result-cache = ["medulla-cypher/result-cache"]
promql = ["dep:medulla-tsdb", "medulla-tsdb/promql"]
sqlite-file = ["dep:rustix"]

[dev-dependencies]
medulla-server-api = { path = "../medulla-server-api", features = ["test-support"] }
tempfile = "3"
