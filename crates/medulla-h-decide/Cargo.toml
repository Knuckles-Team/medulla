[package]
name = "medulla-h-decide"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (decide)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_decide"
path = "src/lib.rs"

[dependencies]
medulla-cypher = { path = "../medulla-cypher" }
medulla-table-store = { path = "../medulla-table-store" }
async-trait = { version = "0.1", optional = true }
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-ann = { path = "../medulla-ann", optional = true }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-index-types = { path = "../medulla-index-types" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-server-api = { path = "../medulla-server-api" }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
tempfile = { version = "3", optional = true }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-reasoner = { path = "../medulla-reasoner" }
medulla-finance-market = { path = "../medulla-finance-market" }
medulla-decision-policy = { path = "../medulla-decision-policy" }
medulla-finance = { path = "../medulla-finance" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-sql = { path = "../medulla-sql" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-sql-lang = { path = "../medulla-sql-lang" }

[features]
ann = ["dep:medulla-ann", "medulla-core/ann", "medulla-graph-core/ann", "medulla-semantic-index/ann"]
blob = ["redb", "medulla-protocol-types/blob", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob"]
decide = ["dep:medulla-numeric", "medulla-numeric/decision", "medulla-decision-stats/decision", "dep:medulla-ann", "medulla-ann?/drift", "solve", "redb", "medulla-compute/decide", "medulla-persistence-records/decide", "medulla-persistence/decide", "medulla-server-api/decide", "medulla-server-ops/decide"]
epistemic = ["dep:medulla-plan", "medulla-plan/epistemic", "query", "medulla-exec/epistemic", "medulla-kernel/epistemic", "medulla-protocol-types/epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-ops/epistemic", "medulla-types/epistemic"]
finance = ["medulla-compute/finance", "medulla-protocol-types/finance", "medulla-sql/finance", "medulla-types/finance"]
owl = ["dep:medulla-rdf", "medulla-rdf/owl", "medulla-reasoner/owl", "medulla-exec/owl", "medulla-persistence/owl", "medulla-plan?/owl", "medulla-protocol-types/owl", "medulla-server-api/owl", "medulla-server-ops/owl", "medulla-types/owl"]
query = ["medulla-sql/sql", "medulla-tables/sql", "medulla-table-store/sql", "medulla-cypher/sql", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-exec/query", "medulla-decision-types/query", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-ops/query", "medulla-types/query"]
raft = ["redb", "medulla-exec/raft", "medulla-kernel/raft", "medulla-persistence/raft", "medulla-server-api/raft", "medulla-server-auth/raft"]
redb = ["medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-persistence/redb", "medulla-server-api/redb", "medulla-server-blob/redb", "medulla-server-ops/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-persistence/security", "medulla-protocol-types/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-server-ops/security", "medulla-types/security"]
solve = ["medulla-compute/solve", "medulla-decision-policy/solve"]
server = ["dep:tokio", "dep:async-trait", "medulla-kernel/server", "medulla-persistence/server", "medulla-server-api/server"]
numeric = ["medulla-sql/numeric", "dep:medulla-plan", "medulla-plan?/numeric", "dep:medulla-numeric", "medulla-exec/numeric", "medulla-kernel/numeric", "medulla-persistence/numeric", "medulla-server-api/numeric"]
knowledge-batch = ["dep:medulla-plan", "medulla-plan/knowledge-batch", "medulla-kernel/knowledge-batch", "medulla-persistence/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch"]
cost-opt = ["dep:medulla-plan", "medulla-plan/cost-opt", "medulla-server-api/cost-opt"]
par-runtime = ["dep:medulla-plan", "medulla-plan/par-runtime", "medulla-exec/par-runtime", "medulla-server-api/par-runtime"]
text = ["dep:medulla-plan", "medulla-plan/text", "medulla-exec/text", "medulla-server-api/text", "medulla-server-ops/text", "medulla-types/text"]
federation = ["dep:medulla-plan", "medulla-plan/federation", "medulla-exec/federation", "medulla-protocol-types/federation", "medulla-server-api/federation", "medulla-server-auth/federation", "medulla-server-ops/federation", "medulla-types/federation"]
federation-sql = ["dep:medulla-plan", "medulla-plan/federation-sql", "medulla-server-api/federation-sql", "medulla-server-ops/federation-sql"]
geo = ["dep:medulla-plan", "medulla-plan/geo", "medulla-exec/geo", "medulla-server-api/geo", "medulla-types/geo"]
tensor = ["dep:medulla-plan", "medulla-plan/tensor", "medulla-exec/tensor", "medulla-server-api/tensor", "medulla-types/tensor"]
stream = ["dep:medulla-plan", "medulla-plan/stream", "medulla-exec/stream", "medulla-server-api/stream", "medulla-server-ops/stream", "medulla-types/stream"]
nl-query = ["dep:medulla-plan", "medulla-plan/nl-query", "medulla-server-api/nl-query", "medulla-server-blob/nl-query"]
tsdb = ["dep:medulla-plan", "medulla-plan/timeseries", "medulla-exec/timeseries", "medulla-persistence/tsdb", "medulla-server-api/tsdb", "medulla-server-ops/tsdb"]
wasm-udf = ["dep:medulla-plan", "medulla-plan?/wasm-udf", "medulla-exec/wasm-udf", "medulla-protocol-types/wasm-udf", "medulla-server-api/wasm-udf", "medulla-server-auth/wasm-udf", "medulla-server-ops/wasm-udf", "medulla-types/wasm-udf"]
gpu = ["dep:medulla-plan", "medulla-plan/tensor-gpu", "medulla-ann?/gpu", "medulla-compute/gpu", "medulla-server-api/gpu"]
gpu-cuda = ["dep:medulla-plan", "medulla-plan/tensor-gpu-cuda", "medulla-ann?/gpu-cuda", "medulla-compute/gpu-cuda", "medulla-reasoner/gpu-cuda", "medulla-server-api/gpu-cuda"]
owl-plan = ["dep:medulla-plan", "medulla-plan/owl", "medulla-exec/owl", "medulla-server-api/owl-plan", "medulla-types/owl-plan"]
cypher = ["medulla-cypher/cypher", "medulla-kernel/cypher", "medulla-persistence/cypher", "medulla-server-api/cypher", "medulla-server-auth/cypher"]
cypher-plan = ["medulla-cypher/cypher-plan", "medulla-kernel/cypher-plan", "medulla-persistence/cypher-plan", "medulla-server-api/cypher-plan"]
result-cache = ["medulla-cypher/result-cache", "medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-persistence/result-cache", "medulla-server-api/result-cache", "medulla-server-ops/result-cache"]
rdf = ["dep:medulla-rdf", "medulla-rdf/rdf", "medulla-reasoner/rdf", "medulla-kernel/rdf", "medulla-persistence-records/rdf", "medulla-persistence/rdf", "medulla-protocol-types/rdf", "medulla-server-api/rdf", "medulla-types/rdf"]
sparql = ["dep:medulla-rdf", "medulla-rdf/sparql", "medulla-kernel/sparql", "medulla-persistence/sparql", "medulla-protocol-types/sparql", "medulla-server-api/sparql", "medulla-server-ops/sparql", "medulla-types/sparql"]
sparql-hash = ["dep:medulla-rdf", "medulla-rdf/sparql-hash", "medulla-persistence/sparql-hash", "medulla-server-api/sparql-hash"]
rdf-xml = ["dep:medulla-rdf", "medulla-rdf/rdf-xml", "medulla-persistence/rdf-xml", "medulla-server-api/rdf-xml", "medulla-server-blob/rdf-xml"]
json-ld = ["dep:medulla-rdf", "medulla-rdf/json-ld", "medulla-persistence/json-ld", "medulla-server-api/json-ld"]
sparql-star = ["dep:medulla-rdf", "medulla-rdf/sparql-star", "medulla-reasoner/sparql-star", "medulla-persistence/sparql-star", "medulla-server-api/sparql-star"]
geosparql = ["dep:medulla-rdf", "medulla-rdf/geosparql", "medulla-persistence/geosparql", "medulla-server-api/geosparql"]
owl-dl = ["dep:medulla-rdf", "medulla-rdf/owl-dl", "medulla-reasoner/owl-dl", "medulla-persistence/owl-dl", "medulla-server-api/owl-dl"]
shacl = ["dep:medulla-shacl", "medulla-kernel/shacl", "medulla-persistence/shacl", "medulla-server-api/shacl", "medulla-server-blob/shacl", "medulla-server-ops/shacl"]
