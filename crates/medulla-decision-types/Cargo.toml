[package]
name = "medulla-decision-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Decision ladder vocabulary: ResolutionKind, evidence classes, decision requests, answers and revision records"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }

[features]
wire-contract = ["query", "medulla-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]
query = ["medulla-types/query"]
test-support = ["medulla-types/test-support"]
