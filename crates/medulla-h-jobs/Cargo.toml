[package]
name = "medulla-h-jobs"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (jobs)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_jobs"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-program = { path = "../medulla-program", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-statechart = { path = "../medulla-statechart", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
medulla-ann-codes = { path = "../medulla-ann-codes" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-mining = { path = "../medulla-mining" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-retrieval = { path = "../medulla-retrieval" }

[features]
ann-redb = ["redb", "medulla-ann-codes/ann-redb", "medulla-core/ann-redb", "medulla-server-api/ann-redb", "medulla-server-ops/ann-redb"]
jobs = ["dep:medulla-jobs", "dep:medulla-capabilities", "medulla-capabilities/jobs", "medulla-agent-types/jobs", "medulla-persistence/jobs", "medulla-protocol-types/jobs", "medulla-raft/jobs", "medulla-server-api/jobs", "medulla-server-mutation/jobs", "medulla-server-ops/jobs", "medulla-types/jobs", "medulla-work-types/jobs"]
knowledge-batch = ["dep:medulla-plan", "medulla-plan/knowledge-batch", "medulla-retrieval/knowledge-batch", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-capabilities/knowledge-batch", "query", "medulla-kernel/knowledge-batch", "medulla-persistence/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-raft/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch"]
program-optimization = ["dep:medulla-program", "jobs", "medulla-agent-types/program-optimization", "medulla-server-api/program-optimization", "medulla-server-mutation/program-optimization", "medulla-types/program-optimization", "medulla-work-types/program-optimization"]
query = ["medulla-table-store/sql", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-retrieval/query", "medulla-decision-types/query", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-raft/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-mutation/query", "medulla-server-ops/query", "medulla-types/query"]
