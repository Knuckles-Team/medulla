# Decision engine: every row goes to its family member by title; paths do not win here.
# G7: decision outcome and governance types go to their own types crate.
[[route]]
spec = "decision-engine"
match = "^(?=.*\\b(types?|typed|enum|variant|descriptor|codes?|field|record)\\b)(?=.*(answer|admission|guard|trust|triage|promotion|outcome|recommend|evolution|red.team|prompt|skill|coverage|derivation|load.set|usage|branch))"
crate = "medulla-decision-outcome-types"
module = "src/decision"
[[route]]
spec = "decision-engine"
match = "\\b(types?|typed|enum|variant|descriptor|codes?|field)\\b"
crate = "medulla-decision-types"
module = "src/decision"
[[route]]
spec = "decision-engine"
match = "rank|\\bscor|champion|bandit|credit|insight|feature|selection|prefer"
crate = "medulla-decision-rank"
module = "src/rank"
[[route]]
spec = "decision-engine"
match = "statistic|fitted|\\bheads?\\b|calibrat|conformal|regress|estimat|probab|uncertain|confiden|off-policy"
crate = "medulla-decision-stats"
module = "src/statistical"
[[route]]
spec = "decision-engine"
match = "polic|constraint|knob|admission|refus|budget|quota|safety|shield|legal|bound|limit|necessity|abstain|abstention|solve|optimi|allocation|entail"
crate = "medulla-decision-policy"
module = "src/policy"
[[route]]
spec = "decision-engine"
match = "memory|context|retriev|temporal|indexless|recall|search|session|corpus|distill|enrichment|index"
crate = "medulla-decision-memory"
module = "src/memory"
[[route]]
spec = "decision-engine"
match = "evaluat|quality|relevance|decisioneval|drift|nightly|benchmark|criterion|reliab|proof|verdict|validation|check"
crate = "medulla-decision-eval"
module = "src/eval"
[[route]]
spec = "decision-engine"
match = "task|journey|workflow|delegat|harness|program|skill|route|plan|compile|participant|agent|assembl|prompt|trajectory|capabilit|stage|intake|front"
crate = "medulla-decision-plan"
module = "src/plan"

# Federated query: by language/stage.
[[route]]
spec = "federated-query-and-reasoning"
match = "sparql"
crate = "medulla-rdf"
