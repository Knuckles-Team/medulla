[package]
name = "medulla-server-ops"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served API handler seams: the admin, decide, ingest, graph, jobs, compute, query, transaction and wire seam traits, their typed accessors and their support modules"
license = "MIT"
publish = false

[lib]
name = "medulla_server_ops"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
medulla-server-api = { path = "../medulla-server-api" }
dashmap = "6.2"
hex = "0.4"
medulla-core = { path = "../medulla-core" }
medulla-graphql = { path = "../medulla-graphql", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.28", features = ["v4"] }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-ann-codes = { path = "../medulla-ann-codes" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-cypher = { path = "../medulla-cypher" }
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }

medulla-capabilities = { path = "../medulla-capabilities" }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-wasm = { path = "../medulla-wasm", optional = true }
redb = { workspace = true, optional = true }
ureq = { version = "3.4.2", optional = true }
medulla-server-blob = { path = "../medulla-server-blob", features = ["blob"] }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-federation = { path = "../medulla-federation" }

[features]
ann-redb = ["redb", "medulla-server-api/ann-redb", "medulla-ann-codes/ann-redb", "medulla-core/ann-redb"]
compute-dist = ["medulla-server-api/compute-dist", "medulla-protocol-types/compute-dist", "medulla-types/compute-dist", "redb"]
decide = ["jobs", "redb", "shacl", "dep:medulla-numeric", "medulla-server-api/decide", "medulla-capabilities/decide", "owl", "sparql"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-mutation/epistemic", "medulla-exec/epistemic", "medulla-kernel/epistemic", "medulla-plan?/epistemic", "medulla-protocol-types/epistemic", "medulla-types/epistemic"]
federation = ["query", "dep:medulla-plan", "medulla-server-api/federation", "medulla-server-auth/federation", "medulla-exec/federation", "medulla-federation/federation", "medulla-graphql?/federation", "medulla-plan?/federation", "medulla-protocol-types/federation", "medulla-types/federation"]
federation-search = ["federation", "dep:ureq", "medulla-server-api/federation-search", "medulla-federation/federation-search"]
federation-sql = ["federation", "dep:medulla-plan", "medulla-server-api/federation-sql", "medulla-federation/federation-sql", "medulla-plan?/federation-sql"]
graphql = ["security", "dep:medulla-graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-server-mutation/graphql", "medulla-kernel/graphql", "medulla-protocol-types/graphql", "medulla-types/graphql"]
jobs = ["mining", "epistemic", "dep:medulla-jobs", "medulla-server-api/jobs", "medulla-server-mutation/jobs", "medulla-agent-types/jobs", "medulla-capabilities/jobs", "medulla-protocol-types/jobs", "medulla-types/jobs"]
knowledge-batch = ["query", "dep:medulla-plan", "dep:medulla-modality", "medulla-server-api/knowledge-batch", "medulla-capabilities/knowledge-batch", "medulla-kernel/knowledge-batch", "medulla-plan?/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-types/knowledge-batch"]
matview = ["query", "result-cache", "streaming", "medulla-server-api/matview", "medulla-protocol-types/matview", "medulla-types/matview"]
mining = ["medulla-server-api/mining", "medulla-server-auth/mining", "medulla-server-mutation/mining", "medulla-kernel/mining", "medulla-protocol-types/mining", "medulla-types/mining"]
modality-serving = ["redb", "security", "streaming", "dep:medulla-modality", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-mutation/modality-serving", "medulla-capabilities/modality-serving", "medulla-kernel/modality-serving", "medulla-protocol-types/modality-serving", "medulla-types/modality-serving"]
owl = ["sparql", "dep:medulla-rdf", "medulla-server-api/owl", "medulla-exec/owl", "medulla-plan?/owl", "medulla-protocol-types/owl", "medulla-rdf?/owl", "medulla-types/owl"]
query = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-mutation/query", "medulla-decision-types/query", "medulla-exec/query", "medulla-kernel/query", "medulla-plan?/query", "medulla-protocol-types/query", "medulla-types/query"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-server-api/redb", "medulla-server-mutation/redb", "medulla-server-blob/redb", "medulla-kernel/redb"]
result-cache = ["medulla-server-api/result-cache", "medulla-core/result-cache", "medulla-cypher/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache"]
security = ["redb", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-types/security"]
shacl = ["dep:medulla-shacl", "medulla-server-api/shacl", "medulla-server-mutation/shacl", "medulla-server-blob/shacl", "medulla-kernel/shacl", "owl", "sparql"]
sparql = ["dep:medulla-rdf", "medulla-server-api/sparql", "medulla-kernel/sparql", "medulla-protocol-types/sparql", "medulla-rdf?/sparql", "medulla-types/sparql"]
stream = ["query", "dep:medulla-stream", "dep:medulla-plan", "medulla-server-api/stream", "medulla-exec/stream", "medulla-plan?/stream", "medulla-stream?/stream", "medulla-types/stream"]
streaming = ["medulla-server-api/streaming", "medulla-server-mutation/streaming", "medulla-protocol-types/streaming", "medulla-types/streaming"]
test-support = ["medulla-server-api/test-support", "medulla-server-auth/test-support", "medulla-server-mutation/test-support", "medulla-server-blob/test-support", "medulla-kernel/test-support", "medulla-types/test-support", "medulla-agent-types/test-support", "medulla-catalog-types/test-support", "medulla-decision-types/test-support", "medulla-protocol-types/test-support", "medulla-exec/test-support", "medulla-federation/test-support"]
text = ["query", "dep:medulla-plan", "medulla-server-api/text", "medulla-exec/text", "medulla-federation/text", "medulla-plan?/text", "medulla-types/text"]
tsdb = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/tsdb"]
wasm-udf = ["dep:medulla-wasm", "dep:medulla-plan", "medulla-server-api/wasm-udf", "medulla-server-auth/wasm-udf", "medulla-exec/wasm-udf", "medulla-plan?/wasm-udf", "medulla-protocol-types/wasm-udf", "medulla-types/wasm-udf", "medulla-wasm?/wasm-udf"]
[dev-dependencies]
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
tempfile = "3"
