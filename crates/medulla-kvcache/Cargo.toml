[package]
name = "medulla-kvcache"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Tiered (hot/warm/cold) KV-cache store (CONCEPT:MEDULLA-185) + a content-addressed shared multi-instance KV-cache backend (CONCEPT:MEDULLA-186) for the medulla-engine engine — the vLLM/LMCache shared-KV / OOM-offload substrate. Pure-Rust, Pi-lean; the durable cold rung is a kv-store namespace supplied by the server."
license = "MIT"

[lib]
name = "medulla_kvcache"

# Pure-Rust, Pi-lean by design — a leaf crate like medulla-ann / medulla-tensor. The RAM-only
# build (hot + compressed-warm + in-memory-cold) links NO dependency at all: the
# content hash (FNV-1a-128), the RLE compressor and the tiered LRU are all
# hand-written. Two optional features each pull ONE dependency: a REAL warm-tier codec (CONCEPT:MEDULLA-315, `compression` → zstd;
# optional `lz4` → lz4_flex). All OFF by default — mirroring how medulla-ann/medulla-tsdb gate
# their redb tier — so a `pi`/default build of this crate carries no zstd; the durable
# cold rung lives in the server's kv store.
[dependencies]
# CONCEPT:MEDULLA-315 — the real WARM-tier codec. `zstd` gives production-grade compression
# ratios on KV pages (far above the built-in RLE) at the cost of one dependency, so it
# is OFF by default (`compression` feature) to keep the base/pi build dependency-free.
zstd = { version = "0.14", optional = true }
# CONCEPT:MEDULLA-315 — an OPTIONAL faster/lighter pure-Rust codec alternative to zstd.
lz4_flex = { version = "0.14", optional = true }
# ModalityContract retrofit (CONCEPT:E4). Optional (the base Pi-lean build must stay
# dependency-free) — only `contract` pulls serde in, so `StoredBlock`/`Codec` carry no
# derive at all outside that feature. See `src/compress.rs` / `src/contract.rs`.
serde = { version = "1.0", features = ["derive"], optional = true }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
default = []
# Real WARM-tier compression codec (CONCEPT:MEDULLA-315): enables `Codec::Zstd`, selectable
# via `TieredCache::with_warm_codec`. Pulls `zstd`. OFF by default so the base/pi build
# stays dependency-free (the hand-rolled RLE remains the default codec either way).
compression = ["dep:zstd"]
# OPTIONAL alternative WARM codec (CONCEPT:MEDULLA-315): enables `Codec::Lz4` (pure-Rust
# `lz4_flex`) — faster/lighter than zstd. OFF by default.
lz4 = ["dep:lz4_flex"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for StoredBlock` +
# the `modality_conformance_tests!` battery. OFF by default, deliberately NOT folded
# into any tier aggregate (pi/durable/compression/lz4) — a base/pi build must stay
# dependency-free (no serde). `cargo test -p medulla-kvcache --features contract` runs the
# suite; only this feature pulls serde in.
contract = ["dep:medulla-modality", "dep:serde"]

[dev-dependencies]
# The graph-guided paging test drives the importance adapter over a real graph. These are
# dev-only so the cache crate itself sits below the graph crates in the normal dependency graph.
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-graph-core = { path = "../medulla-graph-core" }
tempfile = "3.27"
serde_json = "1.0"

# Nightly receipt for MEDULLA-DURABLE-KERNEL-R800.6 (never gates a pull request).
[[bench]]
name = "tier_policy"
harness = false

# Nightly receipt for MEDULLA-DURABLE-KERNEL-R042.3 (never gates a pull request).
[[bench]]
name = "tiering"
harness = false
