[package]
name = "medulla-agent-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Agent components, graphs, libraries, templates, work items, jobs and run history types"
license = "MIT"
publish = false

[lib]
name = "medulla_agent_types"
path = "src/lib.rs"

[dependencies]
serde_bytes = "0.11.19"
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }

[features]
wire-contract = ["medulla-types/wire-contract"]
wire-complete = ["wire-contract", "jobs", "program-optimization", "medulla-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]
jobs = ["medulla-types/jobs"]
program-optimization = ["jobs", "medulla-types/program-optimization"]
test-support = ["medulla-types/test-support"]
