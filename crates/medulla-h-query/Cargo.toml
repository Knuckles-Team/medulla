[package]
name = "medulla-h-query"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (query)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_query"
path = "src/lib.rs"

[dependencies]

[features]
alignment = []
ann-redb = ["redb"]
cypher = []
decide = ["jobs", "redb", "shacl"]
epistemic = ["query"]
epistemic-causal = ["epistemic"]
epistemic-redaction = ["epistemic", "security"]
epistemic-tms = ["epistemic"]
evidence-graph = ["epistemic"]
federation = ["query"]
federation-opensearch = []
federation-sql = ["federation"]
geo = ["query"]
graphql = ["security"]
jobs = ["mining", "epistemic"]
knowledge-batch = ["query"]
mining = []
nl-query = ["query"]
obda = ["sparql", "query"]
owl = ["sparql"]
owl-plan = ["owl", "query"]
query = ["redb"]
raft = ["redb"]
rdf = []
redb = []
result-cache = []
security = ["redb"]
shacl = ["rdf"]
shex = ["rdf"]
sparql = ["rdf"]
sparql-fuseki = ["sparql"]
sparql-service = ["federation"]
streaming = []
tensor = ["query"]
text = ["query"]
tsdb = ["redb"]
