[package]
name = "medulla-decision-memory"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Decision context and memory: session memory, retrieval for decisions, temporal and indexless recall"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_memory"
path = "src/lib.rs"

[dependencies]
arc-swap = "1"
medulla-ann = { path = "../medulla-ann" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-types = { path = "../medulla-types" }

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-decision-types = { path = "../medulla-decision-types", features = ["test-support"] }
