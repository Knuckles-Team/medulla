[package]
name = "medulla-server-served-tests"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: End-to-end served tests: the full dispatch chain, handler and wire protocol round trips through the assembled server."
license = "MIT"
publish = false

[lib]
name = "medulla_server_served_tests"
path = "src/lib.rs"

[dependencies]
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
async-trait = { version = "0.1" }
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-h-admin = { path = "../medulla-h-admin" }
medulla-h-decide = { path = "../medulla-h-decide" }
medulla-h-ingest = { path = "../medulla-h-ingest" }
medulla-h-jobs = { path = "../medulla-h-jobs" }
medulla-h-query = { path = "../medulla-h-query" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
medulla-wire = { path = "../medulla-wire" }
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
uuid = { version = "1.28", features = ["v4"] }
medulla-document = { path = "../medulla-document", optional = true }
medulla-index-types = { path = "../medulla-index-types" }
medulla-ann-codes = { path = "../medulla-ann-codes" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-federation = { path = "../medulla-federation" }
medulla-nlq = { path = "../medulla-nlq" }
medulla-uql = { path = "../medulla-uql" }
medulla-server-graph = { path = "../medulla-server-graph" }
medulla-server-router = { path = "../medulla-server-router" }

medulla-server = { path = "../medulla-server", features = ["test-support"] }

medulla-numeric = { path = "../medulla-numeric", optional = true }

medulla-modality = { path = "../medulla-modality", optional = true }

medulla-graphql = { path = "../medulla-graphql", optional = true }

openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }

[features]
ann = ["medulla-server-router/ann", "medulla-server-graph/ann", "medulla-server/ann"]
ann-redb = ["medulla-server-router/ann-redb", "medulla-server-graph/ann-redb", "medulla-server/ann-redb", "ann", "redb"]
blob = ["medulla-server-router/blob", "medulla-server-graph/blob", "medulla-server/blob", "redb", "server"]
cypher = ["medulla-server-graph/cypher", "medulla-server/cypher"]
decide = ["medulla-server-graph/decide", "medulla-server/decide", "jobs", "redb", "shacl", "dep:medulla-numeric", "medulla-numeric/decision", "medulla-capabilities/decide"]
epistemic = ["medulla-server-router/epistemic", "medulla-server-graph/epistemic", "medulla-server/epistemic", "query", "dep:medulla-plan", "dep:medulla-modality", "medulla-plan/epistemic"]
epistemic-causal = ["medulla-server/epistemic-causal", "epistemic"]
epistemic-tms = ["medulla-server/epistemic-tms", "epistemic"]
evidence-graph = ["medulla-server/evidence-graph", "epistemic"]
federation = ["medulla-server-router/federation", "medulla-server-graph/federation", "medulla-server/federation", "query", "dep:medulla-plan", "medulla-plan/federation", "server"]
federation-sql = ["medulla-server/federation-sql", "federation", "dep:medulla-plan", "medulla-plan/federation-sql"]
graphql = ["medulla-server-graph/graphql", "medulla-server/graphql", "security", "dep:medulla-graphql", "medulla-graphql/hardening", "server"]
jobs = ["medulla-server-router/jobs", "medulla-server-graph/jobs", "medulla-server/jobs", "epistemic", "medulla-capabilities/jobs", "server", "mining"]
matview = ["medulla-server-graph/matview", "medulla-server/matview", "query", "streaming"]
mining = ["medulla-server-router/mining", "medulla-server-graph/mining", "medulla-server/mining"]
nl-query = ["medulla-server-router/nl-query", "medulla-server/nl-query", "query", "dep:medulla-plan", "medulla-plan/nl-query", "server"]
obda = ["medulla-server/obda", "sparql", "query"]
oidc = ["medulla-server-router/oidc", "medulla-server-graph/oidc", "medulla-server/oidc", "dep:jsonwebtoken"]
owl = ["medulla-server-router/owl", "medulla-server/owl", "sparql", "dep:medulla-rdf", "medulla-rdf/owl"]
query = ["medulla-server-router/query", "medulla-server-graph/query", "medulla-server/query", "redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-tsdb?/arrow-seg", "medulla-sql/sql", "medulla-tables/sql", "medulla-table-store/sql", "medulla-plan/query"]
raft = ["medulla-server-router/raft", "medulla-server-graph/raft", "medulla-server/raft", "redb", "dep:openraft", "server"]
rdf = ["medulla-server-router/rdf", "medulla-server-graph/rdf", "medulla-server/rdf", "dep:medulla-rdf", "medulla-rdf/rdf", "server"]
reasoning = ["medulla-server/reasoning"]
redb = ["medulla-server-router/redb", "medulla-server-graph/redb", "medulla-server/redb", "dep:redb", "dep:medulla-transaction", "dep:medulla-storage"]
security = ["medulla-server-router/security", "medulla-server-graph/security", "medulla-server/security", "redb", "dep:sha1", "dep:argon2", "oidc"]
server = ["medulla-server-router/server", "medulla-server-graph/server", "medulla-server/server"]
shacl = ["medulla-server-router/shacl", "medulla-server-graph/shacl", "medulla-server/shacl", "rdf"]
shex = ["medulla-server/shex", "rdf"]
sparql = ["medulla-server-router/sparql", "medulla-server-graph/sparql", "medulla-server/sparql", "rdf", "dep:medulla-rdf", "medulla-rdf/sparql"]
streaming = ["medulla-server-router/streaming", "medulla-server-graph/streaming", "medulla-server/streaming", "server"]
test-support = ["medulla-server-graph/test-support"]
tsdb = ["medulla-server-router/tsdb", "medulla-server-graph/tsdb", "medulla-server/tsdb", "redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-tsdb/redb-store", "medulla-plan/timeseries", "server"]
wasm-udf = ["medulla-server-router/wasm-udf", "medulla-server-graph/wasm-udf", "medulla-server/wasm-udf", "dep:medulla-plan", "medulla-plan?/wasm-udf", "server"]

[dev-dependencies]
tempfile = "3"
wat = "1"
