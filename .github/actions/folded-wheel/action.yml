name: Build folded release wheel
description: >-
  One complete release-wheel pass: build the medulla wheel from the
  medulla-pyengine PyO3 crate plus the pure-Python package, build the
  medulla-numeric PyO3 module and the release-server `medulla-server` executable
  for the same target and fold both in (the server as medulla/_bin/medulla-server),
  normalize and privacy-audit the wheel, and require the result to be complete.
  The primary and reproduction passes in release.yml both run this, so the two
  cannot drift apart. Reads MEDULLA_WHEEL_TARGET, MEDULLA_WHEEL_MANYLINUX,
  MEDULLA_WHEEL_MATURIN_ARGS and MEDULLA_WHEEL_JOBS_ARG from the calling job's environment.
inputs:
  pass:
    description: Output suffix for this pass (`primary` or `reproduction`).
    required: true
  cache-save:
    description: >-
      `true` saves the compile cache after the build (main pushes only; tag
      runs and pull requests only restore it). The primary pass restores and the
      reproduction pass always starts from an empty target directory.
    required: false
    default: 'false'
  server-artifact:
    description: >-
      Name of the run artifact holding the platform's prebuilt server executable
      (built once by the release `server-binary` job). When set, both passes
      download, checksum-verify and fold that exact binary and never compile the
      server. Empty (single-job callers such as the main warm build) compiles it
      once in this job.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Both builds of a pass share one target directory, so the numeric module
    # reuses the dependency crates the engine wheel already compiled. The
    # reproduction pass starts clean so it cannot reuse primary compiled objects;
    # the primary pass starts from the per-platform warm cache restored below.
    - name: Select the release target directory
      id: build-environment
      shell: bash
      env:
        MEDULLA_PASS: ${{ inputs.pass }}
      run: |
        target="${RUNNER_TEMP:?}/medulla-release-target"
        if [ "${MEDULLA_PASS:?}" != primary ]; then
          rm -rf -- "$target"
        fi
        mkdir -p "$target"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/medulla-release-target" >> "$GITHUB_ENV"
        if [ "${MEDULLA_WHEEL_TARGET:-}" = aarch64-unknown-linux-gnu ]; then
          echo "container=quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc" >> "$GITHUB_OUTPUT"
          echo "maturin-version=1.15.0" >> "$GITHUB_OUTPUT"
        fi
        case "${MEDULLA_WHEEL_TARGET:-}" in
          *-apple-darwin)
            echo "maturin-version=1.15.0" >> "$GITHUB_OUTPUT"
            ;;
        esac

    # Warm compile cache: one stable key per platform, saved from main pushes
    # only (cache-save) and restored on tag builds, which can read the default
    # branch's caches. Pull requests never save.
    - name: Restore the per-platform compile cache
      if: ${{ inputs.pass == 'primary' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: medulla-wheel-${{ env.MEDULLA_WHEEL_TARGET }}
        workspaces: ". -> ${{ runner.temp }}/medulla-release-target"
        save-if: ${{ inputs.cache-save == 'true' }}

    # The server link is the most memory-hungry step of the leg: hosted Linux
    # runners (16 GB) get swap first. Self-hosted runners are sized for it.
    - name: Add swap for the server link
      if: ${{ inputs.server-artifact == '' && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        if swapon --show | grep -q /swapfile-medulla; then exit 0; fi
        avail_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
        size_gb=24
        if [ "$avail_gb" -lt $((size_gb + 15)) ]; then size_gb=$((avail_gb - 15)); fi
        test "$size_gb" -ge 8 || { echo "not enough free disk for swap: ${avail_gb}G" >&2; exit 1; }
        sudo fallocate -l "${size_gb}G" /swapfile-medulla
        sudo chmod 600 /swapfile-medulla
        sudo mkswap /swapfile-medulla
        sudo swapon /swapfile-medulla
        free -h

    # The server executable for this target (release-server profile, features
    # `full,ast-extended`). Linux builds it inside the engine build's manylinux
    # container below (prepare-script); macOS and Windows build it natively here.
    - name: Download the prebuilt server executable
      if: ${{ inputs.server-artifact != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.server-artifact }}
        path: dist-server-bin

    - name: Verify the prebuilt server executable checksum
      if: ${{ inputs.server-artifact != '' }}
      shell: bash
      run: |
        python scripts/fetch_server_binary.py verify dist-server-bin
        chmod 0755 dist-server-bin/medulla-server* || true

    - name: Build the release server executable (native)
      if: ${{ inputs.server-artifact == '' && runner.os != 'Linux' }}
      shell: bash
      run: bash scripts/build_release_server.sh

    # The base wheel is the medulla-pyengine PyO3 crate (`medulla.engine`) plus
    # the pure-Python package, selected by `[tool.maturin] manifest-path` in
    # pyproject.toml.
    - name: Build engine extension wheel
      uses: ./.github/actions/release-maturin
      with:
        args: >-
          --release
          ${{ env.MEDULLA_WHEEL_JOBS_ARG }}
          --out dist-${{ inputs.pass }}
          ${{ env.MEDULLA_WHEEL_MATURIN_ARGS }}
        container: ${{ steps.build-environment.outputs.container }}
        maturin-version: ${{ steps.build-environment.outputs.maturin-version }}
        prepare-script: ${{ inputs.server-artifact == '' && 'scripts/build_release_server.sh' || '' }}

    # ── Fold the medulla-numeric Surface-A kernel INTO this same wheel (CONCEPT:MEDULLA-346).
    #    Build the pyo3 cdylib kernel (`crates/medulla-numeric --features python`) for the
    #    SAME target, then inject its compiled extension (`.so`/`.pyd`) as
    #    `medulla.numeric`. Result: ONE published `medulla` wheel that
    #    ships BOTH extension modules and no executable -- no separate `medulla-numeric`
    #    package on PyPI.
    - name: Build medulla-numeric kernel (same target)
      uses: ./.github/actions/release-maturin
      with:
        args: >-
          --release
          ${{ env.MEDULLA_WHEEL_JOBS_ARG }}
          --out numdist-${{ inputs.pass }}
          -m crates/medulla-numeric/Cargo.toml
          --features python
        container: ${{ steps.build-environment.outputs.container }}
        maturin-version: ${{ steps.build-environment.outputs.maturin-version }}

    # Container builds create root-owned wheels AND root-owned output dirs. The fold
    # step below rewrites the wheel on the host as the runner user, so it needs the
    # directory to be writable first (release 2.27.9 died with EACCES on
    # dist-primary/*.whl.tmp).
    - name: Hand the container-built wheels to the runner user
      if: ${{ always() && runner.os == 'Linux' }}
      shell: bash
      run: |
        for dir in "dist-${{ inputs.pass }}" "numdist-${{ inputs.pass }}" dist-server-bin; do
          [ -d "$dir" ] || continue
          sudo -n chown -R "$(id -u):$(id -g)" "$dir" 2>/dev/null \
            || docker run --rm -v "$PWD:/w" "${{ steps.build-environment.outputs.container || 'quay.io/pypa/manylinux_2_28_x86_64' }}" chown -R "$(id -u):$(id -g)" "/w/$dir" \
            || true
        done

    - name: Fold numeric kernel into the medulla wheel
      shell: bash
      run: |
        python scripts/inject_numeric_kernel.py "$(ls dist-${{ inputs.pass }}/medulla-*.whl)" "$(ls numdist-${{ inputs.pass }}/*.whl)"
        python scripts/inject_ontology.py "$(ls dist-${{ inputs.pass }}/medulla-*.whl)"

    - name: Fold the server executable into the medulla wheel
      shell: bash
      run: python scripts/inject_server_binary.py "$(ls dist-${{ inputs.pass }}/medulla-*.whl)" "dist-server-bin/$(ls dist-server-bin | grep -xE 'medulla-server(\.exe)?')"

    # Safety net: the server is package data, never a console script; drop any
    # `*.data/scripts/*` member a future build change might emit.
    - name: Strip console scripts
      shell: bash
      run: python scripts/strip_wheel_executables.py dist-${{ inputs.pass }}/*.whl

    - name: Normalize and audit wheel
      shell: bash
      run: |
        python scripts/normalize_wheel_sbom.py dist-${{ inputs.pass }}/*.whl
        python scripts/normalize_wheel_build_paths.py dist-${{ inputs.pass }}/*.whl
        python scripts/check_wheel_privacy.py dist-${{ inputs.pass }}/*.whl

    # Assert the artifact is COMPLETE after every step that rewrites it (inject,
    # sbom, build-path normalization). Published 2.14.0-2.23.0 wheels shipped with
    # NO numeric kernel because nothing here ever inspected the payload — the graft
    # is silent when it fails. Running the gate on the build leg localizes such a
    # regression to the platform that produced it; `publish-pypi` re-runs it on the
    # downloaded artifacts as the actual publish boundary.
    - name: Require a complete wheel (numeric + engine kernels + server + RECORD)
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/xtask-target
      run: cargo --locked xtask wheel-completeness --require-engine-kernel --require-server-binary dist-${{ inputs.pass }}/*.whl

    # Container builds create root-owned target files; hand them back so the
    # cache save (a post step of the restore above) can read and prune them.
    - name: Return container-created files to the runner user
      if: ${{ always() && runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo -n chown -R "$(id -u):$(id -g)" "$CARGO_TARGET_DIR" . 2>/dev/null \
          || docker run --rm -v "$CARGO_TARGET_DIR:/t" -v "$PWD:/w" quay.io/pypa/manylinux_2_28_x86_64 chown -R "$(id -u):$(id -g)" /t /w \
          || true
