[package]
name = "medulla-h-decide"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (decide)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_decide"
path = "src/lib.rs"

[dependencies]
medulla-cypher = { path = "../medulla-cypher" }
medulla-table-store = { path = "../medulla-table-store" }
async-trait = { version = "0.1", optional = true }
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-ann = { path = "../medulla-ann", optional = true }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-index-types = { path = "../medulla-index-types" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-server-api = { path = "../medulla-server-api" }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
tempfile = { version = "3", optional = true }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-reasoner = { path = "../medulla-reasoner" }
medulla-finance-market = { path = "../medulla-finance-market" }
medulla-decision-policy = { path = "../medulla-decision-policy" }
medulla-finance = { path = "../medulla-finance" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-sql = { path = "../medulla-sql" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-sql-lang = { path = "../medulla-sql-lang" }

[features]
ann = ["dep:medulla-ann"]
blob = ["redb"]
decide = ["dep:medulla-numeric", "medulla-numeric/decision", "medulla-decision-stats/decision", "dep:medulla-ann", "medulla-ann?/drift", "solve", "redb"]
epistemic = ["dep:medulla-plan", "medulla-plan/epistemic", "query", "medulla-exec/epistemic"]
finance = []
owl = ["dep:medulla-rdf", "medulla-rdf/owl", "medulla-reasoner/owl"]
query = ["medulla-sql/sql", "medulla-tables/sql", "medulla-table-store/sql", "medulla-cypher/sql", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-exec/query"]
raft = ["redb"]
redb = []
security = ["redb"]
solve = []
server = ["dep:tokio", "dep:async-trait"]
numeric = ["medulla-sql/numeric", "dep:medulla-plan", "medulla-plan?/numeric", "dep:medulla-numeric", "medulla-exec/numeric"]
knowledge-batch = ["dep:medulla-plan", "medulla-plan/knowledge-batch"]
cost-opt = ["dep:medulla-plan", "medulla-plan/cost-opt"]
par-runtime = ["dep:medulla-plan", "medulla-plan/par-runtime", "medulla-exec/par-runtime"]
text = ["dep:medulla-plan", "medulla-plan/text", "medulla-exec/text"]
federation = ["dep:medulla-plan", "medulla-plan/federation", "medulla-exec/federation"]
federation-sql = ["dep:medulla-plan", "medulla-plan/federation-sql"]
geo = ["dep:medulla-plan", "medulla-plan/geo", "medulla-exec/geo"]
tensor = ["dep:medulla-plan", "medulla-plan/tensor", "medulla-exec/tensor"]
stream = ["dep:medulla-plan", "medulla-plan/stream", "medulla-exec/stream"]
nl-query = ["dep:medulla-plan", "medulla-plan/nl-query"]
tsdb = ["dep:medulla-plan", "medulla-plan/timeseries", "medulla-exec/timeseries"]
wasm-udf = ["dep:medulla-plan", "medulla-plan?/wasm-udf", "medulla-exec/wasm-udf"]
gpu = ["dep:medulla-plan", "medulla-plan/tensor-gpu"]
gpu-cuda = ["dep:medulla-plan", "medulla-plan/tensor-gpu-cuda"]
owl-plan = ["dep:medulla-plan", "medulla-plan/owl", "medulla-exec/owl"]
cypher = ["medulla-cypher/cypher"]
cypher-plan = ["medulla-cypher/cypher-plan"]
result-cache = ["medulla-cypher/result-cache"]
rdf = ["dep:medulla-rdf", "medulla-rdf/rdf", "medulla-reasoner/rdf"]
sparql = ["dep:medulla-rdf", "medulla-rdf/sparql"]
sparql-hash = ["dep:medulla-rdf", "medulla-rdf/sparql-hash"]
rdf-xml = ["dep:medulla-rdf", "medulla-rdf/rdf-xml"]
json-ld = ["dep:medulla-rdf", "medulla-rdf/json-ld"]
sparql-star = ["dep:medulla-rdf", "medulla-rdf/sparql-star", "medulla-reasoner/sparql-star", "medulla-persistence/sparql-star", "medulla-server-api/sparql-star"]
geosparql = ["dep:medulla-rdf", "medulla-rdf/geosparql"]
owl-dl = ["dep:medulla-rdf", "medulla-rdf/owl-dl", "medulla-reasoner/owl-dl"]
shacl = ["dep:medulla-shacl"]
test-support = ["dep:tempfile", "redb"]

[dev-dependencies]
medulla-uql = { path = "../medulla-uql", features = ["query"] }
tempfile = "3"
