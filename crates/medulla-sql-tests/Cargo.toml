[package]
name = "medulla-sql-tests"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: integration tests of the SQL engine over tables, user tables, UDFs, PGQ and federation scans"
license = "MIT"
publish = false

[lib]
name = "medulla_sql_tests"
path = "src/lib.rs"

[dependencies]
medulla-sql = { path = "../medulla-sql" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-table-store = { path = "../medulla-table-store", features = ["dev-scope-grant"] }
medulla-tables = { path = "../medulla-tables" }
medulla-sql-udfs = { path = "../medulla-sql-udfs" }
medulla-cypher = { path = "../medulla-cypher" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
serde_json = "1.0"
rmp-serde = "1.3"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-finance-market = { path = "../medulla-finance-market" }

arrow = "58.4"
datafusion = { version = "54", default-features = false, features = ["nested_expressions", "sql"] }
iceberg = "0.10"
medulla-tsdb = { path = "../medulla-tsdb", optional = true }

[features]
finance = ["medulla-sql/finance"]
numeric = ["medulla-sql/numeric", "dep:medulla-tsdb"]
sql = ["medulla-sql/sql"]

[dev-dependencies]
medulla-sql-lang = { path = "../medulla-sql-lang" }
