[package]
name = "medulla-server-store-tests"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served mutation, batch, saga, persistence and store run-owner tests across the server API and store crates."
license = "MIT"
publish = false

[lib]
name = "medulla_server_store_tests"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1" }
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-core = { path = "../medulla-core" }
medulla-h-admin = { path = "../medulla-h-admin" }
medulla-h-jobs = { path = "../medulla-h-jobs" }
medulla-h-query = { path = "../medulla-h-query" }
medulla-h-txn = { path = "../medulla-h-txn" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-store-apply = { path = "../medulla-store-apply" }
medulla-work-store = { path = "../medulla-work-store" }
medulla-lane-store = { path = "../medulla-lane-store" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-server-router = { path = "../medulla-server-router" }

medulla-server = { path = "../medulla-server", features = ["test-support"] }

medulla-plan = { path = "../medulla-plan", optional = true }

medulla-graphql = { path = "../medulla-graphql", optional = true }

openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

medulla-rdf = { path = "../medulla-rdf", optional = true }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-program = { path = "../medulla-program", optional = true }

[features]
broker = []
cypher = ["medulla-server/cypher"]
epistemic = ["medulla-server-router/epistemic", "medulla-server/epistemic", "dep:medulla-plan", "dep:medulla-modality", "medulla-plan/epistemic", "query"]
graphql = ["medulla-server/graphql", "server", "security", "dep:medulla-graphql", "medulla-graphql/hardening"]
mining = ["medulla-server-router/mining", "medulla-server/mining"]
oidc = ["medulla-server-router/oidc", "medulla-server/oidc", "dep:jsonwebtoken"]
program-optimization = ["dep:medulla-program", ]
query = ["medulla-server-router/query", "medulla-server/query", "dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "dep:medulla-plan", "medulla-plan/query", "redb"]
raft = ["medulla-server-router/raft", "medulla-server/raft", "server", "redb", "dep:openraft"]
rdf = ["medulla-server-router/rdf", "medulla-server/rdf", "dep:medulla-rdf", "medulla-rdf/rdf", "server"]
redb = ["medulla-server-router/redb", "medulla-server/redb", "dep:redb", "dep:medulla-transaction", "dep:medulla-storage"]
security = ["medulla-server-router/security", "medulla-server/security", "redb", "dep:sha1", "dep:argon2", "oidc"]
server = ["medulla-server-router/server", "medulla-server/server"]
sparql = ["medulla-server-router/sparql", "medulla-server/sparql", "dep:medulla-rdf", "medulla-rdf/sparql", "rdf"]
streaming = ["medulla-server-router/streaming", "medulla-server/streaming", "server"]
tsdb = ["medulla-server-router/tsdb", "medulla-server/tsdb", "server", "redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-tsdb/redb-store", "medulla-plan/timeseries"]
jobs = ["dep:medulla-jobs"]

[dev-dependencies]
tempfile = "3"
