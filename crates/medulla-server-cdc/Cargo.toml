[package]
name = "medulla-server-cdc"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Change data capture hub, CEP, materialised views, reasoning cascade and impact watch"
license = "MIT"
publish = false

[lib]
name = "medulla_server_cdc"
path = "src/lib.rs"

[dependencies]
medulla-server-api = { path = "../medulla-server-api" }
dashmap = "6.2"
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rand = "0.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-query-cache = { path = "../medulla-query-cache" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-reasoner = { path = "../medulla-reasoner" }

medulla-capabilities = { path = "../medulla-capabilities" }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-exec = { path = "../medulla-exec" }

[features]
broker = ["medulla-server-api/broker", "medulla-core/broker", "medulla-graph-core/broker", "medulla-kernel/broker", "medulla-protocol-types/broker", "medulla-types/broker"]
cdc-kafka = ["streaming", "dep:medulla-stream", "medulla-server-api/cdc-kafka", "medulla-stream?/cdc-kafka"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic", "medulla-exec/epistemic", "medulla-kernel/epistemic", "medulla-plan?/epistemic", "medulla-protocol-types/epistemic", "medulla-types/epistemic"]
matview = ["query", "result-cache", "streaming", "medulla-server-api/matview", "medulla-protocol-types/matview", "medulla-types/matview"]
mining = ["medulla-server-api/mining", "medulla-kernel/mining", "medulla-protocol-types/mining", "medulla-result-types/mining", "medulla-types/mining"]
modality-serving = ["security", "streaming", "dep:medulla-modality", "medulla-server-api/modality-serving", "medulla-capabilities/modality-serving", "medulla-kernel/modality-serving", "medulla-protocol-types/modality-serving", "medulla-types/modality-serving"]
owl = ["dep:medulla-rdf", "medulla-server-api/owl", "medulla-exec/owl", "medulla-plan?/owl", "medulla-protocol-types/owl", "medulla-rdf?/owl", "medulla-reasoner/owl", "medulla-types/owl"]
query = ["dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query", "medulla-exec/query", "medulla-kernel/query", "medulla-plan?/query", "medulla-protocol-types/query", "medulla-result-types/query", "medulla-types/query"]
reasoning = ["medulla-server-api/reasoning", "medulla-kernel/reasoning", "medulla-reasoner/reasoning"]
result-cache = ["medulla-server-api/result-cache", "medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-query-cache/result-cache"]
security = ["medulla-server-api/security", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-types/security"]
shacl = ["dep:medulla-shacl", "medulla-server-api/shacl", "medulla-kernel/shacl", "owl"]
stream = ["query", "dep:medulla-stream", "dep:medulla-plan", "medulla-server-api/stream", "medulla-exec/stream", "medulla-plan?/stream", "medulla-stream?/stream", "medulla-types/stream"]
streaming = ["medulla-server-api/streaming", "medulla-protocol-types/streaming", "medulla-types/streaming"]
[dev-dependencies]
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
