[package]
name = "medulla-wire-msg"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Messaging and object listeners: AMQP, MQTT, STOMP, Redis, DDS, S3 and the KV cache endpoint"
license = "MIT"
publish = false

[lib]
name = "medulla_wire_msg"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
hex = "0.4"
hmac = "0.12"
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-kvcache = { path = "../medulla-kvcache", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }

[features]
amqp-wire = ["server"]
kv = ["server"]
kvcache-server = ["server", "dep:medulla-kvcache"]
mqtt-wire = ["server"]
redis-wire = ["kv", "server"]
ros2-bridge = ["server", "streaming", "dep:futures"]
ros2-dds = ["server", "streaming", "dep:futures"]
ros2-rmw = ["server", "streaming", "dep:futures"]
s3-api = ["kv", "server"]
security = ["dep:sha1"]
server = ["dep:tokio", "dep:medulla-capabilities", "dep:async-trait"]
stomp-wire = ["server"]
streaming = ["server"]
