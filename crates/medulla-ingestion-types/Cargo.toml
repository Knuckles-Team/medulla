[package]
name = "medulla-ingestion-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Ingestion wire types: parse and index results, ingest rules, drains, readback and capabilities, knowledge atoms and streams, extracted facts, ontology proposals, source governance and skill plans"
license = "MIT"
publish = false

[lib]
name = "medulla_ingestion_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"
schemars = { version = "1.2.3", optional = true }

[features]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]
# Gates the knowledge stream wire types, forwarded from `medulla-protocol-types`.
knowledge-batch = ["medulla-types/knowledge-batch"]
# Shared test fixtures (`ingestion_wire::fixtures`), enabled only from
# `[dev-dependencies]`.
test-support = ["medulla-types/test-support"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
