

[package]
name = "medulla-compute-assemble"
version = "0.27.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Compute domains (graph algorithms, finance, datascience, reasoning, AST) for the medulla-engine engine"
license = "MIT"

[lib]
name = "medulla_compute_assemble"

[features]
test-support = ["medulla-types/test-support", "medulla-query-types/test-support", "medulla-decision-policy-types/test-support", "medulla-decision-program-types/test-support", "medulla-decision-statistical-types/test-support", "medulla-decision-types/test-support", "medulla-catalog-source-types/test-support", "medulla-agent-types/test-support", "medulla-work-types/test-support", "medulla-source-types/test-support", "medulla-decision-outcome-types/test-support"]
# `algorithms`, `ast`, and `parser` are always compiled (algorithms is used by
# the always-on graph-op handlers); the heavy domains are gated so a slim build
# links neither their code nor their deps. Mirrors the facade feature names 1:1.
# finance/datascience also turn on the matching medulla-types feature so the wire
# DTOs they re-export (`medulla_types::wire::{Order, FittedModel, ...}`) exist.
# The market-signal layer (`finance::market`) calibrates flip confidence with the
# Decide layer's conformal kernels, so finance links medulla-numeric (always-built
# conformal/risk modules; no `decision` feature needed), and turns trend flips
# into CEP events for medulla-stream's NFA (its runtime-free batch core; no tokio).
finance = ["medulla-types/finance", "medulla-result-types/finance", "medulla-numeric/analytics"]
datascience = ["dep:rand_chacha", "medulla-types/datascience", "medulla-query-types/datascience", "medulla-result-types/datascience"]
# Data-mining domain (CONCEPT:MEDULLA-KG.mining.frequent-itemset-mining): pure-Rust,
# dependency-light frequent-itemset + association-rule mining. It turns on the
# matching medulla-types feature so the `MineAssociate` wire variant exists, and links
# medulla-numeric for the tail-accurate normal CDF/survival the causal-impact
# significance uses and -- with `medulla-numeric/motif` (EH-529, ANALYTICS-HARVEST AH-09)
# -- for `MineAnomaly`'s `Algorithm::MatrixProfileDiscord` alone, which reuses the
# medulla-numeric matrix-profile kernel rather than a second implementation.
mining = ["medulla-types/mining", "medulla-query-types/mining", "medulla-result-types/mining", "medulla-numeric/motif"]
# Graph-learning / neuro-symbolic domain (CONCEPT:MEDULLA-KG.graphlearn.link-predictor):
# a pure-Rust KAN (Kolmogorov-Arnold) link-predictor over the resident graph whose
# learned per-feature edge functions ARE queryable KG artifacts. Reuses the
# analytic-gradient Adam kernels from `datascience::training`, so it implies
# `datascience`; also turns on the matching medulla-types feature so the `GraphLearn*`
# wire variants exist. No heavy dep (no torch) — folded into `full` via `compute`.
graphlearn = ["datascience", "medulla-types/graphlearn", "medulla-query-types/graphlearn", "medulla-result-types/graphlearn"]
reasoning = []
# General bounded 0-1 integer programming with verifiable certificates (Decide
# layer package A3): a deterministic node-budgeted branch-and-bound, Lagrangian
# leaf-bound certificates and an independent verifier (`Method::Solve`). The
# wire DTOs (validated models with integer rows and a lexicographic objective)
# live in `medulla-types::solve`; this gates the search and the certificate verifier.
solve = ["medulla-decision-policy/solve"]
# RF-ADR-010 A2: `is_a` derivation, evidence classification and the task ->
# capability closure the assembly layer reasons with. It builds and solves a
# model, so it implies `solve`.
decide = ["solve", "mining"]
# The statistical half of the Decide layer: heads, calibration and the
# off-policy estimators, which are medulla-numeric kernels.
decide-stats = ["decide", "medulla-numeric/decision", "medulla-decision-stats-records/decision"]
# GPU transitive-closure DISPATCH SEAM (CONCEPT:MEDULLA-KG.compute.reasoning-closure-gpu):
# compiles the `ClosureBackend` trait + backend selection in `reasoning_closure`. The
# pure-Rust CPU hash-join is ALWAYS the compiled-in fallback; this marker just opts a
# build into the seam (and is implied by `gpu-cuda`). No accelerator dep on its own —
# Pi-lean, kept OUT of pi/full by the facade. Implies `reasoning` (the module it extends).
gpu = ["reasoning"]
# REAL CUDA transitive-join backend: pulls `cudarc` (dynamic-loading, so it builds with
# NO CUDA toolkit) and runs the two-pass CSR-join kernel on a GPU when a device is
# present, else falls back to the CPU backend at runtime. Implies `gpu`. OUT of
# pi/default/full — an extras-only feature, mirroring `medulla-ann`'s `gpu-cuda`.
gpu-cuda = ["gpu"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for MergeProposal`
# AND `impl ModalityContract for ast::symbol::Symbol` (the X1 real `evidence_address()` ->
# `EvidenceAddress::CodeSymbol` resolver) + the `modality_conformance_tests!` battery for
# each. OFF by default, deliberately NOT folded into any tier aggregate — it is a
# capability-discovery/testing seam, not a serving feature. `MergeProposal`/
# `resolve_candidates` live in the always-on `algorithms` module and `Symbol` lives in
# the always-on `ast` module, so `contract` needs no other feature implied.
# `cargo test -p medulla-compute --features contract` runs the suite.
contract = ["dep:medulla-modality", "medulla-graph-core/contract", "medulla-numeric/contract"]
ast = []
# CONCEPT:KG-2.106 — the extended-language tier. Feature-gated because each grammar
# adds compile time + binary size; the `ast` core stays lean and `full` opts in.
ast-extended = ["ast"]

[dependencies]
medulla-decision-policy = { path = "../medulla-decision-policy" }
medulla-types = { path = "../medulla-types" }
medulla-ingestion-types = { path = "../medulla-ingestion-types" }
medulla-query-types = { path = "../medulla-query-types" }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
# Reuse medulla-geo's generic symmetric distance-matrix traversal for t-SNE's
# squared-vector metric. Optional with the mining domain so slim builds keep
# the GIS leaf out of their dependency graph.
# The exact numeric kernels the statistical decision surface is built on
# (calibration, conformal prediction, off-policy estimators). Optional so a
# build without `decide-stats` links none of it.
medulla-numeric = { path = "../medulla-numeric" }
# The CEP engine trend-flip events run through (finance::market::events).
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
rayon = "1.12"
sha2 = "0.10"
# Git object ids (SHA-1 object format) and pack streams (MEDULLA-SCM-R010).
sha1 = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
hex = "0.4"
rand = "0.8"
# Lightweight tracing spans for AST parse/index throughput (CONCEPT:MEDULLA-011). The
# `tracing` facade compiles to a no-op unless a subscriber is installed, so this
# adds no runtime cost to a default build.
# ModalityContract retrofit (CONCEPT:E4). Optional, only under `contract` (default
# OFF) — a default build links none of it and `MergeProposal` carries no new
# required trait. See `src/contract.rs`.
medulla-modality = { path = "../medulla-modality", optional = true }

# Optional, domain-gated heavy deps.
rand_chacha = { version = "0.3", optional = true }
# REAL CUDA transitive-join backend (CONCEPT:MEDULLA-KG.compute.reasoning-closure-gpu), only
# under `gpu-cuda`. `dynamic-loading` dlopens libcuda at runtime, so a `gpu-cuda` build
# needs no CUDA toolkit and runs (CPU fallback) on a GPU-less host. Pinned to medulla-ann's
# exact cudarc config so one process shares a single driver/context.
# CONCEPT:EH-281 follow-up: bumped 0.23 -> 0.25 to unlock Terraform/HCL and
# DreamMaker, both ABI 15. Verified additive-only for this crate's own usage
# before bumping: 0.25's core accepts ABI 13..=15 (a strict SUPERSET of
# 0.23/0.24's 13..=14 — TREE_SITTER_MIN_COMPATIBLE_LANGUAGE_VERSION unchanged
# at 13, TREE_SITTER_LANGUAGE_VERSION raised 14->15), so every ABI-14 grammar
# pinned below still loads unchanged; every `pub fn` present in 0.24's Rust
# binding is still present in 0.25 except `child_containing_descendant`,
# which this crate never calls; `impl From<LanguageFn> for Language` (the
# `tree_sitter_x::LANGUAGE.into()` pattern every table row below uses) is
# unchanged; default features (`std` only, no `wasm`) are unchanged. This is
# the ONLY place `tree-sitter` itself is pinned in the workspace (no
# cross-crate version-unification risk).
# Pinned to an ABI-14 grammar: 0.23.5 was regenerated with tree-sitter ABI 15.
# The core (above) now accepts ABI 15 too (bumped for Terraform/HCL and
# DreamMaker — CONCEPT:EH-281 follow-up), so 0.23.5 would load fine today;
# left unchanged here deliberately — bumping an unrelated already-working
# grammar's pin is out of this pass's scope, not a leftover oversight.
# SQL DDL grammar (CONCEPT:KG-2.212) — derekstride's tree-sitter-sql, published as
# `tree-sitter-sequel`. Parses CREATE TABLE/VIEW + FOREIGN KEY into the database
# ontology (tables/columns/views/FKs), part of the `ast` core tier.
# Extended-language tier (CONCEPT:KG-2.106), gated by `ast-extended`.
# CONCEPT:EH-281 grammar expansion — every pin below was checked the same way
# `tree-sitter-c-sharp` above was: download the crate, read `src/parser.c`'s
# `LANGUAGE_VERSION` directly (never inferred from a crate's declared
# `tree-sitter` dev-dependency range — that has been WRONG before), and pin
# the release that matches this crate's core ABI range. No CUDA crate is
# pinned: crates.io's only maintained one (0.21.2) is ABI 15 with no older
# ABI-14 release AND CUDA source is a C++ superset anyway, so `tree_sitter.rs`
# routes `.cu`/`.cuh` through `tree-sitter-cpp` instead (see the CUDA row in
# `CORE_LANGUAGES`) — this one stays unpinned regardless of core ABI.
#
# Julia through JSON below are ABI 14 (this crate's core accepted 13..=14
# before the ABI-15 bump a few lines up, so these predate it and needed no
# change). Terraform/HCL and DreamMaker are ABI 15 — this crate's ONLY
# ABI-15-only pins, which is exactly why the core bump happened: `tree-sitter-hcl`
# has published exactly ONE release ever, 1.1.0, ABI 15, no fork or alternate
# maintained crate exists; `tree-sitter-dm` (feudeytf, MIT, "DreamMaker
# grammar" — the earlier "no maintained grammar at all" finding checked the
# WRONG package name, `tree-sitter-dreammaker`) IS actively maintained (4
# releases) but every one is ABI 15, no ABI-14 release ever published.
# 0.7.x+ moved to ABI 15; 0.6.0 is the newest ABI-14 release.
# Verilog/SystemVerilog (CONCEPT:EH-281). ABI 14 (`src/parser.c`'s
# `LANGUAGE_VERSION` = 14) — verified the same way as every other pin above.
# Julia. Newest release (0.23.1) is already ABI 14, MIT.
# Elixir. Every release ever published (up to 0.3.5) is ABI 14, Apache-2.0.
# PowerShell. 0.26.x+ moved to ABI 15; 0.25.9 is the newest ABI-14 release, MIT.
# Fortran. 0.6.0 moved to ABI 15; 0.5.1 is the newest ABI-14 release, MIT.
# Pascal/Delphi. Newest release (0.10.2) is already ABI 14, MIT.
# HTML/CSS/JSON (CONCEPT:EH-281 follow-up): registered for real parsing —
# content_digest/parser_capability_digest and future dedicated structural
# extraction — even though the generic declaration walker extracts zero
# symbols from any of them today (see `grammars_extended`'s module doc).
# CSS 0.25.0+ and JSON's pre-0.24.3 line moved to/started above ABI 15; the
# versions below are each the newest ABI-14 release, all MIT.
# Terraform/HCL. ABI 15 — the reason the core was bumped. Its one-ever
# release, Apache-2.0.
# DreamMaker. ABI 15. Newest release (0.25.4) is what's pinned, MIT.

# Criterion harness for the AST parse-throughput baseline bench (CONCEPT:MEDULLA-012).
# DEV-only — never linked into the engine binary.
medulla-decision-policy-types = { path = "../medulla-decision-policy-types" }
medulla-decision-program-types = { path = "../medulla-decision-program-types" }
medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-decision-stats-records = { path = "../medulla-decision-stats-records" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[dev-dependencies]
medulla-work-types = { path = "../medulla-work-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types", features = ["test-support"] }
medulla-result-types = { path = "../medulla-result-types" }
medulla-agent-types = { path = "../medulla-agent-types", features = ["test-support"] }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types", features = ["test-support"] }
medulla-decision-policy-types = { path = "../medulla-decision-policy-types", features = ["test-support"] }
medulla-decision-program-types = { path = "../medulla-decision-program-types", features = ["test-support"] }
medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types", features = ["test-support"] }
medulla-decision-types = { path = "../medulla-decision-types", features = ["test-support"] }
# Shared Decide-layer fixtures (`medulla_types::test_support::decision`), also used
# by medulla-types' own derivation tests.
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-ingestion-types = { path = "../medulla-ingestion-types", features = ["test-support"] }
# Deterministic RNG for the reasoning-closure differential/parity tests (the runtime
# `rand_chacha` dep is optional under `datascience`; tests need it unconditionally).
rand_chacha = "0.3"

# Offline `IndexRepository` driver harness: calls `parser::resolve::index_repository`,
# which lives behind the `ast` grammars, so the example is gated to it (a default
# `cargo check --examples`, or a check under another feature such as `solve`, skips it).
# Run: `cargo run -p medulla-compute --features ast --example index_repository_json`.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(medulla_gpu_device_tests)"] }
