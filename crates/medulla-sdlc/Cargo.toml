[package]
name = "medulla-sdlc"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Graph-native development lifecycle: spec rows, gates, verdicts and releases as records"
license = "MIT"
publish = false

[lib]
name = "medulla_sdlc"
path = "src/lib.rs"

[dependencies]
medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-types = { path = "../medulla-types" }

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "delivery_stage"
path = "benches/delivery_stage.rs"
harness = false
