

[package]
name = "medulla-h-ingest"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (ingest)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_ingest"
path = "src/lib.rs"

[dependencies]
jiff = { version = "0.2", optional = true, default-features = false, features = ["std"] }
hex = "0.4"
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-compute = { path = "../medulla-compute" }
medulla-compute-assemble = { path = "../medulla-compute-assemble" }
medulla-core = { path = "../medulla-core" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-decision-policy-types = { path = "../medulla-decision-policy-types" }
medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types" }
medulla-document = { path = "../medulla-document", features = ["reader-pdf", "reader-ooxml", "reader-spreadsheet", "reader-email"] }
medulla-enrich = { path = "../medulla-enrich" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-stream = { path = "../medulla-stream" }
medulla-modality = { path = "../medulla-modality" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
unicode-normalization = "0.1"
medulla-ingestion-types = { path = "../medulla-ingestion-types" }
medulla-query-types = { path = "../medulla-query-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-mutation = { path = "../medulla-server-mutation" }

medulla-rdf = { path = "../medulla-rdf", optional = true }

medulla-h-ingest-repository = { path = "../medulla-h-ingest-repository" }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
test-support = ["medulla-catalog-source-types/test-support", "medulla-catalog-types/test-support", "medulla-compute/test-support", "medulla-compute-assemble/test-support", "medulla-kernel/test-support", "medulla-protocol-types/test-support", "medulla-server-api/test-support", "medulla-types/test-support", "medulla-query-types/test-support", "medulla-work-types/test-support", "medulla-source-types/test-support", "medulla-persistence-records/test-support", "medulla-server-ops/test-support", "medulla-server-blob/test-support", "medulla-server-mutation/test-support", "medulla-h-ingest-repository/test-support"]
asr-whisper = ["medulla-server-api/asr-whisper", "server", "medulla-h-ingest-repository/asr-whisper"]
ast = ["medulla-compute/ast", "medulla-compute-assemble/ast", "medulla-server-api/ast", "medulla-h-ingest-repository/ast"]
blob = ["dep:jiff", "dep:medulla-rdf", "medulla-rdf/rdf", "redb", "medulla-protocol-types/blob", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob", "server", "medulla-h-ingest-repository/blob"]
decide = ["medulla-decision-stats/decision", "redb", "medulla-compute/decide", "medulla-compute-assemble/decide", "medulla-persistence-records/decide", "medulla-server-api/decide", "medulla-server-ops/decide", "epistemic", "numeric", "query", "server", "medulla-h-ingest-repository/decide"]
modality-serving = ["medulla-document/serving", "redb", "security", "medulla-kernel/modality-serving", "medulla-protocol-types/modality-serving", "medulla-server-api/modality-serving", "medulla-server-mutation/modality-serving", "medulla-server-ops/modality-serving", "medulla-types/modality-serving", "server", "medulla-h-ingest-repository/modality-serving"]
query = ["redb", "medulla-kernel/query", "medulla-protocol-types/query", "medulla-server-api/query", "medulla-server-mutation/query", "medulla-server-ops/query", "medulla-types/query", "medulla-query-types/query", "medulla-h-ingest-repository/query"]
raft = ["redb", "medulla-kernel/raft", "medulla-server-api/raft", "medulla-server-mutation/raft", "server", "medulla-h-ingest-repository/raft"]
redb = ["dep:medulla-transaction", "medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-server-api/redb", "medulla-server-blob/redb", "medulla-server-mutation/redb", "medulla-server-ops/redb", "medulla-h-ingest-repository/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-server-api/security", "medulla-server-blob/security", "medulla-server-ops/security", "medulla-types/security", "medulla-h-ingest-repository/security"]
tts-piper = ["medulla-h-ingest-repository/tts-piper"]
epistemic = ["medulla-kernel/epistemic", "medulla-protocol-types/epistemic", "medulla-server-api/epistemic", "medulla-server-mutation/epistemic", "medulla-server-ops/epistemic", "medulla-types/epistemic", "medulla-query-types/epistemic", "query", "redb", "medulla-h-ingest-repository/epistemic"]
alignment = ["medulla-server-api/alignment", "medulla-server-blob/alignment", "blob", "redb", "server", "medulla-h-ingest-repository/alignment"]
knowledge-batch = ["medulla-kernel/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch", "query", "redb", "medulla-h-ingest-repository/knowledge-batch"]
numeric = ["medulla-kernel/numeric", "medulla-server-api/numeric", "medulla-h-ingest-repository/numeric"]
cypher = ["medulla-kernel/cypher", "medulla-server-api/cypher", "medulla-server-mutation/cypher", "medulla-h-ingest-repository/cypher"]
cypher-plan = ["medulla-kernel/cypher-plan", "medulla-server-api/cypher-plan", "cypher", "medulla-h-ingest-repository/cypher-plan"]
result-cache = ["medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-server-api/result-cache", "medulla-server-ops/result-cache", "medulla-h-ingest-repository/result-cache"]
server = ["medulla-kernel/server", "medulla-server-api/server", "medulla-h-ingest-repository/server"]

[dev-dependencies]
async-trait = { version = "0.1" }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types", features = ["test-support"] }
medulla-catalog-types = { path = "../medulla-catalog-types", features = ["test-support"] }
medulla-compute = { path = "../medulla-compute", features = ["test-support"] }
medulla-compute-assemble = { path = "../medulla-compute-assemble", features = ["test-support"] }
medulla-kernel = { path = "../medulla-kernel", features = ["test-support"] }
medulla-sdlc = { path = "../medulla-sdlc" }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-ingestion-types = { path = "../medulla-ingestion-types", features = ["test-support"] }
medulla-work-types = { path = "../medulla-work-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
medulla-persistence-records = { path = "../medulla-persistence-records", features = ["test-support"] }
medulla-server-ops = { path = "../medulla-server-ops", features = ["test-support"] }
medulla-server-blob = { path = "../medulla-server-blob", features = ["test-support"] }
medulla-server-mutation = { path = "../medulla-server-mutation", features = ["test-support"] }
tempfile = "3"
criterion = "0.8"

# Nightly hot-path proofs of the repository enrichment hooks.

[[bench]]
name = "r601_history_served"
path = "benches/r601_history_served.rs"
harness = false

[[bench]]
name = "lifecycle_record_deployment"
path = "benches/lifecycle_record_deployment.rs"
harness = false

[[bench]]
name = "lifecycle_spec_history_ingest"
path = "benches/lifecycle_spec_history_ingest.rs"
harness = false

[[bench]]
name = "lifecycle_project_mode"
path = "benches/lifecycle_project_mode.rs"
harness = false

[[bench]]
name = "r602_links_served"
path = "benches/r602_links_served.rs"
harness = false

[[bench]]
name = "r603_fingerprint_served"
path = "benches/r603_fingerprint_served.rs"
harness = false

[[bench]]
name = "r600_enrich_served"
path = "benches/r600_enrich_served.rs"
harness = false
required-features = ["test-support"]

[[bench]]
name = "spec_ingest"
path = "benches/spec_ingest.rs"
harness = false
