

[package]
name = "medulla-h-ingest-repository"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (ingest)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_ingest_repository"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
hmac = "0.12"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-audio = { path = "../medulla-audio", optional = true }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-compute = { path = "../medulla-compute" }
medulla-compute-assemble = { path = "../medulla-compute-assemble" }
medulla-core = { path = "../medulla-core" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-decision-policy-types = { path = "../medulla-decision-policy-types" }
medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types" }
medulla-document = { path = "../medulla-document", features = ["reader-pdf", "reader-ooxml", "reader-spreadsheet", "reader-email"] }
medulla-enrich = { path = "../medulla-enrich" }
medulla-image = { path = "../medulla-image", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-types = { path = "../medulla-types" }
medulla-ingestion-types = { path = "../medulla-ingestion-types" }
medulla-identity-core-types = { path = "../medulla-identity-core-types" }
medulla-query-types = { path = "../medulla-query-types" }
medulla-video = { path = "../medulla-video", optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-isolation = { path = "../medulla-isolation" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-decision-stats-records = { path = "../medulla-decision-stats-records" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-auth = { path = "../medulla-server-auth" }

medulla-asr-whisper = { path = "../medulla-asr-whisper", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }

[features]
test-support = ["medulla-server-auth/test-support", "medulla-agent-types/test-support", "medulla-catalog-types/test-support", "medulla-compute/test-support", "medulla-compute-assemble/test-support", "medulla-kernel/test-support", "medulla-persistence/test-support", "medulla-protocol-types/test-support", "medulla-raft/test-support", "medulla-server-api/test-support", "medulla-store/test-support", "medulla-types/test-support", "medulla-query-types/test-support", "medulla-work-types/test-support", "medulla-source-types/test-support", "medulla-server-ops/test-support", "medulla-server-blob/test-support", "medulla-server-mutation/test-support"]
asr-whisper = ["dep:medulla-audio", "medulla-audio/asr", "dep:medulla-asr-whisper", "medulla-persistence/asr-whisper", "medulla-raft/asr-whisper", "medulla-server-api/asr-whisper", "server"]
ast = ["medulla-compute/ast", "medulla-compute-assemble/ast", "medulla-server-api/ast", "medulla-store/ast"]
blob = ["dep:medulla-rdf", "medulla-rdf/rdf", "redb", "medulla-protocol-types/blob", "medulla-raft/blob", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob", "server"]
decide = ["medulla-decision-stats/decision", "medulla-decision-stats-records/decision", "redb", "medulla-compute/decide", "medulla-compute-assemble/decide", "medulla-persistence/decide", "medulla-raft/decide", "medulla-server-api/decide", "medulla-server-ops/decide", "epistemic", "numeric", "query", "server"]
modality-serving = ["dep:medulla-video", "medulla-video/runtime", "dep:medulla-image", "medulla-image/runtime", "medulla-document/serving", "dep:medulla-audio", "medulla-audio/runtime", "redb", "security", "medulla-kernel/modality-serving", "medulla-persistence/modality-serving", "medulla-protocol-types/modality-serving", "medulla-raft/modality-serving", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-mutation/modality-serving", "medulla-server-ops/modality-serving", "medulla-types/modality-serving", "server"]
query = ["medulla-tables/sql", "medulla-table-store/sql", "redb", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-raft/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-mutation/query", "medulla-server-ops/query", "medulla-store/query", "medulla-types/query", "medulla-query-types/query"]
raft = ["redb", "medulla-kernel/raft", "medulla-persistence/raft", "medulla-raft/raft", "medulla-server-api/raft", "medulla-server-auth/raft", "medulla-server-mutation/raft", "medulla-store/raft", "server"]
redb = ["dep:medulla-storage", "dep:medulla-transaction", "medulla-kernel/redb", "medulla-persistence/redb", "medulla-raft/redb", "medulla-server-api/redb", "medulla-server-blob/redb", "medulla-server-mutation/redb", "medulla-server-ops/redb", "medulla-store/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-persistence/security", "medulla-protocol-types/security", "medulla-raft/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-server-ops/security", "medulla-store/security", "medulla-types/security"]
tts-piper = ["dep:medulla-audio", "medulla-audio/tts"]
epistemic = ["medulla-kernel/epistemic", "medulla-protocol-types/epistemic", "medulla-raft/epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-mutation/epistemic", "medulla-server-ops/epistemic", "medulla-types/epistemic", "medulla-query-types/epistemic", "query", "redb"]
alignment = ["medulla-raft/alignment", "medulla-server-api/alignment", "medulla-server-blob/alignment", "blob", "redb", "server"]
knowledge-batch = ["medulla-kernel/knowledge-batch", "medulla-persistence/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-raft/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch", "query", "redb"]
numeric = ["medulla-kernel/numeric", "medulla-persistence/numeric", "medulla-raft/numeric", "medulla-server-api/numeric"]
cypher = ["medulla-kernel/cypher", "medulla-persistence/cypher", "medulla-server-api/cypher", "medulla-server-auth/cypher", "medulla-server-mutation/cypher"]
cypher-plan = ["medulla-kernel/cypher-plan", "medulla-persistence/cypher-plan", "medulla-server-api/cypher-plan", "cypher"]
result-cache = ["medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-persistence/result-cache", "medulla-server-api/result-cache", "medulla-server-ops/result-cache"]
server = ["medulla-kernel/server", "medulla-persistence/server", "medulla-raft/server", "medulla-server-api/server", "medulla-store/server"]

[dev-dependencies]
medulla-agent-types = { path = "../medulla-agent-types", features = ["test-support"] }
medulla-catalog-types = { path = "../medulla-catalog-types", features = ["test-support"] }
medulla-compute = { path = "../medulla-compute", features = ["test-support"] }
medulla-compute-assemble = { path = "../medulla-compute-assemble", features = ["test-support"] }
medulla-kernel = { path = "../medulla-kernel", features = ["test-support"] }
medulla-persistence = { path = "../medulla-persistence", features = ["test-support"] }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-raft = { path = "../medulla-raft", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-store = { path = "../medulla-store", features = ["test-support"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-ingestion-types = { path = "../medulla-ingestion-types", features = ["test-support"] }
medulla-identity-core-types = { path = "../medulla-identity-core-types" }
medulla-work-types = { path = "../medulla-work-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
medulla-server-ops = { path = "../medulla-server-ops", features = ["test-support"] }
medulla-server-blob = { path = "../medulla-server-blob", features = ["test-support"] }
medulla-server-mutation = { path = "../medulla-server-mutation", features = ["test-support"] }
medulla-server = { path = "../medulla-server", features = ["alignment", "asr-whisper", "ast", "blob", "cypher", "cypher-plan", "decide", "epistemic", "full", "knowledge-batch", "modality-serving", "numeric", "query", "raft", "redb", "result-cache", "security", "server", "test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support"] }
medulla-test-ambient-auth = { path = "../medulla-test-ambient-auth" }

# Nightly hot-path proofs of the repository enrichment hooks.
