[package]
name = "medulla-mining"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Pattern and process mining over graph records"
license = "MIT"
publish = false

[lib]
name = "medulla_mining"
path = "src/lib.rs"

[dependencies]
medulla-compute-assemble = { path = "../medulla-compute-assemble" }
medulla-types = { path = "../medulla-types" }
medulla-query-types = { path = "../medulla-query-types" }
medulla-geo = { path = "../medulla-geo", default-features = false, optional = true }
medulla-numeric = { path = "../medulla-numeric", optional = true }
serde_json = "1.0"
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
mining = ["dep:medulla-geo", "dep:medulla-numeric", "medulla-compute-assemble/mining", "medulla-types/mining", "medulla-query-types/mining"]

[dev-dependencies]
medulla-compute-assemble = { path = "../medulla-compute-assemble", features = ["test-support"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-query-types = { path = "../medulla-query-types", features = ["test-support"] }
