redb = ["medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-persistence/redb", "medulla-raft/redb", "medulla-server-api/redb", "medulla-server-mutation/redb", "medulla-server-ops/redb"]
statechart = ["dep:medulla-statechart", "dep:medulla-capabilities", "medulla-capabilities/statechart", "medulla-persistence/statechart", "medulla-protocol-types/statechart", "medulla-raft/statechart", "medulla-server-api/statechart", "medulla-server-mutation/statechart", "medulla-types/statechart"]
decide = ["dep:medulla-capabilities", "medulla-capabilities?/decide", "medulla-compute/decide", "medulla-persistence-records/decide", "medulla-persistence/decide", "medulla-raft/decide", "medulla-retrieval/decide", "medulla-server-api/decide", "medulla-server-ops/decide"]
server = ["dep:tokio", "dep:medulla-capabilities", "medulla-kernel/server", "medulla-persistence/server", "medulla-raft/server", "medulla-server-api/server"]
viz = ["dep:medulla-capabilities", "medulla-capabilities?/viz", "medulla-persistence/viz", "medulla-protocol-types/viz", "medulla-raft/viz", "medulla-server-api/viz", "medulla-types/viz"]
modality-serving = ["dep:medulla-modality", "dep:medulla-capabilities", "medulla-capabilities/modality-serving", "medulla-kernel/modality-serving", "medulla-persistence/modality-serving", "medulla-protocol-types/modality-serving", "medulla-raft/modality-serving", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-mutation/modality-serving", "medulla-server-ops/modality-serving", "medulla-types/modality-serving"]
asr-whisper = ["dep:medulla-capabilities", "medulla-capabilities/asr-native", "medulla-persistence/asr-whisper", "medulla-raft/asr-whisper", "medulla-server-api/asr-whisper"]
quantum-agent-api = ["dep:medulla-capabilities", "medulla-capabilities/quantum", "medulla-persistence/quantum-agent-api", "medulla-raft/quantum-agent-api", "medulla-server-api/quantum-agent-api"]
