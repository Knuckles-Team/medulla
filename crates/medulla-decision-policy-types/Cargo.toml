

[package]
name = "medulla-decision-policy-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Decision ladder vocabulary: ResolutionKind, evidence classes, decision requests, answers and revision records"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_policy_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-query-types = { path = "../medulla-query-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
rmp-serde = "1.3"
sha2 = "0.10"
rand_chacha = "0.3"
base64 = "0.23"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-source-types = { path = "../medulla-source-types" }

medulla-decision-statistical-types = { path = "../medulla-decision-statistical-types" }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
wire-contract = ["query", "medulla-types/wire-contract", "medulla-query-types/wire-contract", "medulla-agent-types/wire-contract", "medulla-decision-statistical-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-query-types/wire-complete", "medulla-agent-types/wire-complete", "medulla-decision-statistical-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-query-types/contract-schema", "medulla-agent-types/contract-schema", "medulla-source-types/contract-schema", "medulla-decision-statistical-types/contract-schema"]
query = ["medulla-types/query", "medulla-query-types/query", "medulla-decision-statistical-types/query"]
test-support = ["medulla-types/test-support", "medulla-query-types/test-support", "medulla-agent-types/test-support", "medulla-source-types/test-support", "medulla-decision-statistical-types/test-support"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-agent-types = { path = "../medulla-agent-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
