[package]
name = "medulla-cypher"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Cypher language, its executor, graph data science calls and the edge index"
license = "MIT"
publish = false

[lib]
name = "medulla_cypher"
path = "src/lib.rs"

[dependencies]
ipnet = { version = "2.12", optional = true }
base64 = { version = "0.23", optional = true }
hex = { version = "0.4", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
redb = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1.53", features = ["rt"], optional = true }
arrow-schema = { version = "58.4", optional = true }
arrow = { version = "58.4", optional = true }
datafusion = { version = "54", default-features = false, optional = true, features = ["nested_expressions", "sql"] }
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
medulla-compute = { path = "../medulla-compute" }
medulla-text = { path = "../medulla-text", optional = true }
medulla-ann = { path = "../medulla-ann", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.8.3", features = ["serde-1"], optional = true }
tracing = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-table-store = { path = "../medulla-table-store" }

[features]
cypher = ["dep:petgraph"]
cypher-graphlearn = ["cypher"]
cypher-mining = ["cypher"]
cypher-plan = ["cypher", "dep:tracing"]
result-cache = ["cypher"]
sql = ["dep:datafusion", "dep:arrow", "dep:arrow-schema", "dep:tokio", "dep:petgraph", "dep:tracing", "dep:async-trait", "dep:redb", "dep:medulla-storage", "dep:medulla-transaction", "dep:medulla-text", "dep:medulla-ann", "dep:futures-util", "dep:md-5", "dep:sha1", "dep:sha2", "dep:hex", "dep:base64", "dep:ipnet", "medulla-table-store/sql"]
