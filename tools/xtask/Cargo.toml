[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Repository checks and certification campaigns, one subcommand each (cargo xtask <name>)."

[dependencies]
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
regex = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "derive", "printing", "clone-impls", "visit"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
