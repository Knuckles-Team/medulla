[package]
name = "medulla-raft-xshard"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Cross-shard transactions and reads, elasticity and the raft test harnesses"
license = "MIT"
publish = false

[lib]
name = "medulla_raft_xshard"
path = "src/lib.rs"

[dependencies]
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
futures = { version = "0.3", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-server-api = { path = "../medulla-server-api" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-types = { path = "../medulla-types" }
openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }
petgraph = { version = "0.8.3", features = ["serde-1"] }
rand = "0.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
serde_bytes = "0.11.19"
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-raft = { path = "../medulla-raft" }

[features]
calvin = ["nonblocking", "medulla-raft/calvin"]
compute-dist = ["raft", "medulla-raft/compute-dist"]
harness = ["raft", "medulla-raft/harness"]
nonblocking = ["raft", "medulla-raft/nonblocking"]
query = ["redb", "dep:medulla-plan", "medulla-plan/query", "medulla-raft/query"]
raft = ["redb", "dep:openraft", "dep:futures", "medulla-raft/raft"]
redb = ["dep:medulla-transaction", "medulla-raft/redb"]
security = ["redb", "medulla-raft/security"]
streaming = ["medulla-raft/streaming"]
test-support = ["harness", "dep:tracing-subscriber", "medulla-raft/test-support"]

[dev-dependencies]
medulla-raft = { path = "../medulla-raft", features = ["harness", "test-support"] }
tracing-subscriber = "0.3"
