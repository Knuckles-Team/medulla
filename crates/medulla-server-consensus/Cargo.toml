[package]
name = "medulla-server-consensus"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Consensus dispatch"
license = "MIT"
publish = false

[lib]
name = "medulla_server_consensus"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-h-jobs = { path = "../medulla-h-jobs" }
medulla-h-txn = { path = "../medulla-h-txn" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-work-store = { path = "../medulla-work-store" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-server-graph = { path = "../medulla-server-graph" }

medulla-capabilities = { path = "../medulla-capabilities" }

openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }

redb = { workspace = true, optional = true }

medulla-transaction = { path = "../medulla-transaction", optional = true }

medulla-storage = { path = "../medulla-storage", optional = true }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }

async-trait = { version = "0.1" }

medulla-plan = { path = "../medulla-plan", optional = true }

medulla-modality = { path = "../medulla-modality", optional = true }

medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-isolation = { path = "../medulla-isolation" }
tracing = "0.1"

[features]
ast = []
epistemic = ["medulla-server-graph/epistemic", "dep:medulla-plan", "medulla-plan/epistemic", "dep:medulla-modality", "query", "medulla-h-jobs/epistemic", "medulla-h-txn/epistemic", "medulla-kernel/epistemic", "medulla-protocol-types/epistemic", "medulla-raft/epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-types/epistemic"]
jobs = ["medulla-server-graph/jobs", "medulla-capabilities/jobs", "server", "mining", "epistemic", "medulla-agent-types/jobs", "medulla-h-jobs/jobs", "medulla-protocol-types/jobs", "medulla-raft/jobs", "medulla-server-api/jobs", "medulla-types/jobs", "medulla-work-types/jobs"]
mining = ["medulla-server-graph/mining", "medulla-kernel/mining", "medulla-protocol-types/mining", "medulla-result-types/mining", "medulla-server-api/mining", "medulla-server-auth/mining", "medulla-types/mining"]
oidc = ["medulla-server-graph/oidc", "dep:jsonwebtoken", "medulla-server-api/oidc", "medulla-server-auth/oidc"]
query = ["medulla-server-graph/query", "dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-h-jobs/query", "medulla-h-txn/query", "medulla-kernel/query", "medulla-protocol-types/query", "medulla-raft/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-types/query"]
raft = ["medulla-server-graph/raft", "redb", "dep:openraft", "server", "medulla-h-jobs/raft", "medulla-h-txn/raft", "medulla-kernel/raft", "medulla-raft/raft", "medulla-server-api/raft", "medulla-server-auth/raft"]
redb = ["medulla-server-graph/redb", "dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-h-jobs/redb", "medulla-h-txn/redb", "medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-raft/redb", "medulla-server-api/redb"]
security = ["medulla-server-graph/security", "redb", "dep:sha1", "dep:argon2", "oidc", "medulla-graph-core/security", "medulla-h-txn/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-raft/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-types/security", "medulla-work-store/security"]
server = ["medulla-server-graph/server", "medulla-h-jobs/server", "medulla-h-txn/server", "medulla-kernel/server", "medulla-raft/server", "medulla-server-api/server"]

[dev-dependencies]
medulla-agent-types = { path = "../medulla-agent-types", features = ["test-support"] }
medulla-catalog-types = { path = "../medulla-catalog-types", features = ["test-support"] }
medulla-h-txn = { path = "../medulla-h-txn", features = ["test-support"] }
medulla-identity-types = { path = "../medulla-identity-types", features = ["test-support"] }
medulla-kernel = { path = "../medulla-kernel", features = ["test-support"] }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-raft = { path = "../medulla-raft", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-work-types = { path = "../medulla-work-types", features = ["test-support"] }
medulla-work-store = { path = "../medulla-work-store", features = ["test-support"] }
medulla-persistence-records = { path = "../medulla-persistence-records", features = ["test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support", "test-ambient-auth"] }
medulla-server-graph = { path = "../medulla-server-graph", features = ["test-support"] }
