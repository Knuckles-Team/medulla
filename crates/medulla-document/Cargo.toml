[package]
name = "medulla-document"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Pure-Rust document modality for the medulla-engine engine (CONCEPT:MEDULLA-P1-3): typed pages, layout blocks, tables, spans, and an EvidenceAddress::CharacterRange contract without heavyweight PDF/OCR dependencies."
license = "MIT"

[lib]
name = "medulla_document"

# Pure-Rust leaf: serde persists the source-free normalized value and SHA-256 binds it
# to the request-local source. The native UTF-8 decoder extracts bounded pages, layout,
# exact spans, table shape, and opaque authority-keyed lexical postings.
[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-ingestion-types = { path = "../medulla-ingestion-types" }
medulla-query-types = { path = "../medulla-query-types" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
# ModalityContract retrofit (CONCEPT:MEDULLA-P1-3, mirroring medulla-image/medulla-audio/medulla-video's
# CONCEPT:E4). Optional, only under `contract` (default OFF) — a default
# build links none of it and `DocumentData` carries no new required trait. See
# `src/contract.rs`.
medulla-modality = { path = "../medulla-modality" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
thiserror = "2.0"
# Reader parsers (MEDULLA-INGEST-WORKER-R700.7 to R700.10). `default-features = false`
# keeps every date-time feature (and so `chrono`) off, which the manifest rule of
# MEDULLA-INGEST-WORKER-R700.1 requires; each is linked only under its `reader-*` feature.
lopdf = { version = "0.47", default-features = false, optional = true }
zip = { version = "2.6.1", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.41", optional = true }
calamine = { version = "0.38", default-features = false, optional = true }
# 1.x needs rust-version 1.98; the pinned toolchain is 1.96.0.
mail-parser = { version = "0.11.9", default-features = false, optional = true }

[features]
default = []
# ModalityContract retrofit (CONCEPT:MEDULLA-P1-3): `impl ModalityContract for
# DocumentData` + the `modality_conformance_tests!` battery. OFF by default; the
# separate `serving` feature promotes it to the governed runtime and the facade's
# production feature surface. `cargo test -p medulla-document --features serving` runs it.
contract = []
# Production served state machine: governed batch/stream ingest, OCC update,
# delete/replay, policy-filtered paging, lifecycle, indexes, and restart recovery.
# Dependency-light: this reuses medulla-modality + serde only.
serving = ["contract"]
# One feature per format reader (MEDULLA-INGEST-WORKER-R700.1). Each admits its parser
# dependency only after tests/test_third_party_source_policy.py passes for it:
# lopdf (pdf), zip + quick-xml (ooxml), calamine (spreadsheet), mail-parser (email), csv.
reader-pdf = ["dep:lopdf"]
reader-ooxml = ["dep:zip", "dep:quick-xml"]
reader-spreadsheet = ["dep:calamine"]
reader-email = ["dep:mail-parser"]
reader-csv = []
[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-catalog-types = { path = "../medulla-catalog-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
serde_json = "1.0"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[[bench]]
name = "document_chunk_tree"
harness = false

[[bench]]
name = "reader_pdf"
harness = false
required-features = ["reader-pdf"]
