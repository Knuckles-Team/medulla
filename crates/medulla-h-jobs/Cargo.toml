[package]
name = "medulla-h-jobs"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (jobs)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_jobs"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-program = { path = "../medulla-program", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-query = { path = "../medulla-query", optional = true }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-statechart = { path = "../medulla-statechart", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }

[features]
ann-redb = ["redb"]
jobs = ["dep:medulla-jobs", "dep:medulla-capabilities", "medulla-capabilities/jobs", ]
knowledge-batch = ["dep:medulla-plan", "medulla-plan/knowledge-batch", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-capabilities/knowledge-batch", "query"]
program-optimization = ["dep:medulla-program", "jobs"]
query = ["dep:medulla-query", "medulla-query/sql", "dep:medulla-plan", "medulla-plan/query", "redb"]
raft = ["redb"]
redb = []
statechart = ["dep:medulla-statechart", "dep:medulla-capabilities", "medulla-capabilities/statechart", ]
decide = ["dep:medulla-capabilities", "medulla-capabilities?/decide"]
server = ["dep:tokio", "dep:medulla-capabilities"]
viz = ["dep:medulla-capabilities", "medulla-capabilities?/viz"]
modality-serving = ["dep:medulla-modality", "dep:medulla-capabilities", "medulla-capabilities/modality-serving"]
asr-whisper = ["dep:medulla-capabilities", "medulla-capabilities/asr-native"]
quantum-agent-api = ["dep:medulla-capabilities", "medulla-capabilities/quantum"]
epistemic = ["dep:medulla-plan", "medulla-plan/epistemic", "dep:medulla-modality"]
alignment = ["dep:medulla-modality"]
numeric = ["dep:medulla-query", "medulla-query?/numeric", "dep:medulla-plan", "medulla-plan?/numeric"]
cost-opt = ["dep:medulla-plan", "medulla-plan/cost-opt"]
par-runtime = ["dep:medulla-plan", "medulla-plan/par-runtime"]
text = ["dep:medulla-plan", "medulla-plan/text"]
federation = ["dep:medulla-plan", "medulla-plan/federation"]
federation-sql = ["dep:medulla-plan", "medulla-plan/federation-sql"]
geo = ["dep:medulla-plan", "medulla-plan/geo"]
tensor = ["dep:medulla-plan", "medulla-plan/tensor"]
stream = ["dep:medulla-plan", "medulla-plan/stream"]
nl-query = ["dep:medulla-plan", "medulla-plan/nl-query"]
tsdb = ["dep:medulla-plan", "medulla-plan/timeseries"]
wasm-udf = ["dep:medulla-plan", "medulla-plan?/wasm-udf"]
gpu = ["dep:medulla-plan", "medulla-plan/tensor-gpu"]
gpu-cuda = ["dep:medulla-plan", "medulla-plan/tensor-gpu-cuda"]
owl-plan = ["dep:medulla-plan", "medulla-plan/owl"]
cypher = ["dep:medulla-query", "medulla-query/cypher"]
cypher-plan = ["dep:medulla-query", "medulla-query/cypher-plan"]
result-cache = ["dep:medulla-query", "medulla-query?/result-cache"]

[dev-dependencies]
tempfile = "3"
