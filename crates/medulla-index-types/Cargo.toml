[package]
name = "medulla-index-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Semantic index, embedding, managed index and entity resolution types"
license = "MIT"
publish = false

[lib]
name = "medulla_index_types"
path = "src/lib.rs"

[dependencies]
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
medulla-types = { path = "../medulla-types" }
medulla-query-types = { path = "../medulla-query-types", features = ["query"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
wire-contract = ["medulla-types/wire-contract", "medulla-query-types/wire-contract", "medulla-mutation-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-query-types/wire-complete", "medulla-mutation-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-catalog-source-types/contract-schema", "medulla-types/contract-schema", "medulla-query-types/contract-schema", "medulla-mutation-types/contract-schema"]

[dev-dependencies]
rmp-serde = "1.3"
medulla-types = { path = "../medulla-types", features = ["test-support"] }
