

[package]
name = "medulla-h-graph-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (graph)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_graph_gateway"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
hmac = "0.12"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-catalog-source-types = { path = "../medulla-catalog-source-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-compute-assemble = { path = "../medulla-compute-assemble" }
medulla-core = { path = "../medulla-core" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-retrieval = { path = "../medulla-retrieval" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-query-types = { path = "../medulla-query-types" }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
medulla-finance-types = { path = "../medulla-finance-types" }
medulla-ingestion-types = { path = "../medulla-ingestion-types" }
medulla-identity-core-types = { path = "../medulla-identity-core-types" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-uql = { path = "../medulla-uql" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation", features = ["security"] }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-mining = { path = "../medulla-mining" }
medulla-reasoner = { path = "../medulla-reasoner" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-stats-records = { path = "../medulla-decision-stats-records", features = ["decision"] }
medulla-decision-memory = { path = "../medulla-decision-memory" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops", features = ["shacl"] }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-server-blob = { path = "../medulla-server-blob", optional = true }
medulla-h-ingest-repository = { path = "../medulla-h-ingest-repository" }
medulla-finance = { path = "../medulla-finance", optional = true }
medulla-finance-quant = { path = "../medulla-finance-quant", optional = true }
medulla-finance-market = { path = "../medulla-finance-market", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-source-types = { path = "../medulla-source-types" }
medulla-virtual-graph = { path = "../medulla-virtual-graph" }

[features]
