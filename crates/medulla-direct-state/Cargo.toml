[package]
name = "medulla-direct-state"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Direct state: the storage owner's in-place state tables and their codecs"
license = "MIT"
publish = false

[lib]
name = "medulla_direct_state"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.53", features = ["sync"] }
uuid = { version = "1.28", features = ["v4"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde_bytes = "0.11.19"
tempfile = "3"

[features]
test-support = ["medulla-types/test-support"]
[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
tokio = { version = "1.53", features = ["sync", "macros", "rt", "time"] }
