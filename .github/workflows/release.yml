name: Release

# ─────────────────────────────────────────────────────────────────────────
# Tag pipeline: build, check and publish ONLY (spec MEDULLA-CONTRACT-R053.7).
# Every test, gate, feature build and benchmark lives in ci.yml and runs on
# pull requests and main. `guard` refuses to proceed unless ci.yml already
# concluded `success` for this exact commit on main, so a tag publishes only
# a commit main CI has passed.
#
#   guard -> server-binary (matrix leg, server compiled once per platform)
#         -> build (matrix leg)  -> folds that server, uploads its own wheel to PyPI
#         -> build-x86           -> publish-x86 uploads the Linux x86_64 wheel
#         -> build-sdist         -> uploads the source distribution
#   build + build-x86 -> server-image -> per-arch image from the Linux wheels, one multi-arch manifest
#   every uploader -> verify-pypi (checks every expected file reached PyPI)
#
# ONE distribution, `medulla` (spec MEDULLA-CONTRACT-R053): each platform wheel
# carries the two PyO3 extension modules and the `medulla-server` executable for
# that platform at medulla/_bin/medulla-server (.github/actions/folded-wheel).
# Each platform publishes the moment its own completeness and smoke checks pass,
# so a slow or failed platform never blocks the others. `twine upload
# --skip-existing` makes every upload idempotent. The server container image is
# built from the Linux wheels. The rolling `engine-main` prerelease asset is
# published by ci.yml on every main push.
#
# A manual dispatch builds every wheel (primary plus a byte-identical
# reproduction pass) and the sdist, and publishes nothing.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_untested:
        description: >-
          EMERGENCY ONLY. Publish although ci.yml has no successful run for this
          commit. The override is logged in the run summary.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Registry and git fetches retry dropped connections (curl [55] SSL_read
  # resets from crates.io failed a feature-build leg) instead of cargo's 3.
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: "1"
  # Hosted runners have 4 vCPU / 16 GB. About 80% of a cold facade build is
  # codegen and linking, which one job serialised (a 4.5 h single-job gate).
  # Four jobs with no debuginfo keeps memory bounded; the cross-built wheel
  # matrix (`build`) overrides this back down.
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # A tag publishes only a commit main CI already passed.
  guard:
    name: Require a passing ci.yml run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Verify ci.yml concluded success for the tagged commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_untested }}
        run: |
          set -euo pipefail
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          count="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&event=push&branch=main" --jq '.total_count')"
          echo "successful main ci.yml runs for ${SHA}: ${count}"
          if [ "${count}" -ge 1 ]; then
            echo "### Guard passed" >> "$GITHUB_STEP_SUMMARY"
            echo "ci.yml concluded success on main for \`${SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${FORCE}" = "true" ]; then
            echo "::warning::force_untested: publishing ${SHA} without a successful ci.yml run on main"
            echo "### Guard OVERRIDDEN (force_untested)" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful main ci.yml run for \`${SHA}\`; dispatched by ${GITHUB_ACTOR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::REFUSING to publish: ci.yml has no successful main run for ${SHA}. Wait for main CI, or dispatch with force_untested for an emergency."
          exit 1

  # MEDULLA-CONTRACT-R006.2: every tag requalifies the embedded method codec --
  # two independent canonical builds must be byte-identical and within the
  # MAX_BYTES budget. Nothing is committed (MEDULLA-SDLC-R020.1).
  method-codec:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    needs: guard
    if: >-
      github.repository == 'Knuckles-Team/medulla'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust-toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Install the pinned toolchain's wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Requalify the embedded method-body codec
        run: python3 scripts/build_method_codec_wasm.py

  # ── Release server executable: compiled ONCE per platform in its own job and
  # handed to that platform's wheel job as an artifact with its sha256. Both
  # folded-wheel passes (primary and reproduction) fold these exact bytes, so the
  # expensive release-server link never runs twice and the wheel job only
  # builds the extension modules. Linux compiles inside the wheel's manylinux
  # container, keeping the pinned glibc baseline. The Linux x86_64 wheel is built
  # by the reusable workflow below, which compiles its own server in-job.
  server-binary:
    timeout-minutes: 360
    name: server-binary ${{ matrix.name }}
    needs: guard
    if: >-
      github.repository == 'Knuckles-Team/medulla'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    env:
      MEDULLA_WHEEL_TARGET: ${{ matrix.target }}
      MEDULLA_WHEEL_JOBS_ARG: ${{ matrix.jobs && format('--jobs {0}', matrix.jobs) || '' }}
      MEDULLA_WHEEL_MANYLINUX: ${{ startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto' }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            jobs: 1
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            jobs: 4
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            jobs: 2
            optional: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust-toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      - name: Select the verified native Mach-O linker
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.channel }}
        run: |
          case "$MEDULLA_WHEEL_TARGET" in
            aarch64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
          esac
          source scripts/configure_macos_linker.sh "$MEDULLA_WHEEL_TARGET"
          python - <<'PYENV'
          import os
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in ("SDKROOT", "MACOSX_DEPLOYMENT_TARGET", "RUSTUP_TOOLCHAIN", "CARGO_ENCODED_RUSTFLAGS"):
                  output.write(f"{key}={os.environ[key]}\n")
          PYENV

      - name: Build the release server executable (${{ matrix.name }})
        uses: ./.github/actions/server-binary

      - name: Upload the server executable and its sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.name }}
          path: dist-server-bin/medulla-server*
          if-no-files-found: error

  # ── Release wheel matrix: the expensive cross-platform reproducible build.
  # The product tests and installed-wheel smoke already ran in ci.yml.
  build:
    timeout-minutes: 360
    name: wheel ${{ matrix.name }}
    needs: [guard, server-binary]
    # Hosted platform legs; x86 is isolated in the immutable reusable job below.
    # A failed server leg fails only its own platform's download step.
    if: >-
      !cancelled() && needs.guard.result == 'success'
      && github.repository == 'Knuckles-Team/medulla'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    # Read by .github/actions/folded-wheel, which cannot see the matrix.
    env:
      MEDULLA_WHEEL_TARGET: ${{ matrix.target }}
      MEDULLA_WHEEL_MATURIN_ARGS: ${{ matrix.maturin_args }}
      # Release rustc processes (thin LTO, codegen-units = 1) are memory-heavy:
      # at 4 jobs the 16 GB hosted Linux runners were killed mid-build ("runner
      # has received a shutdown signal"). Every leg caps parallel jobs.
      MEDULLA_WHEEL_JOBS_ARG: ${{ matrix.jobs && format('--jobs {0}', matrix.jobs) || '' }}
      MEDULLA_WHEEL_MANYLINUX: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
    strategy:
      fail-fast: false
      # Every leg runs on its own GitHub-HOSTED runner VM, so the legs share no
      # compiler, disk or memory: serializing them bought nothing and cost the
      # whole matrix. Measured on run 32563780499 (2026-08-22) with the old
      # `max-parallel: 1`: linux-x86_64 ran 11:08->14:01, linux-aarch64 only
      # STARTED at 14:01, and the three remaining legs sat queued from 11:08 --
      # a ~17h projected matrix for ~3h of critical path. Legs run concurrently.
      matrix:
        include:
          # Native ARM runner: the qemu-emulated cross build on an x86 host ran
          # past two hours and lost its runner mid-build.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
            # The two-job server compile was SIGKILLed on the 16 GiB runner.
            # Keep full features/LTO; bound Cargo concurrency to one job.
            jobs: 1
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: ""
            jobs: 4
          # macOS is best-effort: a runner-image or toolchain regression on a
          # platform nothing in this fleet deploys to must not withhold the
          # Linux and Windows wheels, which ARE the supported install targets.
          # `continue-on-error` keeps the leg reported but non-blocking.
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: ""
            jobs: 2
            optional: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust-toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Release binaries must not retain checkout, build-user, Cargo, or toolchain
      # roots. The helper preserves existing flags using Cargo's encoded form and
      # reports counts only (never the concrete prefixes). `--target` is required
      # here (unlike the single-target `gates` job above): this job cross-builds
      # multiple targets, and the C/C++ prefix-map flag is feature-detected
      # per target compiler -- the manylinux aarch64 cross-gcc rejects
      # -ffile-prefix-map (GCC 8+ only) and falls back to -fdebug-prefix-map,
      # written to a CFLAGS_<target> variable scoped to this leg alone so it
      # can never reach a different leg's toolchain.
      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      - name: Select the verified native Mach-O linker
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.channel }}
        run: |
          case "$MEDULLA_WHEEL_TARGET" in
            aarch64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
          esac
          source scripts/configure_macos_linker.sh "$MEDULLA_WHEEL_TARGET"
          python - <<'PYENV'
          import os
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in ("SDKROOT", "MACOSX_DEPLOYMENT_TARGET", "RUSTUP_TOOLCHAIN", "CARGO_ENCODED_RUSTFLAGS"):
                  output.write(f"{key}={os.environ[key]}\n")
          PYENV

      # Each pass builds the medulla-pyengine wheel (engine module + Python package)
      # and the medulla-numeric module, folds the latter in, then normalizes,
      # privacy-audits and checks the result (.github/actions/folded-wheel).
      # The per-platform compile cache is restored here, saved by ci.yml on main. Tag releases publish the primary
      # pass; a manual (workflow_dispatch) run adds a second pass from empty
      # Cargo state at the same neutral path and requires byte-identical wheels.
      - name: Build primary wheel (${{ matrix.name }})
        uses: ./.github/actions/folded-wheel
        with:
          pass: primary
          server-artifact: server-${{ matrix.name }}

      - name: Remove primary native build state
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: >-
          python -c "import os,shutil; from pathlib import Path;
          root=Path(os.environ['RUNNER_TEMP']).resolve();
          target=(root/'medulla-release-target').resolve();
          assert target.parent==root and target.name=='medulla-release-target';
          print('removing' if target.exists() else 'already absent:', target);
          shutil.rmtree(target) if target.exists() else None"

      - name: Build reproduction wheel (${{ matrix.name }})
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/folded-wheel
        with:
          pass: reproduction
          server-artifact: server-${{ matrix.name }}

      # Diagnostic replacement for the former bare inline `python -c` (three
      # `assert`s, no output on failure -- exactly what made the
      # windows-x86_64-only reproducibility failure undiagnosable from the CI
      # log). The three protected assertion messages are UNCHANGED
      # ('release wheel cardinality mismatch' / 'release wheel filename
      # mismatch' / 'release wheel digest mismatch') and the gate still exits
      # non-zero on any mismatch -- this only adds a full member-level
      # CONTENT-vs-CONTAINER-ONLY report on stdout. See
      # scripts/compare_wheel_reproducibility.py.
      - name: Require byte-identical folded wheels
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: python scripts/compare_wheel_reproducibility.py dist-primary dist-reproduction

      - name: Stage sole publish candidate
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/medulla-*.whl dist/

      # Smoke test: install the wheel, run the packaged server's `--version` and
      # require the wheel version, and prove the extension modules
      # `medulla.numeric` (computing) and `medulla.engine` (BUG-PE-002) import
      # from the INSTALLED wheel.
      - name: Smoke test (packaged server --version + import medulla.{numeric,engine})
        shell: bash
        run: bash scripts/release_wheel_smoke.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

      # Publish this platform now: folded-wheel already required a complete wheel
      # and the smoke test above passed. No other platform is awaited.
      - name: Publish ${{ matrix.name }} to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist/*.whl
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # NOTE (CONCEPT:MEDULLA-371): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`medulla_engine-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `build` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # NOTE: the medulla-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `medulla` main wheel in the
  # `build` job above, so a BARE `pip install medulla` (no extra tag)
  # provides `medulla.numeric` from ONE published package (CONCEPT:MEDULLA-346).
  # `medulla[numeric]` still resolves for old pins, but is a no-op alias —
  # it is not what makes the kernel present.

  # The engine container image is built by `server-image` below.

  build-x86:
    name: wheel linux-x86_64
    needs: guard
    if: >-
      github.repository == 'Knuckles-Team/medulla'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: Knuckles-Team/medulla/.github/workflows/medulla-release-x86.yml@3b67ca6c44d7efbed4c834f0dafbac023883da87

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH — gated to a `v*` tag and the required release wheel matrix.
  # `guard` proves ci.yml already passed on this commit; every build waits on it.
  build-sdist:
    name: Build and validate source distribution
    needs: guard
    if: github.repository == 'Knuckles-Team/medulla'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Build source archive without native compilation
        run: |
          python -m pip install 'maturin==1.14.1'
          maturin sdist --out dist-sdist
          python scripts/check_sdist_completeness.py dist-sdist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-distribution
          path: dist-sdist/*.tar.gz
          if-no-files-found: error
      - name: Publish the source distribution to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist-sdist/*.tar.gz
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # The Linux x86_64 wheel is built by the immutable reusable workflow above (it
  # cannot hold the PyPI token), so it is published by this job the moment that
  # workflow finishes. It depends on no other platform.
  publish-x86:
    timeout-minutes: 360
    name: Publish linux-x86_64 wheel to PyPI
    needs: build-x86
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Require a complete wheel before upload
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist/*.whl
      - name: Publish linux-x86_64 to PyPI
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist/*.whl
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # Per-architecture server image from that architecture's medulla wheel (the
  # wheel carries the server executable), pushed by digest.
  server-image:
    name: server image linux-${{ matrix.arch }}
    needs: [guard, build, build-x86]
    if: >-
      github.repository == 'Knuckles-Team/medulla'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest, platform: linux/amd64, wheel: wheel-linux-x86_64}
          - {arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64, wheel: wheel-linux-aarch64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: docker/wheels
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push the image by digest
        id: push
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/medulla-server
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys;print(re.search(r'^medulla-([0-9][^-]*)-', sys.argv[1]).group(1))" "$(basename docker/wheels/medulla-*.whl)")"
          docker buildx build --file docker/Dockerfile --target runtime \
            --platform "$PLATFORM" --build-arg "EGS_VERSION=${version}" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" .
          digest="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/meta.json")"
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${digest}" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  # One tag list for linux/amd64 + linux/arm64 under the medulla-server image name.
  server-manifest:
    name: server image manifest
    needs: server-image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: wheels
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push the multi-architecture manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/medulla-server
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys;print(re.search(r'^medulla-([0-9][^-]*)-', sys.argv[1]).group(1))" "$(basename "$(ls wheels/medulla-*.whl | head -n1)")")"
          docker buildx imagetools create -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/x86_64)" "${IMAGE}@$(cat digests/aarch64)"
          docker buildx imagetools inspect "${IMAGE}:${version}"

  # Verification only: every upload above is independent and already done. This
  # job proves each expected file reached PyPI with the exact built bytes, and
  # fails (without undoing any upload) when a platform is missing.
  verify-pypi:
    timeout-minutes: 360
    name: Verify every distribution reached PyPI
    needs: [build, publish-x86, build-sdist]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distribution
          path: dist
      # The supported install targets: a release missing one fails loudly.
      - name: Require the Linux and Windows wheels
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64; do
            ls dist/*"$tag"*.whl >/dev/null 2>&1 || missing+=("$tag")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "MISSING: no wheel for ${missing[*]}" >&2
            ls -1 dist/ >&2
            exit 1
          fi
          echo "required wheels present:"; ls -1 dist/*.whl
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Checkout immutable publication contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          path: .pipeline-contract
          persist-credentials: false
      - name: Record the publication contract commit
        run: echo "PIPELINES_CONTRACT_COMMIT=$(git -C .pipeline-contract rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Freeze exact staged publication identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py preflight \
            --directory dist --package medulla --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"
      - name: Verify every published filename and digest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py postverify \
            --directory dist --package medulla --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"
  # The GitHub release for the tag, created only after every distribution is
  # verified on PyPI, so the release always links to packages that exist.
  github-release:
    timeout-minutes: 5
    name: GitHub release with PyPI links
    needs: [verify-pypi, method-codec]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## PyPI"
            echo
            echo "| Package | PyPI |"
            echo "|---|---|"
            echo "| \`medulla\` $version | https://pypi.org/project/medulla/$version/ |"
            echo
            echo "The platform wheels carry the \`medulla-server\` executable."
            echo
            echo '```bash'
            echo "pip install \"medulla==$version\""
            echo '```'
            echo
            echo "Commit: $SHA"
          } > "$notes"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --title "Release $TAG" --notes-file "$notes" --latest
          else
            gh release create "$TAG" -R "$REPO" --verify-tag --title "Release $TAG" --notes-file "$notes" --latest
          fi
