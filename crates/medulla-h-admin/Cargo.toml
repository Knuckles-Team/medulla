medulla-persistence = { path = "../medulla-persistence", features = ["test-support"] }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-virtual-graph = { path = "../medulla-virtual-graph", features = ["rdf"] }
medulla-query-types = { path = "../medulla-query-types", features = ["test-support"] }
medulla-source-types = { path = "../medulla-source-types", features = ["test-support"] }
medulla-work-types = { path = "../medulla-work-types", features = ["test-support"] }
medulla-result-types = { path = "../medulla-result-types" }
medulla-h-sparql = { path = "../medulla-h-sparql" }
medulla-persistence-records = { path = "../medulla-persistence-records", features = ["test-support"] }
medulla-server-ops = { path = "../medulla-server-ops", features = ["test-support"] }
medulla-server-blob = { path = "../medulla-server-blob", features = ["test-support"] }
medulla-exec = { path = "../medulla-exec", features = ["test-support"] }
medulla-h-ingest = { path = "../medulla-h-ingest", features = ["blob", "test-support"] }
medulla-h-ingest-repository = { path = "../medulla-h-ingest-repository", features = ["blob", "test-support"] }
medulla-federation = { path = "../medulla-federation", features = ["test-support"] }
medulla-server = { path = "../medulla-server", features = ["blob", "compute-dist", "cost-opt", "epistemic", "federation", "federation-sql", "full", "geo", "geosparql", "gpu", "gpu-cuda", "jobs", "json-ld", "knowledge-batch", "kv", "matview", "nl-query", "numeric", "owl", "owl-dl", "owl-plan", "par-runtime", "promql", "query", "raft", "rdf", "rdf-xml", "redb", "security", "server", "server-tls", "shacl", "sparql", "sparql-hash", "sparql-star", "stream", "streaming", "tensor", "test-support", "text", "traces", "tsdb", "wasm-udf"] }
