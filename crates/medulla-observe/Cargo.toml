[package]
name = "medulla-observe"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Runtime observability: the task registry, the explicit task state machine, the spawn helper and the progress guard."
license = "MIT"
publish = false

[lib]
name = "medulla_observe"
path = "src/lib.rs"

[features]
# The signal-based stack sampler of `Method::Profile` (MEDULLA-OBSERVE-R010.1). It is built on a
# Linux target with glibc; on any other target `Profile` answers `PROFILE_UNAVAILABLE`.
default = ["profiler"]
profiler = ["dep:libc", "dep:medulla-version"]
# The fault injection of the chaos proof (MEDULLA-OBSERVE-R012); off in every release build.
chaos = []

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = { version = "0.2", optional = true }
medulla-types = { path = "../medulla-types" }
medulla-version = { path = "../medulla-version", optional = true }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }

[[bench]]
name = "registry"
path = "benches/registry.rs"
harness = false
