[package]
name = "medulla-server-ops"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served API handler seams: the admin, decide, ingest, graph, jobs, compute, query, transaction and wire seam traits, their typed accessors and their support modules"
license = "MIT"
publish = false

[lib]
name = "medulla_server_ops"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
medulla-server-api = { path = "../medulla-server-api" }
dashmap = "6.2"
hex = "0.4"
medulla-core = { path = "../medulla-core" }
medulla-graphql = { path = "../medulla-graphql", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.28", features = ["v4"] }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-ann-codes = { path = "../medulla-ann-codes" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-cypher = { path = "../medulla-cypher" }
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }

medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-wasm = { path = "../medulla-wasm", optional = true }
redb = { workspace = true, optional = true }
ureq = { version = "3.4.2", optional = true }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-auth = { path = "../medulla-server-auth" }

[features]
ann-redb = ["redb", "medulla-server-api/ann-redb"]
compute-dist = ["medulla-server-api/compute-dist"]
decide = ["jobs", "redb", "shacl", "dep:medulla-numeric", "dep:medulla-capabilities", "medulla-server-api/decide"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-mutation/epistemic"]
federation = ["query", "dep:medulla-plan", "medulla-server-api/federation", "medulla-server-auth/federation"]
federation-search = ["federation", "dep:ureq", "medulla-server-api/federation-search"]
federation-sql = ["federation", "dep:medulla-plan", "medulla-server-api/federation-sql"]
graphql = ["security", "dep:medulla-graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-server-mutation/graphql"]
jobs = ["mining", "epistemic", "dep:medulla-jobs", "dep:medulla-capabilities", "medulla-server-api/jobs", "medulla-server-mutation/jobs"]
knowledge-batch = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-server-api/knowledge-batch"]
matview = ["query", "result-cache", "streaming", "medulla-server-api/matview"]
mining = ["medulla-server-api/mining", "medulla-server-auth/mining", "medulla-server-mutation/mining"]
modality-serving = ["redb", "security", "streaming", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-mutation/modality-serving"]
owl = ["sparql", "dep:medulla-rdf", "medulla-server-api/owl"]
query = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-mutation/query"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-server-api/redb", "medulla-server-mutation/redb", "medulla-server-blob/redb"]
result-cache = ["medulla-server-api/result-cache"]
security = ["redb", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security"]
shacl = ["dep:medulla-shacl", "medulla-server-api/shacl", "medulla-server-mutation/shacl", "medulla-server-blob/shacl"]
sparql = ["dep:medulla-rdf", "medulla-server-api/sparql"]
stream = ["query", "dep:medulla-stream", "dep:medulla-plan", "medulla-server-api/stream"]
streaming = ["medulla-server-api/streaming", "medulla-server-mutation/streaming"]
test-support = ["medulla-server-api/test-support", "medulla-server-auth/test-support", "medulla-server-mutation/test-support", "medulla-server-blob/test-support"]
text = ["query", "dep:medulla-plan", "medulla-server-api/text"]
tsdb = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/tsdb"]
wasm-udf = ["dep:medulla-wasm", "dep:medulla-plan", "medulla-server-api/wasm-udf", "medulla-server-auth/wasm-udf"]

[dev-dependencies]
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
tempfile = "3"
