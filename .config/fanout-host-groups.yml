# MEDULLA-CONTRACT-R011.1: land-gate fan-out host-group manifest.
#
# Validated by `cargo xtask fanout-host-groups` before any fan-out work is
# dispatched. Each group names a persistent warm target and a headroom
# reservation fraction (0, 1) on its gate host(s); no host may appear in more
# than one group. This repository's gate currently runs on a single build
# host, declared here as one group so the manifest already satisfies
# the fan-out shape; adding a second independent host group widens the fan
# out without changing this validator.
groups:
  - name: primary
    warm_target: medulla-primary-warm
    headroom_reservation: 0.1
    hosts:
      - primary
