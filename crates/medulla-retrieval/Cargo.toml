[package]
name = "medulla-retrieval"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Retrieval and expansion: knowledge assembly, LeanRAG, verdicts and stop rules"
license = "MIT"
publish = false

[lib]
name = "medulla_retrieval"
path = "src/lib.rs"

[dependencies]
medulla-exec = { path = "../medulla-exec" }
medulla-types = { path = "../medulla-types", features = ["query", "geo"] }
medulla-core = { path = "../medulla-core" }
medulla-modality = { path = "../medulla-modality" }
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rmp-serde = "1.3"
arrow = { version = "58.4", optional = true }
medulla-result-types = { path = "../medulla-result-types", features = ["query"] }
medulla-ann = { path = "../medulla-ann", optional = true }

[features]
epistemic = ["query", "dep:medulla-epistemic", "medulla-exec/epistemic"]
knowledge-batch = ["query", "dep:arrow"]
query = ["medulla-exec/query"]
decide = ["dep:medulla-ann", "medulla-ann?/drift"]
ann = ["dep:medulla-ann"]
