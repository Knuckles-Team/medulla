alignment = ["dep:medulla-modality", "medulla-raft/alignment", "medulla-server-api/alignment"]
numeric = ["dep:medulla-plan", "medulla-plan?/numeric", "medulla-kernel/numeric", "medulla-persistence/numeric", "medulla-raft/numeric", "medulla-server-api/numeric"]
