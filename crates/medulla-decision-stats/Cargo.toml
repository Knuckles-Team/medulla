[package]
name = "medulla-decision-stats"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Statistical ranking for the decision ladder: fitted heads, calibration, conformal bounds, off-policy evaluation and scores"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_stats"
path = "src/lib.rs"

[dependencies]
medulla-numeric = { path = "../medulla-numeric" }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
medulla-types = { path = "../medulla-types", optional = true }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-agent-types = { path = "../medulla-agent-types" }
serde_json = "1.0"
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }

[features]
decision = ["dep:medulla-types", "medulla-numeric/decision"]
