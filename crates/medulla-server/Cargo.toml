medulla-work-types = { path = "../medulla-work-types" }
medulla-store-apply = { path = "../medulla-store-apply" }
medulla-work-store = { path = "../medulla-work-store" }
medulla-lane-store = { path = "../medulla-lane-store" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-persistence-ops = { path = "../medulla-persistence-ops" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-federation = { path = "../medulla-federation" }
medulla-nlq = { path = "../medulla-nlq" }
medulla-uql = { path = "../medulla-uql" }
medulla-sql-lang = { path = "../medulla-sql-lang" }
medulla-wire-core = { path = "../medulla-wire-core" }
medulla-h-mining = { path = "../medulla-h-mining" }
medulla-h-sparql = { path = "../medulla-h-sparql" }
medulla-h-retrieve = { path = "../medulla-h-retrieve" }
medulla-server-obs = { path = "../medulla-server-obs" }
medulla-server-lake = { path = "../medulla-server-lake" }
medulla-server-graph = { path = "../medulla-server-graph" }
medulla-server-consensus = { path = "../medulla-server-consensus" }
medulla-server-identity = { path = "../medulla-server-identity" }
medulla-server-router = { path = "../medulla-server-router" }

[features]
test-support = []
amqp-wire = ["medulla-server-router/amqp-wire", "medulla-server-lake/amqp-wire", "server"]
