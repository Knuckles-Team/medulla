graphlearn = ["medulla-compute-assemble/graphlearn", "medulla-graph-algos/graphlearn", "medulla-kernel/graphlearn", "medulla-protocol-types/graphlearn", "medulla-result-types/graphlearn", "medulla-server-api/graphlearn", "medulla-server-mutation/graphlearn", "medulla-types/graphlearn", "medulla-query-types/graphlearn"]
graphql = ["security", "medulla-kernel/graphql", "medulla-protocol-types/graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-server-mutation/graphql", "medulla-server-ops/graphql", "medulla-types/graphql", "server"]
mining = ["query", "tsdb", "medulla-compute-assemble/mining", "medulla-kernel/mining", "medulla-mining/mining", "medulla-protocol-types/mining", "medulla-result-types/mining", "medulla-server-api/mining", "medulla-server-auth/mining", "medulla-server-cdc/mining", "medulla-server-mutation/mining", "medulla-server-ops/mining", "medulla-types/mining", "medulla-query-types/mining"]
ml-pipeline = ["mining", "graphlearn", "medulla-kernel/ml-pipeline", "medulla-protocol-types/ml-pipeline", "medulla-result-types/ml-pipeline", "medulla-server-api/ml-pipeline", "medulla-server-mutation/ml-pipeline", "medulla-types/ml-pipeline", "medulla-query-types/ml-pipeline"]
numeric = ["dep:medulla-numeric", "medulla-kernel/numeric", "medulla-server-api/numeric"]
owl = ["dep:medulla-rdf", "medulla-rdf/owl", "medulla-reasoner/owl", "sparql", "medulla-protocol-types/owl", "medulla-server-api/owl", "medulla-server-cdc/owl", "medulla-server-ops/owl", "medulla-types/owl", "medulla-query-types/owl", "server"]
