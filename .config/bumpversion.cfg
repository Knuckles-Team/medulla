[bumpversion]
current_version = 3.3.2
commit = True
tag = True
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<release>dev))?
serialize =
	{major}.{minor}.{patch}-{release}
	{major}.{minor}.{patch}

[bumpversion:part:release]
optional_value = final
values =
	dev
	final

[bumpversion:file:Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:Cargo.lock]
search = name = "medulla-engine"
	version = "{current_version}"
replace = name = "medulla-engine"
	version = "{new_version}"

[bumpversion:file(medulla-pyengine):Cargo.lock]
search = name = "medulla-pyengine"
	version = "{current_version}"
replace = name = "medulla-pyengine"
	version = "{new_version}"

[bumpversion:file:crates/medulla-pyengine/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(medulla-version):Cargo.lock]
search = name = "medulla-version"
	version = "{current_version}"
replace = name = "medulla-version"
	version = "{new_version}"

[bumpversion:file:crates/medulla-version/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = version-{current_version}-blue
replace = version-{new_version}-blue

[bumpversion:file:docker/Dockerfile]
search = ARG EGS_VERSION={current_version}
replace = ARG EGS_VERSION={new_version}
