name: Nightly finance budgets

# MEDULLA-FINANCE-PRIMITIVES-R900.6: run the finance kernel benchmark group `finance/shift_100k`
# (`crates/medulla-h-compute/benches/finance_kernels.rs`) at 03:00 UTC on main, check its
# report against the stored baseline with `cargo xtask decide-budgets`
# (`benches/baselines/finance.json`), upload the report, and fail on a regression or a budget breach.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  finance-budgets:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 180
    # A full medulla build exhausts a hosted runner (shutdown signal mid-compile); use the warm build runners.
    runs-on:
      group: medulla-warm
      labels: [self-hosted, medulla-warm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/setup-python downloads a prebuilt CPython that requires AVX2,
      # which the self-hosted runners lack; uv manages its own Python builds.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          python-version: '3.14'
          activate-environment: true

      - id: rust-toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Run the finance budget benchmark
        env:
          FINANCE_BUDGETS_REPORT: ${{ github.workspace }}/target/finance-budgets.json
        run: cargo bench -p medulla-h-compute --features finance --bench finance_kernels -- finance/shift_100k

      - name: Check the report against the baseline
        run: cargo --locked xtask decide-budgets target/finance-budgets.json --baseline benches/baselines/finance.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finance-budgets
          path: |
            target/finance-budgets.json
            target/criterion
          if-no-files-found: warn
