[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "medulla"
# Version is DYNAMIC — sourced from Cargo.toml `[package].version` by maturin so the
# built wheel/sdist ALWAYS matches the release tag (which bumps Cargo.toml). A static
# value here silently WON over Cargo.toml and shipped mis-versioned dists: e.g. a
# v2.6.0 tag built `medulla-2.2.0` (already on PyPI) which `twine
# --skip-existing` swallowed as a no-op — a green publish that published nothing.
dynamic = ["version"]
description = "Rust-native durable multimodal and epistemic database with governed analytics and program optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.2.3",
    # RF-RULING-003: `medulla/generated/*` (imported at module scope by
    # `client.py`, which `__init__.py` imports) declares its request models with
    # pydantic v2. It is a HARD runtime dependency of the wheel, not an extra --
    # `import medulla` fails without it. v2 is what meristem already
    # standardises on, so a consumer resolves one model layer, not two.
    "pydantic>=2.14.1,<3",
    # numeric is a NATIVE core primitive, NOT an extra (CONCEPT:MEDULLA-346): the compiled
    # pure-Rust faer/ndarray kernel ships as always-bundled package data
    # (`medulla/numeric.abi3.so`). It has no Python package dependency; the
    # wheel gate and release smoke test prove the bundled native module is callable
    # without resolving an interpreter-side numeric implementation.
    # FULL-BY-DEFAULT (CONCEPT:MEDULLA-346, 2026-07-25): the UNIFIED binary is the default install
    # — `pip install medulla` (NO extra tag) ships the complete engine. OWL/SPARQL
    # (pyoxigraph) and the LMCache HTTP driver (httpx) join numeric in the base so `[full]` is
    # no longer needed to get the whole engine. A slimmer serving consumer still chooses what
    # to import; nothing here forces a heavy ML/torch/native-AVX wheel onto the base.
    "pyoxigraph>=0.5.11",
    "httpx>=0.28.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    # BUG-045: tests/test_build_backend.py execs build_backend.py directly (outside
    # PEP 517 build isolation), which `import maturin`s at module scope -- the
    # `[build-system].requires` pin above only guarantees maturin during an
    # isolated build, not a normal `pytest` run. tests/test_release_full_wheel_
    # contract.py separately `import yaml`s. Neither was reachable from the `test`
    # extra, so a plain `pip install -e .[test]` / `uv sync --extra test` failed
    # collection on both files with ModuleNotFoundError before a single test ran.
    "maturin>=1.15.0,<2.0",
    "pyyaml>=6.0.3",
]
owl = [
    "pyoxigraph>=0.5.11",
]
finance = []
quant = []
ast = []
datascience = []
reasoning = []
# `full` is now a NO-OP ALIAS (2026-07-25): the unified binary is full-by-DEFAULT, so its
# Python deps (pyoxigraph for owl and httpx for lmcache) live in the base
# `dependencies`. `pip install medulla` (no tag) is now the complete engine;
# `[full]` is retained only so existing installs/refs keep resolving.
full = []
# CONCEPT:MEDULLA-337 — the Python LMCache/vLLM remote-backend driver for the MEDULLA-187
# KV-cache endpoint (`medulla.kvcache`). The driver itself imports with
# STDLIB ONLY (urllib), so this extra only pulls the optional httpx acceleration
# (pooled keep-alive on the inference hot path). `pip install medulla[lmcache]`.
lmcache = [
    "httpx>=0.28.1",
]
# CONCEPT:MEDULLA-346 — numeric is NATIVE; this extra is retained as a NO-OP alias so existing
# `medulla[numeric]`/`[full]` installs and the `all` aggregate keep resolving. The
# compiled faer/ndarray kernel remains always-bundled as package data
# `medulla/numeric.abi3.so` (pure-Rust, BLAS/LAPACK-free) and does not add a
# Python numeric dependency.
numeric = []
# W4.8 (CONCEPT:MEDULLA-317) — TEST-ONLY reference-implementation readers for the lake/
# lake-rest read-parity suite (`tests/test_lake_iceberg_delta_parity.py`): real
# pyiceberg/deltalake open the engine's own materialized Delta + Iceberg artifacts and
# assert they read back correctly. Not a runtime dependency of the engine or the
# Python client. The project extra remains a compatibility marker, while the
# reference readers live in `tests/lake-parity-requirements.txt` and are installed
# only in an isolated validation environment: uv resolves every workspace member's
# extras together, and PyIceberg's Rich ceiling conflicts with the production Rich
# floor even when no workspace package requests this extra. Use
# `python tests/run_lake_parity.py` for the strict, exact-artifact gate; keeping
# this extra empty prevents the workspace resolver from reintroducing that
# conflict into production/test environments.
lake-parity = []
# The bare install already provides every runtime capability.  Keep `all` as a
# compatibility alias rather than quietly adding test frameworks or the external
# lake reference readers to production environments. `test` and `lake-parity`
# remain explicit validation extras; lake parity is installed in its documented
# isolated environment because PyIceberg's current `rich<15` ceiling conflicts
# with the workspace's Rich 15 production floor.
all = []

# Expose the engine's operator skills to the same provider federation used by
# meristem and every agents/* package.  This is metadata only: consumers
# discover the entry point when meristem is installed, without imposing it
# as an medulla runtime dependency.
[project.entry-points."scion_sdk.skill_providers"]
medulla = "medulla.skills"

# GOC-33 (`OWNER-VOICE-ASR`): registers this package's native whisper-rs-backed
# ASR provider (`medulla/asr_provider.py`) under the pluggable
# transcription-backend seam `agent-packages/agents/audio-transcriber` owns
# (`audio_transcriber/asr_providers.py`'s `TranscriptionProvider` Protocol).
# Discovery is by entry point ONLY, guarded try/except on the consumer side —
# this package never imports `audio_transcriber`, so listing this metadata
# imposes no runtime dependency here.
[project.entry-points."audio_transcriber.asr_providers"]
medulla = "medulla.asr_provider:build_provider"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Lets a test import a scripts/*.py module by its bare name (e.g. `import
# rust_lexer`) the same way a hook's direct `python3 scripts/foo.py`
# invocation already can (Python auto-adds a script's own directory to
# sys.path[0]). Removes the need for a per-test `sys.path.insert` + `# noqa:
# E402` pair just to reach a sibling script module — see AGENTS.md /
# CHECKPOINT F11 for the fuller rationale.
pythonpath = ["scripts", "tests/release_campaigns"]
addopts = ["-v", "--tb=short"]
markers = [
    "concept(id): tag a test with the ecosystem CONCEPT id it covers",
    "exact_artifact: opt-in exact-binary process-fault/restart certification",
    "nightly: budget benchmark run by the nightly job, never by a PR",
    "no_engine: static test that must not build or start the shared native engine",
    "release_campaign: exact-artifact release campaign (opt in with MEDULLA_EXACT_CERTIFICATION=1; run as pytest -m release_campaign -k <name>)",
    "spec(id): binds a test to a spec requirement ID",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "RUF100" ]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.vulture]
exclude = [".venv", "venv", "build", "dist", "target"]
min_confidence = 95

# BUG-CX-136 — one reviewed contract for the repository-local quality
# sensors.  The hooks resolve already-installed binaries only; they never
# invoke a package manager.  Keeping the versions here makes a tool upgrade a
# deliberate change to the same file as the thresholds and format universe.
[tool.medulla.scanners]
cccc_version = "1.6.0"
kiss_version = "0.4.12"
dupehound_version = "0.1.2"
dupehound_threshold = 0.85
dupehound_min_tokens = 40
jscpd_version = "5.0.16"
jscpd_min_tokens = 50
jscpd_min_lines = 5
jscpd_mode = "mild"
dependency_cruiser_version = "18.2.0"
import_linter_version = "2.13"
arch_lint_version = "0.5.0"
cargo_deny_version = "0.20.2"

# jscpd is intentionally the wide-net sensor.  It sees Rust/Python/JS/TS
# blocks as well as the config/template formats dupehound cannot parse.
jscpd_formats = { rust = ["rs"], python = ["py", "pyi"], javascript = ["js", "cjs", "mjs"], typescript = ["ts", "tsx", "cts", "mts"], bash = ["sh", "bash"], css = ["css"], html = ["html", "htm"], json = ["json"], yaml = ["yaml", "yml"], toml = ["toml"], sql = ["sql"], markdown = ["md"] }
jscpd_filenames = { docker = ["Dockerfile", "Containerfile"], makefile = ["Makefile", "GNUmakefile"] }
# Exclusions are junk, vendored code, and GENERATED OUTPUT. A generated file is
# not duplication debt: it has no author to refactor and no second copy to
# delete -- its repetition is a property of the generator's template.
jscpd_exclusions = [
    "**/.git/**",
    "**/.venv/**",
    "**/venv/**",
    "**/node_modules/**",
    "**/target/**",
    "**/target-*/**",
    "**/build/**",
    "**/dist/**",
    "**/.cache/**",
    "**/cache/**",
    "**/.import_linter_cache/**",
    "**/generated/**",
    "**/vendor/**",
    "**/third_party/**",
    "**/fixtures/**",
    "**/fixture/**",
    "**/__snapshots__/**",
    "**/__pycache__/**",
    "**/*.lock",
    "**/Cargo.lock",
    "**/package-lock.json",
]

[tool.maturin]
python-source = "."
# The wheel base is the in-process engine binding `medulla.engine`, built from the
# `medulla-pyengine` crate with the pure-Python package (MEDULLA-CONTRACT-R053.8);
# `build_backend.py` and the release `folded-wheel` action fold `medulla.numeric`
# in. The release `folded-wheel` action also builds the `medulla-server` executable
# for the same platform and folds it in as `medulla/_bin/medulla-server`
# (MEDULLA-CONTRACT-R053.9). The sdist builds the extension modules only.
manifest-path = "crates/medulla-pyengine/Cargo.toml"
module-name = "medulla.engine"
strip = true
# Never carry interpreter caches from a reused checkout into a wheel or sdist.
# These are source-level Maturin globs, so the checkout itself remains untouched.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
include = [
    # Maturin omits workspace members outside the root dependency graph.
    { path = "crates/**/*", format = "sdist" },
    # The sdist must stay installable: pyproject points `backend-path` at the
    # in-tree PEP 517 backend and the helper it imports (scripts/inject_numeric_kernel.py).
    { path = "build_backend.py", format = "sdist" },
    { path = "scripts/configure_rust_path_remap.py", format = "sdist" },
    { path = "scripts/inject_numeric_kernel.py", format = "sdist" },
    { path = "scripts/inject_ontology.py", format = "sdist" },
    { path = "scripts/normalize_wheel_build_paths.py", format = "sdist" },
    { path = "scripts/normalize_wheel_sbom.py", format = "sdist" },
    { path = "scripts/strip_wheel_executables.py", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    # PKG-INFO declares `License-File: LICENSE` (Metadata 2.4) and PyPI rejects an
    # sdist whose declared license file is absent (HTTP 400, the 2.27.1/2.27.2 sdists).
    { path = "LICENSE", format = "sdist" },
]
# The engine binding's feature set (`security` = engine-level row-level security). The
# server executable is built separately with `full,ast-extended`.
features = ["python", "security"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/medulla"
distribution = "medulla"
pages_url = "https://knuckles-team.github.io/medulla/"
mcp_server = false

[tool.pipelines_hooks.rustfmt_scope]
guard_files = [".mergequeue.yaml", ".config/pre-commit.yaml"]

# Crate stability layers (MEDULLA-SDLC-R021.1), most stable first. Every workspace crate sits in exactly
# one entry and depends only on crates of its own or an earlier entry; dev-dependencies are not layered.
# Read by `layer_findings` in scripts/check_crate_graph.py until the shared `coupling` gate
# (PIPE-GATES-R088.2) reads this table directly. There is no allowance list.

# Wire and value types. The engine contract, the domain type slices, the capability ledger and the method codec. No logic that touches a store.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "contract"
units = [
  "medulla-agent-types",
  "medulla-capabilities",
  "medulla-catalog-types",
  "medulla-decision-outcome-types",
  "medulla-decision-types",
  "medulla-identity-types",
  "medulla-index-types",
  "medulla-method-codec",
  "medulla-mutation-types",
  "medulla-protocol-types",
  "medulla-query-types",
  "medulla-result-types",
  "medulla-source-types",
  "medulla-types",
  "medulla-version",
  "medulla-vocab",
  "medulla-work-types",
]

# Pure domain logic and modality kernels over contract types: numeric, vector, text, geo, media, decision, quantum and visualization kernels. No storage.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "kernels"
units = [
  "medulla-alignment",
  "medulla-ann",
  "medulla-asr-whisper",
  "medulla-audio",
  "medulla-catalog",
  "medulla-competency",
  "medulla-competency-xsrc",
  "medulla-decision-eval",
  "medulla-decision-memory",
  "medulla-decision-plan",
  "medulla-decision-policy",
  "medulla-decision-rank",
  "medulla-decision-records",
  "medulla-decision-stats",
  "medulla-document",
  "medulla-enrich",
  "medulla-finance",
  "medulla-finance-market",
  "medulla-geo",
  "medulla-image",
  "medulla-ingest",
  "medulla-lake",
  "medulla-modality",
  "medulla-numeric",
  "medulla-packs",
  "medulla-parity",
  "medulla-placement",
  "medulla-program",
  "medulla-quantum-core",
  "medulla-quantum-gates",
  "medulla-quantum-hardware",
  "medulla-quantum-sim",
  "medulla-repo-index",
  "medulla-resource",
  "medulla-sdlc",
  "medulla-semantic-index",
  "medulla-sqlite-format",
  "medulla-stream",
  "medulla-text",
  "medulla-tts-piper",
  "medulla-video",
  "medulla-viz-columnstore",
  "medulla-viz-core",
  "medulla-viz-export",
  "medulla-viz-graph-tiles",
  "medulla-viz-kernels",
  "medulla-wasm",
]

# Durable primitives: the key-value store, transactions, caches and tables.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "storage"
units = [
  "medulla-ann-codes",
  "medulla-direct-state",
  "medulla-durable",
  "medulla-kvcache",
  "medulla-query-cache",
  "medulla-statechart",
  "medulla-storage",
  "medulla-storage-owner",
  "medulla-tables",
  "medulla-transaction",
]

# The graph data model over storage, its isolation layer and the core engine facade.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "graph-core"
units = [
  "medulla-core",
  "medulla-graph-core",
  "medulla-isolation",
]

# Engine and query: compute, reasoning, the SQL, Cypher, UQL and GraphQL front ends, the planner and executor, and the stores built on the graph core.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "engine"
units = [
  "medulla-compute",
  "medulla-cypher",
  "medulla-epistemic",
  "medulla-exec",
  "medulla-federation",
  "medulla-finance-quant",
  "medulla-graph-algos",
  "medulla-graphql",
  "medulla-jobs",
  "medulla-kernel",
  "medulla-lane-store",
  "medulla-mining",
  "medulla-nlq",
  "medulla-plan",
  "medulla-quantum-jobs",
  "medulla-quantum-workloads",
  "medulla-rdf",
  "medulla-reasoner",
  "medulla-resource-store",
  "medulla-retrieval",
  "medulla-shacl",
  "medulla-shex",
  "medulla-sql",
  "medulla-sql-lang",
  "medulla-sql-udfs",
  "medulla-store",
  "medulla-store-apply",
  "medulla-table-store",
  "medulla-tensor",
  "medulla-tsdb",
  "medulla-uql",
  "medulla-virtual-graph",
  "medulla-work-store",
]

# Server API and the services under the handlers: authentication, persistence, change capture, mutation, operations, blob, lake and consensus.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "service"
units = [
  "medulla-persistence",
  "medulla-persistence-ops",
  "medulla-persistence-records",
  "medulla-raft",
  "medulla-raft-xshard",
  "medulla-server-api",
  "medulla-server-auth",
  "medulla-server-blob",
  "medulla-server-cdc",
  "medulla-server-lake",
  "medulla-server-mutation",
  "medulla-server-obs",
  "medulla-server-ops",
]

# Request handlers (one crate per method family) and the wire listeners.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "handlers"
units = [
  "medulla-h-admin",
  "medulla-h-compute",
  "medulla-h-decide",
  "medulla-h-graph",
  "medulla-h-ingest",
  "medulla-h-jobs",
  "medulla-h-mining",
  "medulla-h-packs",
  "medulla-h-query",
  "medulla-h-retrieve",
  "medulla-h-sparql",
  "medulla-h-txn",
  "medulla-wire",
  "medulla-wire-core",
  "medulla-wire-msg",
]

# Server composition: the router, the graph, identity and consensus dispatch, and the server crate.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "server"
units = [
  "medulla-server",
  "medulla-server-consensus",
  "medulla-server-graph",
  "medulla-server-identity",
  "medulla-server-router",
]

# Outer adapters: the facade package, the Python engine, the cross-crate test harnesses and the repository tooling (`cargo xtask`), which no crate depends on.
[[tool.pipelines_hooks.coupling.cargo_layers]]
name = "adapters"
units = [
  "medulla-engine",
  "medulla-persistence-tests",
  "medulla-pyengine",
  "medulla-server-cluster-tests",
  "medulla-server-served-tests",
  "medulla-server-store-tests",
  "medulla-sql-tests",
  "medulla-store-apply-tests",
  "medulla-test-ambient-auth",
  "medulla-xtask",
]

[tool.pipelines_hooks.cargo_advisories]
# Equals [tool.medulla.scanners] cargo_deny_version; tests/test_scanner_distribution.py pins the pair.
cargo_deny_version = "0.20.2"

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["vendor/*"]

# Constitution Article XXXI: every lifecycle/status type under these paths is an explicit state machine with a
# closed transition table and tests for each legal and illegal transition (shared state-machine-shape hook).
[tool.pipelines_hooks.state_machine]
paths = ["crates", "medulla", "tools"]
languages = ["rust", "python"]
mode = "blocking"
