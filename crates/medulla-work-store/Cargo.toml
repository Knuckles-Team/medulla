[package]
name = "medulla-work-store"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Durable work items and their capability records"
license = "MIT"
publish = false

[lib]
name = "medulla_work_store"
path = "src/lib.rs"

[dependencies]
medulla-store = { path = "../medulla-store", features = ["redb"] }
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
hex = "0.4"
medulla-kernel = { path = "../medulla-kernel" }
medulla-storage = { path = "../medulla-storage" }
medulla-transaction = { path = "../medulla-transaction" }
medulla-types = { path = "../medulla-types" }
rand = "0.8"
redb = { workspace = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_bytes = "0.11.19"
sha2 = "0.10"
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-lane-store = { path = "../medulla-lane-store" }

medulla-statechart = { path = "../medulla-statechart", optional = true }

tempfile = { version = "3", optional = true }

[features]
security = ["medulla-store/security", "medulla-lane-store/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-types/security"]
statechart = ["dep:medulla-statechart", "medulla-store/statechart", "medulla-protocol-types/statechart", "medulla-types/statechart"]
test-support = ["dep:tempfile", "medulla-store/test-support", "medulla-protocol-types/test-support", "medulla-decision-types/test-support", "medulla-kernel/test-support", "medulla-types/test-support", "medulla-work-types/test-support", "medulla-decision-outcome-types/test-support"]
[dev-dependencies]
tempfile = "3"
