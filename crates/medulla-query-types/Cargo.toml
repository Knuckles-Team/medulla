[package]
name = "medulla-query-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Query plan AST and wire DTO types"
license = "MIT"
publish = false

[lib]
name = "medulla_query_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }

[features]
# The wire-family gates moved here with their modules (MEDULLA-SDLC-R021.3); every
# crate that forwarded `medulla-types/<gate>` forwards `medulla-query-types/<gate>` too.
test-support = ["medulla-types/test-support"]
datascience = []
mining = []
graphlearn = ["datascience"]
ml-pipeline = ["graphlearn", "datascience", "mining"]
query = []
epistemic = ["query"]
text = ["query"]
owl = []
owl-plan = ["owl", "query"]
wasm-udf = []
streaming = []
federation = ["query"]
geo = ["query"]
tensor = ["query"]
stream = ["query"]
timeseries = ["query"]
probabilistic = ["query"]
asr-native = []
quantum = []
viz = []
wire-contract = [
    "datascience", "mining", "graphlearn", "ml-pipeline", "epistemic", "query", "text",
    "streaming", "owl", "owl-plan", "wasm-udf", "federation", "geo", "tensor", "stream",
    "medulla-types/wire-contract",
]
wire-complete = ["wire-contract", "timeseries", "probabilistic", "quantum", "asr-native", "viz", "medulla-types/jobs", "medulla-types/statechart", "medulla-types/program-optimization", "medulla-types/knowledge-batch", "medulla-types/modality-serving"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
