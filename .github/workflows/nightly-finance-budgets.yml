name: Nightly finance budgets

# MEDULLA-FINANCE-PRIMITIVES-R900.6: run the finance kernel benchmark group `finance/shift_100k`
# (`crates/medulla-h-compute/benches/finance_kernels.rs`) at 03:00 UTC on main, check its
# report against the stored baseline with `scripts/check_decide_budgets.py`
# (`benches/baselines/finance.json`), upload the report, and fail on a regression or a budget breach.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  finance-budgets:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - id: rust-toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Run the finance budget benchmark
        env:
          FINANCE_BUDGETS_REPORT: ${{ github.workspace }}/target/finance-budgets.json
        run: cargo bench -p medulla-h-compute --features finance --bench finance_kernels -- finance/shift_100k

      - name: Check the report against the baseline
        run: python scripts/check_decide_budgets.py target/finance-budgets.json --baseline benches/baselines/finance.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finance-budgets
          path: |
            target/finance-budgets.json
            target/criterion
          if-no-files-found: warn
