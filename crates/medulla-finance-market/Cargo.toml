[package]
name = "medulla-finance-market"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Market data primitives: quotes, bars, books and their kernels"
license = "MIT"
publish = false

[lib]
name = "medulla_finance_market"
path = "src/lib.rs"

[dependencies]
medulla-numeric = { path = "../medulla-numeric" }
medulla-stream = { path = "../medulla-stream" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
medulla-result-types = { path = "../medulla-result-types", features = ["finance"] }
medulla-decision-stats = { path = "../medulla-decision-stats" }
