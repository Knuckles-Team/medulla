[package]
name = "medulla-wire-msg"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Messaging and object listeners: AMQP, MQTT, STOMP, Redis, DDS, S3 and the KV cache endpoint"
license = "MIT"
publish = false

[lib]
name = "medulla_wire_msg"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
hex = "0.4"
hmac = "0.12"
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-kvcache = { path = "../medulla-kvcache", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
medulla-wire-core = { path = "../medulla-wire-core" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
sha1 = { version = "0.10", optional = true }
medulla-capabilities = { path = "../medulla-capabilities" }

tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "handshake"] }
dust_dds = { version = "0.15", optional = true }
cyclonedds = { version = "1.8.0", optional = true, default-features = false, features = ["std"] }

[features]
amqp-wire = ["server", "medulla-server-api/amqp-wire", "medulla-wire-core/amqp-wire"]
kv = ["server", "medulla-kernel/kv", "medulla-protocol-types/kv", "medulla-server-api/kv", "medulla-server-blob/kv", "medulla-types/kv"]
kvcache-server = ["server", "dep:medulla-kvcache"]
mqtt-wire = ["server", "medulla-server-api/mqtt-wire", "medulla-wire-core/mqtt-wire"]
redis-wire = ["kv", "server", "medulla-server-api/redis-wire", "medulla-wire-core/redis-wire"]
ros2-bridge = ["server", "streaming", "dep:futures", "dep:tokio-tungstenite"]
ros2-dds = ["server", "streaming", "dep:futures", "dep:dust_dds"]
ros2-rmw = ["server", "streaming", "dep:futures", "dep:cyclonedds"]
s3-api = ["kv", "server"]
security = ["dep:sha1", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-server-cdc/security", "medulla-types/security", "medulla-wire-core/security"]
server = ["dep:tokio", "dep:async-trait", "medulla-kernel/server", "medulla-server-api/server"]
stomp-wire = ["server", "medulla-server-api/stomp-wire", "medulla-wire-core/stomp-wire"]
streaming = ["server", "medulla-protocol-types/streaming", "medulla-server-api/streaming", "medulla-server-cdc/streaming", "medulla-types/streaming"]
[dev-dependencies]
medulla-wire-core = { path = "../medulla-wire-core", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support"] }
tempfile = "3"
