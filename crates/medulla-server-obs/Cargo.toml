[package]
name = "medulla-server-obs"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Observability, traces, telemetry and QoS"
license = "MIT"
publish = false

[lib]
name = "medulla_server_obs"
path = "src/lib.rs"

[dependencies]
medulla-sql-lang = { path = "../medulla-sql-lang" }
medulla-sql = { path = "../medulla-sql" }
arrow = { version = "58.4", optional = true }
dashmap = "6.2"
hex = "0.4"
medulla-kernel = { path = "../medulla-kernel" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-text = { path = "../medulla-text", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
polars-core = { version = "0.54.4", optional = true, default-features = false }
polars-io = { version = "0.54.4", optional = true, default-features = false, features = ["parquet"] }
prost = { version = "0.14", optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
snap = { version = "1.1", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
medulla-isolation = { path = "../medulla-isolation" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-cdc = { path = "../medulla-server-cdc" }

medulla-graphql = { path = "../medulla-graphql", optional = true }

medulla-lake = { path = "../medulla-lake", optional = true }

medulla-stream = { path = "../medulla-stream", optional = true }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }

medulla-capabilities = { path = "../medulla-capabilities", optional = true }

async-trait = { version = "0.1", optional = true }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

redb = { workspace = true, optional = true }

medulla-transaction = { path = "../medulla-transaction", optional = true }

medulla-storage = { path = "../medulla-storage", optional = true }

medulla-rdf = { path = "../medulla-rdf", optional = true }

medulla-plan = { path = "../medulla-plan", optional = true }

[features]
blob = ["server", "redb", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob"]
federation = ["dep:medulla-plan", "medulla-plan/federation", "query", "server", "medulla-graphql?/federation", "medulla-server-api/federation", "medulla-types/federation"]
federation-search = ["server", "federation", "medulla-server-api/federation-search"]
graphql = ["dep:medulla-graphql", "medulla-graphql/hardening", "server", "security", "medulla-kernel/graphql", "medulla-server-api/graphql", "medulla-types/graphql"]
kv = ["server", "redb", "medulla-kernel/kv", "medulla-server-api/kv", "medulla-server-blob/kv", "medulla-types/kv"]
kvcache-server = ["oidc", "server"]
lake = ["dep:medulla-lake", "medulla-lake/lake", "server", "blob", "tsdb", "medulla-server-api/lake"]
metrics = ["medulla-kernel/metrics", "medulla-server-api/metrics", "medulla-types/metrics"]
obs = ["dep:polars-io", "dep:polars-core", "dep:medulla-text", "dep:medulla-stream", "dep:arrow", "medulla-text/tantivy", "server", "tsdb", "blob", "medulla-server-api/obs", "query"]
oidc = ["dep:jsonwebtoken", "medulla-server-api/oidc"]
otel-export = ["obs", "traces", "dep:snap", "dep:prost", "metrics", "medulla-server-api/otel-export", "query"]
policy_export = ["security"]
promql = ["obs", "dep:medulla-tsdb", "medulla-tsdb/promql", "medulla-server-api/promql", "query"]
query = ["dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "medulla-sql/sql", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-kernel/query", "medulla-server-api/query", "medulla-server-cdc/query", "medulla-types/query"]
rdf = ["dep:medulla-rdf", "medulla-rdf/rdf", "server", "medulla-kernel/rdf", "medulla-server-api/rdf", "medulla-types/rdf"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-kernel/redb", "medulla-server-api/redb", "medulla-server-blob/redb"]
s3-api = ["blob", "kv", "server"]
security = ["dep:sha1", "dep:argon2", "redb", "oidc", "medulla-isolation/security", "medulla-kernel/security", "medulla-server-api/security", "medulla-server-blob/security", "medulla-server-cdc/security", "medulla-types/security"]
server = ["dep:tokio", "dep:medulla-capabilities", "dep:async-trait", "medulla-kernel/server", "medulla-server-api/server"]
shacl = ["rdf", "medulla-kernel/shacl", "medulla-server-api/shacl", "medulla-server-blob/shacl", "medulla-server-cdc/shacl", "sparql"]
sparql = ["dep:medulla-rdf", "medulla-rdf/sparql", "rdf", "medulla-kernel/sparql", "medulla-server-api/sparql", "medulla-types/sparql"]
sparql-http = ["sparql", "server", "shacl", "security", "medulla-server-api/sparql-http", "medulla-server-blob/sparql-http"]
streaming = ["server", "medulla-server-api/streaming", "medulla-server-cdc/streaming", "medulla-types/streaming"]
traces = ["obs", "dep:medulla-tsdb", "medulla-tsdb/traces", "medulla-server-api/traces", "query"]
tsdb = ["dep:medulla-tsdb", "medulla-tsdb/redb-store", "dep:medulla-plan", "medulla-plan/timeseries", "server", "redb", "medulla-server-api/tsdb"]
viz-interactive = ["viz-static-export"]
viz-static-export = ["server", "medulla-server-api/viz-static-export"]
[dev-dependencies]
tempfile = "3"
