[package]
name = "medulla-reasoner"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: OWL, tableau and rule reasoning plus reasoning closure"
license = "MIT"
publish = false

[lib]
name = "medulla_reasoner"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
serde_json = "1.0"
rmp-serde = "1.3"
rand = "0.8"
tracing = "0.1"
rand_chacha = "0.3"
cudarc = { version = "0.17", optional = true, default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12060"] }

[features]
gpu-cuda = ["dep:cudarc"]
reasoning = []
