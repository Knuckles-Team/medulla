tempfile = "3"
criterion = { version = "0.8", default-features = false }

# Nightly ontology diff budget (MEDULLA-TYPED-PACKS-R804.6); never gates a pull request.

[[bench]]
name = "ontology_diff"
path = "benches/ontology_diff.rs"
harness = false
required-features = ["shacl"]

# Agent component projection budget (MEDULLA-ORCH-VOCAB-R003.6); never gates a pull request.

[[bench]]
name = "agent_library_projection"
path = "benches/agent_library_projection.rs"
harness = false
required-features = ["rdf"]
