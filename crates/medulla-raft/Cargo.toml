kv = ["redb"]
matview = ["query", "streaming"]
modality-serving = ["redb", "security", "streaming"]
nonblocking = ["raft"]
owl = ["sparql"]
query = ["redb"]
raft = ["redb"]
reasoning = []
redb = []
security = ["redb"]
shacl = []
sparql = []
sqlite-file = ["query"]
statechart = []
stream = ["query"]
streaming = []
tsdb = ["redb"]
wasm-udf = []
