[package]
name = "medulla-h-compute"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (compute)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_compute"
path = "src/lib.rs"

[dependencies]
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
medulla-viz-columnstore = { path = "../medulla-viz-columnstore", optional = true }
medulla-viz-core = { path = "../medulla-viz-core", optional = true }
medulla-viz-export = { path = "../medulla-viz-export", optional = true }
medulla-viz-graph-tiles = { path = "../medulla-viz-graph-tiles", optional = true }
medulla-viz-kernels = { path = "../medulla-viz-kernels", optional = true }
medulla-wasm = { path = "../medulla-wasm", optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-numeric = { path = "../medulla-numeric" }
medulla-finance = { path = "../medulla-finance" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-finance-quant = { path = "../medulla-finance-quant" }
medulla-finance-market = { path = "../medulla-finance-market" }
medulla-server-auth = { path = "../medulla-server-auth" }

medulla-quantum-core = { path = "../medulla-quantum-core", optional = true }
medulla-quantum-sim = { path = "../medulla-quantum-sim", optional = true }

[features]
datascience = ["medulla-compute/datascience", "medulla-protocol-types/datascience", "medulla-result-types/datascience", "medulla-types/datascience"]
finance = ["medulla-finance-quant/analytics", "medulla-compute/finance", "medulla-protocol-types/finance", "medulla-result-types/finance", "medulla-types/finance"]
quantum-agent-api = ["dep:medulla-quantum-core", "dep:medulla-quantum-sim", "medulla-server-api/quantum-agent-api", "server"]
viz-graph-tiles = ["dep:medulla-viz-graph-tiles", "viz-interactive"]
viz-interactive = ["dep:medulla-viz-kernels", "viz-static-export", "medulla-viz-core?/viz-interactive"]
viz-static-export = ["dep:medulla-viz-export", "medulla-server-api/viz-static-export", "viz-columnstore", "server"]
wasm-udf = ["dep:medulla-wasm", "medulla-wasm/wasm-udf", "medulla-protocol-types/wasm-udf", "medulla-server-api/wasm-udf", "medulla-server-auth/wasm-udf", "medulla-types/wasm-udf", "server"]
viz-columnstore = ["dep:medulla-viz-columnstore", "medulla-server-api/viz-columnstore", "viz"]
viz = ["dep:medulla-viz-core", "medulla-protocol-types/viz", "medulla-server-api/viz", "medulla-types/viz", "medulla-viz-core?/viz", "medulla-viz-graph-tiles?/viz", "medulla-viz-kernels?/viz"]
server = ["medulla-server-api/server"]

[dev-dependencies]
medulla-compute = { path = "../medulla-compute", features = ["test-support"] }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support", "test-ambient-auth"] }
