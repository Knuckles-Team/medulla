[package]
name = "medulla-wire"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine wire protocol listeners"
license = "MIT"
publish = false

[lib]
name = "medulla_wire"
path = "src/lib.rs"

[dependencies]

[features]
amqp-wire = ["server"]
ann = []
ann-redb = ["ann", "redb"]
bolt-wire = ["server"]
cost = ["server"]
epistemic-tms = []
federation = ["query", "server"]
federation-search = ["server", "federation"]
full = ["server", "query", "graphql", "redb", "ann", "ann-redb", "tsdb", "kv", "text", "sparql", "sparql-http", "owl", "streaming", "security", "federation", "pgwire", "mysql-wire", "mssql-wire", "sqlite-wire", "bolt-wire", "redis-wire", "amqp-wire", "mqtt-wire", "stomp-wire", "cost", "obs", "traces", "s3-api", "federation-search", "kvcache-server", "epistemic-tms", "lake", "lake-rest", "viz-interactive"]
graphql = ["server", "security"]
kv = ["server", "redb"]
kvcache-server = ["server"]
lake = ["server", "tsdb"]
lake-rest = ["lake"]
metrics = []
mining = []
mqtt-wire = ["server"]
mssql-wire = ["query", "server"]
mysql-wire = ["query", "server"]
obs = ["server", "tsdb", "text"]
owl = ["sparql"]
pgwire = ["query", "server"]
policy_export = ["security"]
query = ["redb"]
raft = ["server", "redb"]
redb = []
redis-wire = ["kv", "server"]
ros2-bridge = ["server", "streaming"]
ros2-dds = ["server", "streaming"]
ros2-rmw = ["server", "streaming"]
s3-api = ["kv", "server"]
security = ["redb"]
server = []
sparql = []
sparql-http = ["sparql", "server", "security"]
sqlite-wire = ["query", "server"]
stomp-wire = ["server"]
streaming = ["server"]
text = ["query"]
traces = ["obs"]
tsdb = ["server", "redb"]
viz-interactive = []
