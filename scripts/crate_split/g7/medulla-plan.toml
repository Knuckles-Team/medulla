covers = ["federation_opt::FederationSession", "federation_opt::foreign_named", "federation_opt::foreign_scan", "federation_opt::prepare", "federation::ForeignSourceRegistry"]
note = "add to exec: `pub trait ForeignExecutor: Sync { fn prepare(&self, ctx: &PlanCtx, ops: &[Op]); fn foreign_scan(&self, op: &Op, input: RowSet, source: &ForeignSourceSpec, join: bool, ctx: &PlanCtx) -> Result<RowSet, String>; fn foreign_named(&self, op: &Op, name: &str, ctx: &PlanCtx) -> Result<RowSet, String>; }`. Replace PlanCtx fields `foreign` and `federation` with one `pub federation: Option<&'a dyn ForeignExecutor>`; exec/dispatch.rs and exec.rs:549 call through it. In federation add `pub struct FederatedExec<'a> { pub session: Option<&'a FederationSession>, pub registry: Option<&'a ForeignSourceRegistry> }` implementing the trait with today's bodies (foreign_named reads self.registry instead of ctx.foreign), and move PlanCtx::with_foreign / with_federation into a `PlanCtxFederationExt` trait there. Every caller of with_foreign/with_federation builds one FederatedExec. Land this cut as its own commit before any move."

