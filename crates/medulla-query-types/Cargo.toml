[package]
name = "medulla-query-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Query plan AST and wire DTO types"
license = "MIT"
publish = false

[lib]
name = "medulla_query_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }

[features]
asr-native = []
quantum = []
viz = []
wire-complete = ["medulla-types/wire-contract", "medulla-types/timeseries", "medulla-types/probabilistic", "medulla-types/jobs", "medulla-types/statechart", "medulla-types/program-optimization", "medulla-types/knowledge-batch", "medulla-types/modality-serving", "quantum", "asr-native", "viz"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
