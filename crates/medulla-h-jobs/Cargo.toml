federation = ["dep:medulla-plan", "medulla-plan/federation", "medulla-protocol-types/federation", "medulla-raft/federation", "medulla-server-api/federation", "medulla-server-auth/federation", "medulla-server-ops/federation", "medulla-types/federation"]
federation-sql = ["dep:medulla-plan", "medulla-plan/federation-sql", "medulla-raft/federation-sql", "medulla-server-api/federation-sql", "medulla-server-ops/federation-sql"]
geo = ["dep:medulla-plan", "medulla-plan/geo", "medulla-raft/geo", "medulla-server-api/geo", "medulla-types/geo"]
tensor = ["dep:medulla-plan", "medulla-plan/tensor", "medulla-raft/tensor", "medulla-server-api/tensor", "medulla-types/tensor"]
stream = ["dep:medulla-plan", "medulla-plan/stream", "medulla-raft/stream", "medulla-server-api/stream", "medulla-server-ops/stream", "medulla-types/stream"]
nl-query = ["dep:medulla-plan", "medulla-plan/nl-query", "medulla-raft/nl-query", "medulla-server-api/nl-query"]
tsdb = ["dep:medulla-plan", "medulla-plan/timeseries", "medulla-persistence/tsdb", "medulla-raft/tsdb", "medulla-server-api/tsdb", "medulla-server-ops/tsdb"]
