epistemic-causal = ["epistemic"]
epistemic-tms = ["epistemic"]
evidence-graph = ["epistemic"]
federation = ["query", "server"]
federation-search = ["server", "federation"]
federation-sql = ["federation"]
finance = []
full = ["decide", "server", "server-tls", "query", "knowledge-batch", "cypher", "graphql", "redb", "ann", "ann-redb", "tsdb", "blob", "kv", "sparql", "sparql-http", "shacl", "owl", "obda", "streaming", "wasm-udf", "security", "oidc", "federation", "federation-sql", "mssql-wire", "redis-wire", "amqp-wire", "mqtt-wire", "stomp-wire", "stream", "cost", "otel-export", "shex", "obs", "nl-query", "promql", "traces", "s3-api", "federation-search", "kvcache-server", "sqlite-file", "epistemic", "evidence-graph", "epistemic-tms", "epistemic-causal", "jobs", "statechart", "modality-serving", "matview", "lake", "lake-rest", "viz-static-export", "viz-interactive"]
