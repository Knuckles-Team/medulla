[package]
name = "medulla-h-mining"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Mining handlers"
license = "MIT"
publish = false

[lib]
name = "medulla_h_mining"
path = "src/lib.rs"

[dependencies]
medulla-h-query = { path = "../medulla-h-query" }
hex = "0.4"
medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-mining = { path = "../medulla-mining" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-exec = { path = "../medulla-exec" }

[features]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-h-query/epistemic"]
federation = ["query", "dep:medulla-plan", "medulla-h-query/federation"]
mining = ["medulla-h-query/mining"]
query = ["dep:medulla-tsdb", "dep:medulla-plan", "medulla-h-query/query"]
tsdb = ["dep:medulla-tsdb", "dep:medulla-plan", "medulla-h-query/tsdb"]
