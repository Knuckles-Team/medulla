# ---------------------------------------------------------------- routing
# Rules are tried in order: (1) [[route]] keyword rules for the row's spec, matched
# case-insensitively against the row title (the bold lead); (2) the first source path the
# row names, resolved through the moves above; (3) the spec default.
# Paths to test files resolve like any other file.

[routing]
# Paths a row cites only to register a method or an error code. The registry line is
# under 10 lines; the row's work lands where its other paths or its spec default say.
skip_paths = ["crates/medulla-types/src/protocol/method", "crates/medulla-types/src/contract/server_error_code"]
# A row whose path resolves to the thin medulla-types crate adds a domain type: it goes to
# the spec's domain types crate instead. The thin crate takes no new rows.
types_home = { "decision-engine" = "medulla-decision-types", "federated-query-and-reasoning" = "medulla-result-types", "durable-graph-kernel" = "medulla-mutation-types", "typed-packs-and-catalog" = "medulla-catalog-types", "connector-competency" = "medulla-catalog-types", "cross-source-competency" = "medulla-catalog-types", "orchestration-competency" = "medulla-agent-types", "orchestration-vocabulary" = "medulla-agent-types", "media-and-personal-vocabulary" = "medulla-catalog-types", "supply-chain-vocabulary" = "medulla-catalog-types", "data-platform-vocabulary" = "medulla-catalog-types", "unified-data-plane" = "medulla-catalog-types", "source-authority" = "medulla-catalog-types", "ingest-worker" = "medulla-catalog-types", "repository-index-and-ingestion" = "medulla-catalog-types", "source-changesets" = "medulla-mutation-types", "branch-merge" = "medulla-mutation-types", "development-lifecycle" = "medulla-catalog-types", "finance-primitives" = "medulla-result-types", "engine-parity" = "medulla-protocol-types", "placement-and-worker-policy" = "medulla-identity-types", "engine-identity-and-scope" = "medulla-identity-types", "object-storage-backend" = "medulla-mutation-types", "public-engine-contract-and-release" = "medulla-protocol-types" }

[defaults]
"decision-engine" = ["medulla-decision-records", "src/records"]
