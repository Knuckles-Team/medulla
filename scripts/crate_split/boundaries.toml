# Crate boundary map after the full split (MEDULLA-CONTRACT-R056.11).
# Target state: one responsibility per crate, acyclic downward layering, <= 25,000 lines of
# Rust per crate (vendored patches excluded), handler crates are siblings with no edges,
# no re-exports to preserve old paths.
#
# Read by route_rows.py, which measures current lines, routes every open spec row and
# projects lines. `current_lines` and `projected_lines` are written by
# `route_rows.py --update`; do not edit them by hand.
#
# Levels. Leaf crates (kind leaf*) are L0..L6; facade crates (from manifest.toml, split
# here) are F0..F12 and sit above every leaf. A crate may depend only on crates of a
# strictly lower level (leaf < facade). Same-level crates are siblings: no edges.
#   L0 thin types | L1 domain types | L2 storage/numeric/rdf primitives + unchanged leaves
#   L3 graph core, index, reasoner, statistics | L4 query languages, algorithms, policy
#   L5 planning, federation, retrieval, packs, ingest | L6 records, eval, competency
#   F0 kernel | F1 store | F2 store extensions | F3 server-api | F4 api extensions
#   F5 persistence | F6 persistence extensions | F7 raft | F8 raft-xshard, wire-core
#   F9 handlers + wire listeners (siblings) | F10 server parts | F11 server | F12 engine
#
# moves: path prefixes taken from today's crates. Longest prefix wins. A prefix names a
# module (`<p>.rs` and `<p>/**`) unless it ends in `.rs`. `*` globs one path component.
# A file under crates/<c>/src that no move takes stays in <c>; a file under src/ that no
# move takes goes where placement.toml says.

[estimates]
# Projected Rust lines per open row: implementation plus its bound test.
default_lines_per_row = 100
# Competency and vocabulary rows are mostly served queries, ontology terms and tests.
spec_lines_per_row = { "connector-competency" = 60, "cross-source-competency" = 60, "orchestration-competency" = 60, "orchestration-vocabulary" = 60, "media-and-personal-vocabulary" = 60, "supply-chain-vocabulary" = 60, "data-platform-vocabulary" = 60 }
budget_lines = 25000

