[package]
name = "medulla-result-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Answer, result contract, verdict, epistemic node, argument and query predicate types"
license = "MIT"
publish = false

[lib]
name = "medulla_result_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
serde_bytes = "0.11.19"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
strum = { version = "0.28", features = ["derive"], optional = true }
schemars = { version = "1.2.3", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }

[features]
wire-contract = ["finance", "datascience", "mining", "graphlearn", "ml-pipeline", "query", "compute-dist", "medulla-types/wire-contract", "medulla-mutation-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-types/wire-complete", "medulla-mutation-types/wire-complete"]
compute-dist = ["medulla-types/compute-dist"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-mutation-types/contract-schema"]
datascience = ["medulla-types/datascience"]
finance = ["medulla-types/finance"]
graphlearn = ["datascience", "medulla-types/graphlearn"]
mining = ["medulla-types/mining"]
ml-pipeline = ["mining", "datascience", "graphlearn", "medulla-types/ml-pipeline"]
query = ["medulla-types/query"]
