[package]
name = "medulla-wire-core"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Shared wire listener framework"
license = "MIT"
publish = false

[lib]
name = "medulla_wire_core"
path = "src/lib.rs"

[dependencies]
medulla-sql-lang = { path = "../medulla-sql-lang" }
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
async-trait = { version = "0.1" }
hex = "0.4"
hmac = "0.12"
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-exec = { path = "../medulla-exec" }
medulla-uql = { path = "../medulla-uql" }
medulla-plan = { path = "../medulla-plan", optional = true }
sha1 = { version = "0.10", optional = true }
rustix = { version = "1.1.5", optional = true, features = ["fs"] }
futures = { version = "0.3", optional = true }
pgwire = { version = "0.40", optional = true, default-features = false, features = ["server-api", "_ring"] }

[features]
broker = ["medulla-core/broker", "medulla-server-api/broker"]
amqp-wire = ["broker", "medulla-server-api/amqp-wire"]
mqtt-wire = ["broker", "medulla-server-api/mqtt-wire"]
stomp-wire = ["broker", "medulla-server-api/stomp-wire"]
mssql-wire = ["query", "medulla-server-api/mssql-wire"]
redis-wire = ["medulla-server-api/redis-wire"]
federation = ["query", "dep:medulla-plan", "medulla-plan/federation", "medulla-exec/federation", "medulla-protocol-types/federation", "medulla-server-api/federation", "medulla-server-auth/federation", "medulla-server-ops/federation", "medulla-types/federation", "medulla-uql/federation"]
mysql-wire = ["query", "dep:sha1"]
pgwire = ["query", "dep:rustix", "dep:pgwire", "dep:futures"]
query = ["redb", "dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "medulla-sql/sql", "medulla-tables/sql", "medulla-table-store/sql", "dep:medulla-plan", "medulla-plan/query", "medulla-exec/query", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-ops/query", "medulla-types/query", "medulla-uql/query"]
redb = ["medulla-kernel/redb", "medulla-persistence/redb", "medulla-server-api/redb", "medulla-server-ops/redb"]
security = ["redb", "dep:sha1", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-persistence/security", "medulla-protocol-types/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-ops/security", "medulla-types/security"]
sparql = ["medulla-kernel/sparql", "medulla-persistence/sparql", "medulla-protocol-types/sparql", "medulla-server-api/sparql", "medulla-server-ops/sparql", "medulla-types/sparql"]
test-support = ["medulla-kernel/test-support", "medulla-persistence/test-support", "medulla-protocol-types/test-support", "medulla-server-api/test-support", "medulla-types/test-support", "medulla-server-ops/test-support", "medulla-server-auth/test-support", "medulla-exec/test-support"]
tsdb = ["redb", "dep:medulla-tsdb", "medulla-tsdb/redb-store", "dep:medulla-plan", "medulla-plan/timeseries", "medulla-persistence/tsdb", "medulla-server-api/tsdb", "medulla-server-ops/tsdb"]
[dev-dependencies]
medulla-kernel = { path = "../medulla-kernel", features = ["test-support"] }
medulla-persistence = { path = "../medulla-persistence", features = ["test-support"] }
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-server-ops = { path = "../medulla-server-ops", features = ["test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support", "test-ambient-auth"] }
medulla-exec = { path = "../medulla-exec", features = ["test-support"] }
medulla-server = { path = "../medulla-server", features = ["amqp-wire", "federation", "full", "mqtt-wire", "mssql-wire", "mysql-wire", "query", "redb", "redis-wire", "security", "sparql", "stomp-wire", "test-support", "tsdb"] }
