[package]
name = "medulla-resource-store"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Resource reservations, capacity leases and enrichment budgets"
license = "MIT"
publish = false

[lib]
name = "medulla_resource_store"
path = "src/lib.rs"

[dependencies]
medulla-store = { path = "../medulla-store", features = ["redb"] }
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-agent-types = { path = "../medulla-agent-types" }
hex = "0.4"
medulla-kernel = { path = "../medulla-kernel" }
medulla-storage = { path = "../medulla-storage" }
medulla-transaction = { path = "../medulla-transaction" }
medulla-types = { path = "../medulla-types" }
rand = "0.8"
redb = { workspace = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-work-types = { path = "../medulla-work-types" }

[features]
security = ["medulla-store/security", "medulla-graph-core/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-types/security"]
server = ["medulla-store/server", "medulla-kernel/server"]
test-support = ["medulla-store/test-support", "medulla-protocol-types/test-support", "medulla-agent-types/test-support", "medulla-kernel/test-support", "medulla-types/test-support", "medulla-work-types/test-support"]
[dev-dependencies]
tempfile = "3"
