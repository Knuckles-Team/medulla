[package]
name = "medulla-server-identity"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Identity store dispatch, request boundary and policy evolution dispatch"
license = "MIT"
publish = false

[lib]
name = "medulla_server_identity"
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }
hex = "0.4"
hmac = "0.12"
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-types = { path = "../medulla-types" }
rand = "0.8"
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-isolation = { path = "../medulla-isolation" }
medulla-server-graph = { path = "../medulla-server-graph" }

jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }

redb = { workspace = true, optional = true }

medulla-transaction = { path = "../medulla-transaction", optional = true }

medulla-storage = { path = "../medulla-storage", optional = true }

async-trait = { version = "0.1", optional = true }
medulla-server-auth = { path = "../medulla-server-auth" }

[features]
test-support = ["medulla-server-graph/test-support", ]
oidc = ["medulla-server-graph/oidc", "dep:jsonwebtoken"]
redb = ["medulla-server-graph/redb", "dep:redb", "dep:medulla-transaction", "dep:medulla-storage"]
security = ["medulla-server-graph/security", "dep:sha1", "dep:argon2", "redb", "oidc"]
