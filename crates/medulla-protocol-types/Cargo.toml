[package]
name = "medulla-protocol-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Method registry and wire-query envelope types shared by every listener and client"
license = "MIT"
publish = false

[lib]
name = "medulla_protocol_types"
path = "src/lib.rs"

[dependencies]
serde_bytes = "0.11.19"
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
strum = { version = "0.28", features = ["derive"], optional = true }
schemars = { version = "1.2.3", optional = true }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-index-types = { path = "../medulla-index-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }

[features]
wire-contract = ["finance", "datascience", "mining", "graphlearn", "ml-pipeline", "epistemic", "query", "graphql", "broker", "blob", "kv", "sqlite-file", "streaming", "cost", "rdf", "sparql", "owl", "obda", "wasm-udf", "compute-dist", "matview", "security", "federation", "medulla-types/wire-contract", "medulla-identity-types/wire-contract", "medulla-mutation-types/wire-contract", "medulla-index-types/wire-contract", "medulla-result-types/wire-contract", "medulla-agent-types/wire-contract", "medulla-catalog-types/wire-contract", "medulla-decision-types/wire-contract"]
wire-complete = ["wire-contract", "jobs", "statechart", "knowledge-batch", "modality-serving", "quantum", "asr-native", "viz", "medulla-types/wire-complete", "medulla-identity-types/wire-complete", "medulla-mutation-types/wire-complete", "medulla-index-types/wire-complete", "medulla-result-types/wire-complete", "medulla-agent-types/wire-complete", "medulla-catalog-types/wire-complete", "medulla-decision-types/wire-complete"]
asr-native = ["medulla-types/asr-native"]
blob = ["medulla-types/blob"]
broker = ["medulla-types/broker"]
compute-dist = ["medulla-types/compute-dist", "medulla-result-types/compute-dist"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-identity-types/contract-schema", "medulla-mutation-types/contract-schema", "medulla-index-types/contract-schema", "medulla-result-types/contract-schema", "medulla-agent-types/contract-schema", "medulla-work-types/contract-schema", "medulla-catalog-types/contract-schema", "medulla-source-types/contract-schema", "medulla-decision-types/contract-schema", "medulla-decision-outcome-types/contract-schema"]
cost = ["medulla-types/cost"]
datascience = ["medulla-types/datascience", "medulla-result-types/datascience"]
epistemic = ["query", "medulla-types/epistemic"]
federation = ["query", "medulla-types/federation"]
finance = ["medulla-types/finance", "medulla-result-types/finance"]
graphlearn = ["datascience", "medulla-types/graphlearn", "medulla-result-types/graphlearn"]
graphql = ["security", "medulla-types/graphql"]
jobs = ["mining", "epistemic", "medulla-types/jobs", "medulla-agent-types/jobs", "medulla-work-types/jobs"]
knowledge-batch = ["query", "medulla-types/knowledge-batch"]
kv = ["medulla-types/kv"]
matview = ["streaming", "query", "medulla-types/matview"]
metrics = ["dep:strum", "medulla-types/metrics"]
mining = ["medulla-types/mining", "medulla-result-types/mining"]
ml-pipeline = ["mining", "datascience", "graphlearn", "medulla-types/ml-pipeline", "medulla-result-types/ml-pipeline"]
modality-serving = ["security", "streaming", "medulla-types/modality-serving"]
obda = ["sparql", "query", "medulla-types/obda"]
owl = ["sparql", "medulla-types/owl"]
quantum = ["medulla-types/quantum"]
query = ["medulla-types/query", "medulla-result-types/query", "medulla-decision-types/query"]
rdf = ["medulla-types/rdf"]
security = ["medulla-types/security"]
sparql = ["rdf", "medulla-types/sparql"]
sqlite-file = ["query", "medulla-types/sqlite-file"]
statechart = ["medulla-types/statechart"]
streaming = ["medulla-types/streaming"]
test-support = ["medulla-types/test-support", "medulla-identity-types/test-support", "medulla-agent-types/test-support", "medulla-work-types/test-support", "medulla-catalog-types/test-support", "medulla-source-types/test-support", "medulla-decision-types/test-support", "medulla-decision-outcome-types/test-support"]
viz = ["medulla-types/viz"]
wasm-udf = ["query", "medulla-types/wasm-udf"]
