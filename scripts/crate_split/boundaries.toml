[[route]]
spec = "federated-query-and-reasoning"
match = "reason|owl|entail|rule|infer|closure|tableau"
crate = "medulla-reasoner"
module = "src/rules"
[[route]]
spec = "federated-query-and-reasoning"
match = "natural.language|\\bnl\\b|question"
crate = "medulla-nlq"
module = "src/nl"
[[route]]
spec = "federated-query-and-reasoning"
match = "retriev|expan|rank|rerank|rag|recall|vector|semantic|embedding|discover"
crate = "medulla-retrieval"
module = "src/retrieval"
[[route]]
spec = "federated-query-and-reasoning"
match = "federat|remote|source|virtual|push.?down"
crate = "medulla-federation"
