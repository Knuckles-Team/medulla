[package]
name = "medulla-server-lake"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Lake serving, GraphQL subscriptions and policy export"
license = "MIT"
publish = false

[lib]
name = "medulla_server_lake"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-graphql = { path = "../medulla-graphql", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-lake = { path = "../medulla-lake", optional = true }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-stream = { path = "../medulla-stream", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-auth = { path = "../medulla-server-auth" }

sha1 = { version = "0.10", optional = true }

argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

async-trait = { version = "0.1", optional = true }

redb = { workspace = true, optional = true }

medulla-transaction = { path = "../medulla-transaction", optional = true }

medulla-storage = { path = "../medulla-storage", optional = true }

medulla-plan = { path = "../medulla-plan", optional = true }

[features]
amqp-wire = ["server", "medulla-server-api/amqp-wire"]
blob = ["server", "redb", "medulla-protocol-types/blob", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob"]
cdc-kafka = ["dep:medulla-stream", "medulla-stream/cdc-kafka", "streaming", "medulla-server-api/cdc-kafka"]
graphql = ["security", "dep:medulla-graphql", "medulla-graphql/hardening", "server", "medulla-kernel/graphql", "medulla-protocol-types/graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-types/graphql"]
kv = ["server", "redb", "medulla-kernel/kv", "medulla-protocol-types/kv", "medulla-server-api/kv", "medulla-server-blob/kv", "medulla-types/kv"]
lake = ["dep:medulla-lake", "medulla-lake/lake", "server", "blob", "tsdb", "medulla-server-api/lake"]
lake-rest = ["lake", "oidc"]
lineage-transport = ["lake"]
lineage-transport-kafka = ["lineage-transport", "cdc-kafka"]
mqtt-wire = ["server", "medulla-server-api/mqtt-wire"]
mssql-wire = ["query", "server", "medulla-server-api/mssql-wire"]
oidc = ["dep:jsonwebtoken", "medulla-server-api/oidc", "medulla-server-auth/oidc"]
policy_export = ["security"]
query = ["dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "dep:medulla-plan", "medulla-plan/query", "redb", "medulla-kernel/query", "medulla-protocol-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-types/query"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-kernel/redb", "medulla-server-api/redb", "medulla-server-blob/redb"]
redis-wire = ["kv", "server", "medulla-server-api/redis-wire"]
security = ["oidc", "dep:sha1", "dep:argon2", "redb", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-protocol-types/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-types/security"]
server = ["dep:tokio", "dep:async-trait", "medulla-kernel/server", "medulla-server-api/server"]
stomp-wire = ["server", "medulla-server-api/stomp-wire"]
streaming = ["server", "medulla-protocol-types/streaming", "medulla-server-api/streaming", "medulla-types/streaming"]
tsdb = ["dep:medulla-tsdb", "medulla-tsdb/redb-store", "dep:medulla-plan", "medulla-plan/timeseries", "server", "redb", "medulla-server-api/tsdb"]
[dev-dependencies]
medulla-protocol-types = { path = "../medulla-protocol-types", features = ["test-support"] }
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support"] }
medulla-server-blob = { path = "../medulla-server-blob", features = ["test-support"] }
medulla-kernel = { path = "../medulla-kernel", features = ["test-support"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support"] }
