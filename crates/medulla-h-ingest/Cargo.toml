[package]
name = "medulla-h-ingest"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine method handlers (ingest)"
license = "MIT"
publish = false

[lib]
name = "medulla_h_ingest"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-audio = { path = "../medulla-audio", optional = true }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-document = { path = "../medulla-document", optional = true }
medulla-image = { path = "../medulla-image", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-numeric = { path = "../medulla-numeric", optional = true }
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-raft = { path = "../medulla-raft" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-types = { path = "../medulla-types" }
medulla-video = { path = "../medulla-video", optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"] }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-decision-stats = { path = "../medulla-decision-stats" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }
medulla-persistence-records = { path = "../medulla-persistence-records" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-mutation = { path = "../medulla-server-mutation" }
medulla-server-auth = { path = "../medulla-server-auth" }

medulla-asr-whisper = { path = "../medulla-asr-whisper", optional = true }

[features]
test-support = ["medulla-server-auth/test-support"]
asr-whisper = ["dep:medulla-audio", "medulla-audio/asr", "dep:medulla-asr-whisper", "medulla-persistence/asr-whisper", "medulla-raft/asr-whisper", "medulla-server-api/asr-whisper"]
ast = ["medulla-compute/ast", "medulla-server-api/ast", "medulla-store/ast"]
blob = ["dep:chrono", "redb", "medulla-protocol-types/blob", "medulla-raft/blob", "medulla-server-api/blob", "medulla-server-blob/blob", "medulla-types/blob"]
decide = ["dep:medulla-numeric", "medulla-numeric/decision", "medulla-decision-stats/decision", "redb", "medulla-compute/decide", "medulla-persistence-records/decide", "medulla-persistence/decide", "medulla-raft/decide", "medulla-server-api/decide", "medulla-server-ops/decide"]
modality-serving = ["dep:medulla-video", "medulla-video/runtime", "dep:medulla-modality", "dep:medulla-image", "medulla-image/runtime", "dep:medulla-document", "medulla-document/serving", "dep:medulla-audio", "medulla-audio/runtime", "redb", "security", "medulla-kernel/modality-serving", "medulla-persistence/modality-serving", "medulla-protocol-types/modality-serving", "medulla-raft/modality-serving", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-mutation/modality-serving", "medulla-server-ops/modality-serving", "medulla-types/modality-serving"]
query = ["medulla-tables/sql", "medulla-table-store/sql", "redb", "medulla-kernel/query", "medulla-persistence/query", "medulla-protocol-types/query", "medulla-raft/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-mutation/query", "medulla-server-ops/query", "medulla-store/query", "medulla-types/query"]
raft = ["redb", "medulla-kernel/raft", "medulla-persistence/raft", "medulla-raft/raft", "medulla-server-api/raft", "medulla-server-auth/raft", "medulla-server-mutation/raft", "medulla-store/raft"]
redb = ["dep:medulla-storage", "medulla-kernel/redb", "medulla-persistence-records/redb", "medulla-persistence/redb", "medulla-raft/redb", "medulla-server-api/redb", "medulla-server-blob/redb", "medulla-server-mutation/redb", "medulla-server-ops/redb", "medulla-store/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-persistence/security", "medulla-protocol-types/security", "medulla-raft/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-server-ops/security", "medulla-store/security", "medulla-types/security"]
tts-piper = ["dep:medulla-audio", "medulla-audio/tts"]
epistemic = ["dep:medulla-modality", "medulla-kernel/epistemic", "medulla-protocol-types/epistemic", "medulla-raft/epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-mutation/epistemic", "medulla-server-ops/epistemic", "medulla-types/epistemic"]
alignment = ["dep:medulla-modality", "medulla-raft/alignment", "medulla-server-api/alignment", "medulla-server-blob/alignment"]
knowledge-batch = ["dep:medulla-modality", "medulla-kernel/knowledge-batch", "medulla-persistence/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-raft/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch"]
numeric = ["dep:medulla-numeric", "medulla-kernel/numeric", "medulla-persistence/numeric", "medulla-raft/numeric", "medulla-server-api/numeric"]
cypher = ["medulla-kernel/cypher", "medulla-persistence/cypher", "medulla-server-api/cypher", "medulla-server-auth/cypher", "medulla-server-mutation/cypher"]
cypher-plan = ["medulla-kernel/cypher-plan", "medulla-persistence/cypher-plan", "medulla-server-api/cypher-plan"]
result-cache = ["medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-persistence/result-cache", "medulla-server-api/result-cache", "medulla-server-ops/result-cache"]
server = ["dep:tokio", "medulla-kernel/server", "medulla-persistence/server", "medulla-raft/server", "medulla-server-api/server", "medulla-store/server"]
[dev-dependencies]
medulla-server = { path = "../medulla-server", features = ["test-support"] }
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support"] }
tempfile = "3"
