[package]
name = "medulla-persistence-ops"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Backup, cold offload, online reshard, shard migration and store upgrade"
license = "MIT"
publish = false

[lib]
name = "medulla_persistence_ops"
path = "src/lib.rs"

[dependencies]
medulla-persistence = { path = "../medulla-persistence" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-persistence-records = { path = "../medulla-persistence-records" }
tempfile = { version = "3", optional = true }
hex = "0.4"
medulla-kernel = { path = "../medulla-kernel" }
medulla-server-api = { path = "../medulla-server-api" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-store-apply = { path = "../medulla-store-apply" }
medulla-types = { path = "../medulla-types" }
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
medulla-direct-state = { path = "../medulla-direct-state" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-table-store = { path = "../medulla-table-store" }

object_store = { version = "0.14.2", optional = true, features = ["aws"] }

[features]
cold-tier = ["medulla-persistence/cold-tier"]
cold-tier-s3 = ["cold-tier", "medulla-persistence/cold-tier-s3", "dep:object_store"]
metrics = ["medulla-persistence/metrics"]
query = ["redb", "medulla-persistence/query"]
raft = ["redb", "medulla-persistence/raft"]
server = ["dep:tokio", "medulla-persistence/server"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-persistence/redb", "medulla-persistence-records/redb"]

[dev-dependencies]
tempfile = "3"
