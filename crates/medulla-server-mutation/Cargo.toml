[package]
name = "medulla-server-mutation"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served mutation, mutation batches and transactions"
license = "MIT"
publish = false

[lib]
name = "medulla_server_mutation"
path = "src/lib.rs"

[dependencies]
medulla-server-api = { path = "../medulla-server-api" }
async-trait = { version = "0.1" }
dashmap = "6.2"
hex = "0.4"
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-core = { path = "../medulla-core" }
medulla-graphql = { path = "../medulla-graphql", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-program = { path = "../medulla-program", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-index-types = { path = "../medulla-index-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }

medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
redb = { workspace = true, optional = true }
medulla-server-cdc = { path = "../medulla-server-cdc" }
medulla-server-auth = { path = "../medulla-server-auth" }
medulla-sql-lang = { path = "../medulla-sql-lang" }

[features]
broker = ["medulla-server-api/broker", "medulla-server-auth/broker", "medulla-server-cdc/broker", "medulla-core/broker", "medulla-graph-core/broker", "medulla-kernel/broker", "medulla-protocol-types/broker", "medulla-types/broker"]
cypher = ["medulla-server-api/cypher", "medulla-server-auth/cypher", "medulla-kernel/cypher"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic", "medulla-server-auth/epistemic", "medulla-server-cdc/epistemic", "medulla-kernel/epistemic", "medulla-plan?/epistemic", "medulla-protocol-types/epistemic", "medulla-types/epistemic"]
epistemic-tms = ["epistemic", "dep:medulla-epistemic", "medulla-server-api/epistemic-tms", "medulla-epistemic?/epistemic-tms", "medulla-kernel/epistemic-tms"]
graphlearn = ["medulla-server-api/graphlearn", "medulla-graph-algos/graphlearn", "medulla-kernel/graphlearn", "medulla-protocol-types/graphlearn", "medulla-result-types/graphlearn", "medulla-types/graphlearn"]
graphql = ["dep:medulla-graphql", "medulla-server-api/graphql", "medulla-server-auth/graphql", "medulla-kernel/graphql", "medulla-protocol-types/graphql", "medulla-types/graphql", "redb"]
jobs = ["mining", "epistemic", "dep:medulla-jobs", "medulla-server-api/jobs", "medulla-agent-types/jobs", "medulla-capabilities/jobs", "medulla-protocol-types/jobs", "medulla-types/jobs", "medulla-work-types/jobs"]
kv = ["redb", "medulla-server-api/kv", "medulla-kernel/kv", "medulla-protocol-types/kv", "medulla-types/kv"]
metrics = ["medulla-server-api/metrics", "medulla-kernel/metrics", "medulla-protocol-types/metrics", "medulla-types/metrics"]
mining = ["medulla-server-api/mining", "medulla-server-auth/mining", "medulla-server-cdc/mining", "medulla-kernel/mining", "medulla-protocol-types/mining", "medulla-result-types/mining", "medulla-types/mining"]
ml-pipeline = ["mining", "graphlearn", "medulla-server-api/ml-pipeline", "medulla-kernel/ml-pipeline", "medulla-protocol-types/ml-pipeline", "medulla-result-types/ml-pipeline", "medulla-types/ml-pipeline"]
modality-serving = ["redb", "streaming", "dep:medulla-modality", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-cdc/modality-serving", "medulla-capabilities/modality-serving", "medulla-kernel/modality-serving", "medulla-protocol-types/modality-serving", "medulla-types/modality-serving"]
program-optimization = ["jobs", "dep:medulla-program", "medulla-server-api/program-optimization", "medulla-agent-types/program-optimization", "medulla-types/program-optimization", "medulla-work-types/program-optimization"]
query = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-cdc/query", "medulla-kernel/query", "medulla-plan?/query", "medulla-protocol-types/query", "medulla-result-types/query", "medulla-types/query"]
raft = ["redb", "medulla-server-api/raft", "medulla-server-auth/raft", "medulla-kernel/raft"]
rdf = ["dep:medulla-rdf", "medulla-server-api/rdf", "medulla-kernel/rdf", "medulla-protocol-types/rdf", "medulla-rdf?/rdf", "medulla-types/rdf"]
reasoning = ["medulla-server-api/reasoning", "medulla-server-cdc/reasoning", "medulla-kernel/reasoning"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-server-api/redb", "medulla-kernel/redb"]
shacl = ["rdf", "dep:medulla-shacl", "medulla-server-api/shacl", "medulla-server-cdc/shacl", "medulla-kernel/shacl"]
sparql-http = ["shacl", "medulla-server-api/sparql-http", "redb"]
statechart = ["medulla-server-api/statechart", "medulla-capabilities/statechart", "medulla-protocol-types/statechart", "medulla-types/statechart"]
streaming = ["medulla-server-api/streaming", "medulla-server-cdc/streaming", "medulla-protocol-types/streaming", "medulla-types/streaming"]
test-support = ["medulla-server-api/test-support", "medulla-server-auth/test-support", "medulla-kernel/test-support", "medulla-types/test-support", "medulla-agent-types/test-support", "medulla-catalog-types/test-support", "medulla-protocol-types/test-support", "medulla-work-types/test-support"]
[dev-dependencies]
medulla-table-store = { path = "../medulla-table-store", features = ["dev-scope-grant"] }
medulla-server-api = { path = "../medulla-server-api", features = ["test-support", "request-policy-fixture"] }
