[package]
name = "medulla-persistence"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine durable persistence backends"
license = "MIT"
publish = false

[lib]
name = "medulla_persistence"
path = "src/lib.rs"

[dependencies]
medulla-result-types = { path = "../medulla-result-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-identity-types = { path = "../medulla-identity-types" }
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-agent-types = { path = "../medulla-agent-types" }
tempfile = { version = "3", optional = true }
async-trait = { version = "0.1", optional = true }
hex = "0.4"
medulla-capabilities = { path = "../medulla-capabilities" }
medulla-compute = { path = "../medulla-compute" }
medulla-core = { path = "../medulla-core" }
medulla-kernel = { path = "../medulla-kernel" }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-server-api = { path = "../medulla-server-api" }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-store = { path = "../medulla-store" }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
medulla-types = { path = "../medulla-types" }
parking_lot = "0.12"
redb = { workspace = true, optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
medulla-direct-state = { path = "../medulla-direct-state" }
medulla-semantic-index = { path = "../medulla-semantic-index" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-decision-outcome-types = { path = "../medulla-decision-outcome-types" }
medulla-store-apply = { path = "../medulla-store-apply" }
medulla-resource-store = { path = "../medulla-resource-store" }
medulla-work-store = { path = "../medulla-work-store" }
medulla-lane-store = { path = "../medulla-lane-store" }
medulla-server-ops = { path = "../medulla-server-ops" }
medulla-server-blob = { path = "../medulla-server-blob" }
medulla-server-auth = { path = "../medulla-server-auth" }

[features]
test-support = ["dep:tempfile", "medulla-server-auth/test-support", "medulla-protocol-types/test-support", "medulla-identity-types/test-support", "medulla-decision-types/test-support", "medulla-catalog-types/test-support", "medulla-agent-types/test-support", "medulla-compute/test-support", "medulla-kernel/test-support", "medulla-server-api/test-support", "medulla-store/test-support", "medulla-types/test-support", "medulla-direct-state/test-support", "medulla-work-types/test-support", "medulla-decision-outcome-types/test-support", "medulla-store-apply/test-support", "medulla-resource-store/test-support", "medulla-work-store/test-support", "medulla-server-ops/test-support", "medulla-server-blob/test-support"]
cold-tier = ["medulla-core/cold-tier", "medulla-graph-core/cold-tier"]
cold-tier-s3 = ["cold-tier", "redb", "server"]
compute-dist = ["raft", "medulla-protocol-types/compute-dist", "medulla-result-types/compute-dist", "medulla-server-api/compute-dist", "medulla-server-ops/compute-dist", "medulla-store-apply/compute-dist", "medulla-store/compute-dist", "medulla-types/compute-dist"]
cost = ["server", "medulla-protocol-types/cost", "medulla-types/cost"]
cypher = ["medulla-kernel/cypher", "medulla-server-api/cypher", "medulla-server-auth/cypher"]
decide = ["medulla-capabilities/decide", "redb", "shacl", "medulla-compute/decide", "medulla-server-api/decide", "medulla-server-ops/decide", "jobs", "numeric", "owl", "owl-dl", "query", "sparql"]
kv = ["server", "redb", "medulla-kernel/kv", "medulla-protocol-types/kv", "medulla-server-api/kv", "medulla-server-blob/kv", "medulla-types/kv"]
matview = ["query", "medulla-protocol-types/matview", "medulla-server-api/matview", "medulla-server-ops/matview", "medulla-store-apply/matview", "medulla-store/matview", "medulla-types/matview", "result-cache", "server"]
metrics = ["medulla-kernel/metrics", "medulla-protocol-types/metrics", "medulla-server-api/metrics", "medulla-store-apply/metrics", "medulla-store/metrics", "medulla-types/metrics"]
query = ["dep:medulla-tsdb", "medulla-tsdb?/arrow-seg", "medulla-table-store/sql", "redb", "medulla-decision-types/query", "medulla-kernel/query", "medulla-protocol-types/query", "medulla-result-types/query", "medulla-server-api/query", "medulla-server-auth/query", "medulla-server-ops/query", "medulla-store/query", "medulla-types/query"]
raft = ["server", "redb", "medulla-kernel/raft", "medulla-server-api/raft", "medulla-server-auth/raft", "medulla-store-apply/raft", "medulla-store/raft"]
rdf = ["dep:medulla-rdf", "medulla-rdf/rdf", "server", "medulla-kernel/rdf", "medulla-protocol-types/rdf", "medulla-server-api/rdf", "medulla-types/rdf"]
redb = ["dep:redb", "dep:tokio", "dep:async-trait", "medulla-lane-store/server", "medulla-resource-store/server", "dep:medulla-transaction", "dep:medulla-storage", "medulla-kernel/redb", "medulla-server-api/redb", "medulla-server-blob/redb", "medulla-server-ops/redb", "medulla-store/redb"]
security = ["redb", "medulla-core/security", "medulla-graph-core/security", "medulla-isolation/security", "medulla-kernel/security", "medulla-lane-store/security", "medulla-protocol-types/security", "medulla-resource-store/security", "medulla-server-api/security", "medulla-server-auth/security", "medulla-server-blob/security", "medulla-server-ops/security", "medulla-store-apply/security", "medulla-store/security", "medulla-types/security", "medulla-work-store/security"]
server = ["dep:tracing-subscriber", "dep:tokio", "dep:async-trait", "medulla-kernel/server", "medulla-lane-store/server", "medulla-resource-store/server", "medulla-server-api/server", "medulla-store/server"]
shacl = ["rdf", "medulla-kernel/shacl", "medulla-server-api/shacl", "medulla-server-blob/shacl", "medulla-server-ops/shacl", "owl", "owl-dl", "sparql"]
sparql = ["dep:medulla-rdf", "medulla-rdf/sparql", "rdf", "medulla-kernel/sparql", "medulla-protocol-types/sparql", "medulla-server-api/sparql", "medulla-server-ops/sparql", "medulla-types/sparql"]
tsdb = ["dep:medulla-tsdb", "medulla-tsdb/redb-store", "server", "redb", "medulla-server-api/tsdb", "medulla-server-ops/tsdb", "medulla-store-apply/tsdb", "medulla-store/tsdb"]
jobs = ["medulla-capabilities/jobs", "medulla-agent-types/jobs", "medulla-protocol-types/jobs", "medulla-server-api/jobs", "medulla-server-ops/jobs", "medulla-types/jobs", "medulla-work-types/jobs", "query", "redb", "server"]
statechart = ["medulla-capabilities/statechart", "medulla-protocol-types/statechart", "medulla-server-api/statechart", "medulla-store-apply/statechart", "medulla-store/statechart", "medulla-types/statechart", "medulla-work-store/statechart", "server"]
viz = ["medulla-capabilities/viz", "medulla-protocol-types/viz", "medulla-server-api/viz", "medulla-types/viz"]
modality-serving = ["medulla-capabilities/modality-serving", "medulla-kernel/modality-serving", "medulla-protocol-types/modality-serving", "medulla-server-api/modality-serving", "medulla-server-auth/modality-serving", "medulla-server-ops/modality-serving", "medulla-types/modality-serving", "redb", "security", "server"]
asr-whisper = ["medulla-capabilities/asr-native", "medulla-server-api/asr-whisper", "server"]
knowledge-batch = ["medulla-capabilities/knowledge-batch", "medulla-kernel/knowledge-batch", "medulla-protocol-types/knowledge-batch", "medulla-server-api/knowledge-batch", "medulla-server-ops/knowledge-batch", "medulla-types/knowledge-batch", "query", "redb"]
quantum-agent-api = ["medulla-capabilities/quantum", "medulla-server-api/quantum-agent-api", "server"]
numeric = ["medulla-kernel/numeric", "medulla-server-api/numeric"]
cypher-plan = ["medulla-kernel/cypher-plan", "medulla-server-api/cypher-plan", "cypher"]
result-cache = ["medulla-core/result-cache", "medulla-graph-core/result-cache", "medulla-kernel/result-cache", "medulla-server-api/result-cache", "medulla-server-ops/result-cache"]
sparql-hash = ["dep:medulla-rdf", "medulla-rdf/sparql-hash", "medulla-server-api/sparql-hash", "rdf", "server", "sparql"]
rdf-xml = ["dep:medulla-rdf", "medulla-rdf/rdf-xml", "medulla-server-api/rdf-xml", "medulla-server-blob/rdf-xml", "rdf", "server"]
json-ld = ["dep:medulla-rdf", "medulla-rdf/json-ld", "medulla-server-api/json-ld", "rdf", "server"]
sparql-star = ["dep:medulla-rdf", "medulla-rdf/sparql-star", "medulla-server-api/sparql-star", "rdf", "server", "sparql"]
geosparql = ["dep:medulla-rdf", "medulla-rdf/geosparql", "medulla-server-api/geosparql", "query", "rdf", "redb", "server", "sparql"]
owl = ["dep:medulla-rdf", "medulla-rdf/owl", "medulla-protocol-types/owl", "medulla-server-api/owl", "medulla-server-ops/owl", "medulla-types/owl", "rdf", "server", "sparql"]
owl-dl = ["dep:medulla-rdf", "medulla-rdf/owl-dl", "medulla-server-api/owl-dl", "owl", "rdf", "server", "sparql"]
promql = ["dep:medulla-tsdb", "medulla-tsdb/promql", "medulla-server-api/promql", "medulla-store/promql", "query", "redb", "server", "tsdb"]
traces = ["dep:medulla-tsdb", "medulla-tsdb/traces", "medulla-server-api/traces", "medulla-store/traces", "query", "redb", "server", "tsdb"]
[dev-dependencies]
medulla-server-auth = { path = "../medulla-server-auth", features = ["test-support"] }
tempfile = "3"
