[package]
name = "medulla-raft"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine consensus and replication"
license = "MIT"
publish = false

[lib]
name = "medulla_raft"
path = "src/lib.rs"

