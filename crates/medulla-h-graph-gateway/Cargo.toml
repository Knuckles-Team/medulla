streaming = ["medulla-protocol-types/streaming", "medulla-server-api/streaming", "medulla-server-cdc/streaming", "medulla-server-mutation/streaming", "medulla-server-ops/streaming", "medulla-types/streaming", "medulla-query-types/streaming", "server"]
tsdb = ["dep:medulla-tsdb", "medulla-tsdb/redb-store", "redb", "medulla-server-api/tsdb", "medulla-server-ops/tsdb", "server"]
sparql-hash = ["dep:medulla-rdf", "medulla-rdf/sparql-hash", "medulla-server-api/sparql-hash", "rdf", "server", "sparql"]
rdf-xml = ["dep:medulla-rdf", "medulla-rdf/rdf-xml", "medulla-server-api/rdf-xml", "rdf", "server"]
