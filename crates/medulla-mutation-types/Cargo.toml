[package]
name = "medulla-mutation-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Mutation, batch, change envelope, commit descriptor, outbox, lease and consensus record types"
license = "MIT"
publish = false

[lib]
name = "medulla_mutation_types"
path = "src/lib.rs"

[dependencies]
serde_bytes = "0.11.19"
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }
medulla-identity-types = { path = "../medulla-identity-types" }

[features]
wire-contract = ["medulla-types/wire-contract", "medulla-identity-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-types/wire-complete", "medulla-identity-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-identity-types/contract-schema"]

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-identity-types = { path = "../medulla-identity-types", features = ["test-support"] }
