[package]
name = "medulla-decision-outcome-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Decision outcome and governance types: answer ranking, guards, trust, triage, red team, promotion, recommendations, policy evolution and the current plan"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_outcome_types"
path = "src/lib.rs"

[dependencies]
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
schemars = { version = "1.2.3", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-work-types = { path = "../medulla-work-types" }
medulla-source-types = { path = "../medulla-source-types" }

[features]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-decision-types/contract-schema", "medulla-agent-types/contract-schema", "medulla-source-types/contract-schema", "medulla-work-types/contract-schema"]
test-support = ["medulla-types/test-support", "medulla-decision-types/test-support", "medulla-agent-types/test-support", "medulla-work-types/test-support", "medulla-source-types/test-support"]