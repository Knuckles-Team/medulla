[package]
name = "medulla-index-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Semantic index, embedding, managed index and entity resolution types"
license = "MIT"
publish = false

[lib]
name = "medulla_index_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }

[features]
wire-contract = ["medulla-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema"]
