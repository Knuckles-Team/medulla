[package]
name = "medulla-virtual-graph"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Attached sources read as virtual graphs: OBDA mappings, source selection and source authority checks"
license = "MIT"
publish = false

[lib]
name = "medulla_virtual_graph"
path = "src/lib.rs"

[dependencies]
medulla-rdf = { path = "../medulla-rdf" }
medulla-core = { path = "../medulla-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
medulla-types = { path = "../medulla-types" }
oxrdf = { version = "0.3", optional = true }
spargebra = { version = "0.4", optional = true }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-identity-types = { path = "../medulla-identity-types" }

[features]
rdf = ["dep:oxrdf", "medulla-rdf/rdf"]
sparql = ["rdf", "dep:spargebra", "medulla-rdf/sparql"]
