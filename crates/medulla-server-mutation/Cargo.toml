[package]
name = "medulla-server-mutation"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Served mutation, mutation batches and transactions"
license = "MIT"
publish = false

[lib]
name = "medulla_server_mutation"
path = "src/lib.rs"

[dependencies]
medulla-server-api = { path = "../medulla-server-api" }
async-trait = { version = "0.1", optional = true }
dashmap = "6.2"
hex = "0.4"
medulla-capabilities = { path = "../medulla-capabilities", optional = true }
medulla-core = { path = "../medulla-core" }
medulla-graphql = { path = "../medulla-graphql", optional = true }
medulla-kernel = { path = "../medulla-kernel" }
medulla-modality = { path = "../medulla-modality", optional = true }
medulla-program = { path = "../medulla-program", optional = true }
medulla-storage = { path = "../medulla-storage", optional = true }
medulla-transaction = { path = "../medulla-transaction", optional = true }
medulla-types = { path = "../medulla-types" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"], optional = true }
tracing = "0.1"
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-catalog-types = { path = "../medulla-catalog-types" }
medulla-index-types = { path = "../medulla-index-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
medulla-protocol-types = { path = "../medulla-protocol-types" }
medulla-result-types = { path = "../medulla-result-types" }
medulla-graph-core = { path = "../medulla-graph-core" }
medulla-isolation = { path = "../medulla-isolation" }
medulla-graph-algos = { path = "../medulla-graph-algos" }
medulla-sql = { path = "../medulla-sql" }
medulla-table-store = { path = "../medulla-table-store" }
medulla-tables = { path = "../medulla-tables" }
medulla-work-types = { path = "../medulla-work-types" }

medulla-epistemic = { path = "../medulla-epistemic", optional = true }
medulla-jobs = { path = "../medulla-jobs", optional = true }
medulla-plan = { path = "../medulla-plan", optional = true }
medulla-rdf = { path = "../medulla-rdf", optional = true }
medulla-shacl = { path = "../medulla-shacl", optional = true }
medulla-tsdb = { path = "../medulla-tsdb", optional = true }
redb = { workspace = true, optional = true }

[features]
broker = ["medulla-server-api/broker"]
cypher = ["medulla-server-api/cypher"]
epistemic = ["query", "dep:medulla-plan", "dep:medulla-modality", "dep:medulla-epistemic", "medulla-server-api/epistemic"]
epistemic-tms = ["epistemic", "dep:medulla-epistemic", "medulla-server-api/epistemic-tms"]
graphlearn = ["medulla-server-api/graphlearn"]
graphql = ["dep:medulla-graphql", "medulla-server-api/graphql"]
jobs = ["mining", "epistemic", "dep:medulla-jobs", "dep:medulla-capabilities", "medulla-server-api/jobs"]
kv = ["redb", "medulla-server-api/kv"]
metrics = ["medulla-server-api/metrics"]
mining = ["medulla-server-api/mining"]
ml-pipeline = ["mining", "graphlearn", "medulla-server-api/ml-pipeline"]
modality-serving = ["redb", "streaming", "dep:medulla-modality", "dep:medulla-capabilities", "medulla-server-api/modality-serving"]
program-optimization = ["jobs", "dep:medulla-program", "medulla-server-api/program-optimization"]
query = ["redb", "dep:medulla-tsdb", "dep:medulla-plan", "medulla-server-api/query"]
raft = ["redb", "medulla-server-api/raft"]
rdf = ["dep:medulla-rdf", "medulla-server-api/rdf"]
reasoning = ["medulla-server-api/reasoning"]
redb = ["dep:redb", "dep:medulla-transaction", "dep:medulla-storage", "medulla-server-api/redb"]
shacl = ["rdf", "dep:medulla-shacl", "medulla-server-api/shacl"]
sparql-http = ["shacl", "medulla-server-api/sparql-http"]
statechart = ["dep:medulla-capabilities", "medulla-server-api/statechart"]
streaming = ["medulla-server-api/streaming"]
test-support = ["medulla-server-api/test-support"]
