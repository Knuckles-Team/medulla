# Crate stability layers (MEDULLA-SDLC-R021).
#
# Layers are listed most stable first. Every workspace crate sits in exactly one layer and its
# [dependencies], [build-dependencies] and target dependency tables name only crates of its own
# or an earlier layer. Dev-dependencies are not layered: a test may reach upward.
# Checked by `layer_findings` in scripts/check_crate_graph.py; there is no allowance list.
layers:
  - name: contract
    summary: "Wire and value types. The engine contract, the domain type slices, the capability ledger and the method codec. No logic that touches a store."
    crates:
      - medulla-agent-types
      - medulla-capabilities
      - medulla-catalog-types
      - medulla-decision-outcome-types
      - medulla-decision-types
      - medulla-identity-types
      - medulla-index-types
      - medulla-method-codec
      - medulla-mutation-types
      - medulla-protocol-types
      - medulla-result-types
      - medulla-source-types
      - medulla-types
      - medulla-version
      - medulla-vocab
      - medulla-work-types
  - name: kernels
    summary: "Pure domain logic and modality kernels over contract types: numeric, vector, text, geo, media, decision, quantum and visualization kernels. No storage."
    crates:
      - medulla-alignment
      - medulla-ann
      - medulla-asr-whisper
      - medulla-audio
      - medulla-catalog
      - medulla-competency
      - medulla-competency-xsrc
      - medulla-decision-eval
      - medulla-decision-memory
      - medulla-decision-plan
      - medulla-decision-policy
      - medulla-decision-rank
      - medulla-decision-records
      - medulla-decision-stats
      - medulla-document
      - medulla-enrich
      - medulla-finance
      - medulla-finance-market
      - medulla-geo
      - medulla-image
      - medulla-ingest
      - medulla-lake
      - medulla-modality
      - medulla-numeric
      - medulla-packs
      - medulla-parity
      - medulla-placement
      - medulla-program
      - medulla-quantum-core
      - medulla-quantum-gates
      - medulla-quantum-hardware
      - medulla-quantum-sim
      - medulla-repo-index
      - medulla-resource
      - medulla-sdlc
      - medulla-semantic-index
      - medulla-sqlite-format
      - medulla-stream
      - medulla-text
      - medulla-tts-piper
      - medulla-video
      - medulla-viz-columnstore
      - medulla-viz-core
      - medulla-viz-export
      - medulla-viz-graph-tiles
      - medulla-viz-kernels
      - medulla-wasm
  - name: storage
    summary: "Durable primitives: the key-value store, transactions, caches and tables."
    crates:
      - medulla-ann-codes
      - medulla-direct-state
      - medulla-durable
      - medulla-kvcache
      - medulla-query-cache
      - medulla-statechart
      - medulla-storage
      - medulla-storage-owner
      - medulla-tables
      - medulla-transaction
  - name: graph-core
    summary: "The graph data model over storage, its isolation layer and the core engine facade."
    crates:
      - medulla-core
      - medulla-graph-core
      - medulla-isolation
  - name: engine
    summary: "Engine and query: compute, reasoning, the SQL, Cypher, UQL and GraphQL front ends, the planner and executor, and the stores built on the graph core."
    crates:
      - medulla-compute
      - medulla-cypher
      - medulla-epistemic
      - medulla-exec
      - medulla-federation
      - medulla-finance-quant
      - medulla-graph-algos
      - medulla-graphql
