[package]
name = "medulla-catalog-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Connector pack, schema, catalog, source ingestion, lineage and release record types"
license = "MIT"
publish = false

[lib]
name = "medulla_catalog_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
oxiri = "0.2.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }
medulla-agent-types = { path = "../medulla-agent-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }

[features]
wire-contract = ["medulla-types/wire-contract", "medulla-mutation-types/wire-contract", "medulla-agent-types/wire-contract"]
wire-complete = ["wire-contract", "medulla-types/wire-complete", "medulla-mutation-types/wire-complete", "medulla-agent-types/wire-complete"]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-mutation-types/contract-schema", "medulla-agent-types/contract-schema"]
test-support = ["medulla-types/test-support", "medulla-agent-types/test-support"]
