[package]
name = "medulla-work-types"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Work items, work market, control leases, host start, jobs, worker registry, run history and orchestration record types"
license = "MIT"
publish = false

[lib]
name = "medulla_work_types"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-query-types = { path = "../medulla-query-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
schemars = { version = "1.2.3", optional = true }
medulla-result-types = { path = "../medulla-result-types" }
medulla-mutation-types = { path = "../medulla-mutation-types" }
serde_bytes = "0.11.19"
medulla-workspace-hack = { version = "0.1", path = "../medulla-workspace-hack" }

[features]
contract-schema = ["dep:schemars", "medulla-types/contract-schema", "medulla-query-types/contract-schema", "medulla-mutation-types/contract-schema", "medulla-result-types/contract-schema"]
jobs = ["medulla-types/jobs"]
program-optimization = ["jobs", "medulla-types/program-optimization"]
# CONCEPT:INT-P2-2 — the native statechart engine: gates the `statechart` wire module of this crate
# (`StatechartOp`) + the `Method::Statechart` variant. Pure serde/enum-variant gate,
# same shape as `jobs`; the durable engine (typed model + redb store + pure transition
# function) lives in `medulla-statechart` (above this crate in the DAG) and the facade wires
# it through `statechart`, included in the main `full` build.
statechart = []
test-support = ["medulla-types/test-support", "medulla-query-types/test-support"]

# MEDULLA-UNIFIED-DATA-PLANE-R700.6 hot-path receipt; nightly only, never gates a PR.
[[bench]]
name = "action_apply"
path = "benches/action_apply.rs"
harness = false

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
