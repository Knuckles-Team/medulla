# The attached-engine conformance matrix (MEDULLA-UNIFIED-DATA-PLANE-R022.2).
#
# One table per engine version the nightly run covers. No entry carries a digest: the
# pipelines workflow that pulls each image writes the digests into a manifest outside this
# repository and passes its path in MEDULLA_CONFORMANCE_IMAGE_MANIFEST.

[[engine]]
dialect = "postgres"
version = "16"
image = "postgres:16"
dsn_env = "MEDULLA_CONFORMANCE_POSTGRES_DSN"

[[engine]]
dialect = "mysql"
version = "8.4"
image = "mysql:8.4"
dsn_env = "MEDULLA_CONFORMANCE_MYSQL_DSN"

[[engine]]
dialect = "mariadb"
version = "11.4"
image = "mariadb:11.4"
dsn_env = "MEDULLA_CONFORMANCE_MARIADB_DSN"

[[engine]]
dialect = "clickhouse"
version = "24.8"
image = "clickhouse/clickhouse-server:24.8"
dsn_env = "MEDULLA_CONFORMANCE_CLICKHOUSE_DSN"

# The in-repository fixture: needs no image, DSN or digest.
[[engine]]
dialect = "sqlite"
version = "3"
