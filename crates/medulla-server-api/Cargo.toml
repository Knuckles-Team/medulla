[package]
name = "medulla-server-api"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine server state, auth, access, mutation batch API and the crate-split seam traits"
license = "MIT"
publish = false

[lib]
name = "medulla_server_api"
path = "src/lib.rs"

[dependencies]

[features]
alignment = ["blob"]
amqp-wire = ["broker", "server"]
ann-redb = ["redb"]
asr-whisper = ["server"]
ast = []
blob = ["server", "redb"]
blob-s3 = ["blob"]
broker = []
cdc-kafka = ["streaming"]
compute-dist = ["raft"]
cypher = []
decide = ["jobs", "redb", "shacl"]
epistemic = ["query"]
epistemic-tms = ["epistemic"]
federation = ["query", "server"]
federation-search = ["server", "federation"]
federation-sql = ["federation"]
graphlearn = []
graphql = ["server", "security"]
jobs = ["server", "mining", "epistemic"]
knowledge-batch = ["query"]
kv = ["server", "redb"]
lake = ["server", "blob", "tsdb"]
matview = ["query", "result-cache", "streaming"]
metrics = []
mining = []
ml-pipeline = ["mining", "graphlearn"]
modality-serving = ["server", "redb", "security", "streaming"]
mqtt-wire = ["broker", "server"]
mssql-wire = ["query", "server"]
nl-query = ["query", "server"]
obs = ["server", "tsdb", "text", "blob"]
oidc = []
otel-export = ["obs", "metrics"]
owl = ["sparql"]
program-optimization = ["jobs"]
quantum-agent-api = ["server"]
query = ["redb"]
raft = ["server", "redb"]
rdf = ["server"]
rdf-xml = ["rdf"]
reasoning = []
redb = []
redis-wire = ["kv", "server"]
result-cache = []
security = ["redb", "oidc"]
server = []
shacl = ["rdf"]
sparql = ["rdf"]
sparql-http = ["sparql", "server", "shacl", "security"]
sparql-service = ["sparql-http", "federation"]
sparql-star = ["sparql"]
statechart = ["server"]
stomp-wire = ["broker", "server"]
stream = ["query"]
streaming = ["server"]
text = ["query"]
tsdb = ["server", "redb"]
viz = []
viz-static-export = ["server"]
wasm-udf = ["server"]
