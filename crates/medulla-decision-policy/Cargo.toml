[package]
name = "medulla-decision-policy"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "medulla-engine: Ladder stages 3-5: policy, hard constraints, knobs, admission, refusals, budgets and the bounded exact solve"
license = "MIT"
publish = false

[lib]
name = "medulla_decision_policy"
path = "src/lib.rs"

[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-query-types = { path = "../medulla-query-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
# The capability wire name in placement reads the serde spelling.
serde_json = "1.0"
tracing = "0.1"
medulla-decision-types = { path = "../medulla-decision-types" }
medulla-agent-types = { path = "../medulla-agent-types" }

[features]
solve = []

[dev-dependencies]
medulla-types = { path = "../medulla-types", features = ["test-support"] }
medulla-decision-types = { path = "../medulla-decision-types", features = ["test-support"] }
criterion = "0.8"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1.0"

# Assembly-scale solver bench (Decide A3): 64 candidates x 32 capabilities with
# exactly-one, implication, budget and cardinality rows, solved and verified.
# Run: `cargo bench -p medulla-decision-policy --features solve --bench solve_cover`.
[[bench]]
name = "solve_cover"
path = "benches/solve_cover.rs"
harness = false
required-features = ["solve"]

# Placement-plan solve bench (MEDULLA-PLACEMENT-R700.6), group `decide/placement_plan`.
# Run: `cargo bench -p medulla-decision-policy --features solve --bench placement_plan`.
[[bench]]
name = "placement_plan"
path = "benches/placement_plan.rs"
harness = false
required-features = ["solve"]
